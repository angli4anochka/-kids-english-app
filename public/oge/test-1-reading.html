t:bold;font-size:13px}

:root{color-scheme:dark;--page-bg:#111222;--card-bg:#1b132a;--border:rgba(157,117,205,.18);--text:#f4f2f7;--muted:#a69caf;--cyan:#2dd8f7}

.app{width:100%;max-width:none;margin:0;height:100dvh;padding:12px;gap:12px}header,footer{background:#171426;border:1px solid var(--border);border-radius:16px;color:var(--text)}.panel{background:linear-gradient(145deg,#21172f,#1b132a 70%);border:1px solid var(--border);border-radius:23px;padding:18px;box-shadow:inset 0 1px 0 rgba(203,166,249,.04);gap:14px}.screen{gap:14px;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}h1{font-weight:800;color:#f4f2f7}h2{color:var(--cyan);font-size:21px;font-weight:800}.muted,.status{color:var(--muted)}button,select{background:#21182f;color:#e9e0f1;border:1px solid var(--border);border-radius:10px;font-weight:650}button:hover:not(:disabled){background:#2c203c;border-color:rgba(45,216,247,.35)}button.active,.chosen{background:rgba(45,216,247,.08);border-color:rgba(45,216,247,.65);color:var(--cyan)}button:focus-visible,select:focus-visible{outline-color:var(--cyan)}.tabs button{min-width:38px;min-height:36px}.questions{align-content:start;gap:9px;font-size:clamp(14px,1.15vw,18px);line-height:1.4}.question{padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:#21182f;font-weight:600}.question strong{color:var(--cyan);font-size:22px;font-family:"Bahnschrift SemiCondensed","Arial Narrow",sans-serif;line-height:1.15;min-width:22px}.copy{color:#e9e1f0;font-size:clamp(16px,1.4vw,21px);line-height:1.7}.statement{font-weight:750;color:var(--text);font-size:clamp(18px,1.8vw,26px)}.choices{gap:9px}.choices button{padding:13px 15px;min-height:44px;background:#21182f}.choices button.chosen{background:rgba(45,216,247,.08);border-color:rgba(45,216,247,.65);color:var(--cyan)}.answer{border-color:var(--border)}.success,.correct{color:#79d9ac}.error,.wrong{color:#f49ab7}#finish,.listen{background:var(--cyan);color:#113443;border:1px solid rgba(116,239,255,.25);font-weight:800;min-height:38px;padding:8px 13px}#finish:hover:not(:disabled),.listen:hover:not(:disabled){background:#67e7fb}.panel-heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.listen{font-size:12px;min-height:38px;flex-shrink:0}.copy,.questions,.statement{scrollbar-width:thin;scrollbar-color:#604775 transparent}

</style></head><body><div class="app">
<header><h1>ОГЭ · Reading</h1><nav class="nav"><button class="active" data-screen="matching">Задание 12</button><button data-screen="owl">Задания 13–19</button></nav><span id="progress">0 / 13</span></header>
<main class="screen active" id="matching"><section class="panel"><h2>Вопросы 1–7</h2><p class="muted">Какой вопрос соответствует каждому тексту? Один вопрос лишний.</p><div class="questions" id="questions"></div></section><section class="panel"><div class="panel-heading"><h2>Тексты A–F</h2><button class="listen" id="listenText">&#9654; Listen</button></div><div class="tabs" id="letters"></div><article class="copy" id="text"></article><div class="answer"><label for="matchAnswer" id="matchLabel"></label><select id="matchAnswer"><option value="">Выберите вопрос</option></select><span class="review" id="matchReview"></span></div></section></main>
<main class="screen" id="owl"><section class="panel"><div class="panel-heading"><h2>The Owl</h2><button class="listen" id="listenStory">Play Listen</button></div><div class="pager"><button id="prevPage" aria-label="Предыдущая страница текста">←</button><span class="muted" id="pageLabel"></span><button id="nextPage" aria-label="Следующая страница текста">→</button></div><article class="copy" id="story"></article></section><section class="panel"><h2>Statements 13–19</h2><div class="tabs" id="numbers"></div><p class="statement" id="statement"></p><div class="choices" id="choices"><button data-value="1">1 · True</button><button data-value="2">2 · False</button><button data-value="3">3 · Not stated</button></div><div class="review" id="statementReview"></div></section></main>
<footer><span class="status" id="saveStatus" role="status">Подключение к уроку…</span><span id="notice" role="status"></span><button id="finish">Завершить Reading</button></footer></div>
<script>
const DATA={"texts": ["Tourism has become a popular activity. Indeed, nowadays people travel more, and further, than they used to. The main reasons for tourism are: recreation, leisure and business. When travelling for recreation, people want to escape their stressful daily routine and to relax. Beach holidays are an example of such tourism. Business trips involve going to a distant place in order to settle business issues.", "Whether on a business trip or on a honeymoon, people want to explore the place they are in. They go on excursions, try new activities like diving or mountain climbing and learn about the historical background of the place and its cultural peculiarities. Sometimes they find out amazing facts about people and places and about themselves too! In fact, when people travel, they broaden their horizons.", "A new branch of tourism is ecotourism. It involves visiting relatively untouched places in remote areas. Ecotourism is often misinterpreted as any form of tourism involving wildlife – but it’s completely different from jungle tourism or safari. Eco-tourists are against disturbing the environment; even taking photos is not recommended. <em>Take only memories and leave only footprints</em> is a very popular slogan for them.", "By educational tourism, most people mean different versions of <em>Learn and Travel Programmes</em> for students. But it’s not only for the young and brave. Lots of training and educational programmes for adults are offered in different corners of the world. Retired people participate in these programmes too. They gladly enroll on overseas courses ranging from gardening and design to computer skills and programming.", "If possible, consider means of transport other than the plane. Rapidly increasing numbers of flights have put the environment in danger. Planes pollute the air, which results in global warming. In fact, tourism is not harmless fun as many may think: new airports and tourist infrastructure, pollution and crowds of noisy tourists make wild animals migrate, which may decrease their population or even make them extinct.", "With all its benefits, travelling is still a very expensive activity and may not fit every budget. To reduce the costs, avoid travelling in high season when flight tickets and hotels are overpriced. Remember that, along with expensive destinations, there are less prestigious but even more interesting places. When planning a trip, find out about low-cost airlines, discounts and special offers."], "paragraphs": ["Joan Harrison was walking along the street. She was shy and always felt lonely and upset. Joan worked as a secretary in an office in the city centre. It was lunch time and she went out to get some air. She was looking absently at the shop-windows when she saw a brown wooden owl in one of them. Suddenly Joan stopped. Joan was totally indifferent to birds and she had never understood people who collected useless statues. But for some reason she could not take her eyes off the owl. The wooden owl drew Joan to itself.", "Joan decided to buy the owl. She earned a little, just to pay for her room and food. She couldn’t afford new clothes. Even a ticket to the cinema was a heavy expense for her. But this time Joan was sure that she had to buy the wooden owl. Joan opened the door of the shop. She asked the shop assistant about the price of the wooden owl. It was fifty pounds. Joan understood that it was sheer madness to buy such an expensive wooden bird. But she did it without any hesitation.", "The next morning she left her house in a very good mood. Now, having the owl at home, Joan made it a habit to say good-bye and touch the owl’s head before leaving. Amazingly, after this simple gesture she was cheerful and energetic the whole day. One morning, when patting the owl on the head, Joan remembered her wish to join the evening pottery class at college. She had often thought about it but always changed her mind at the last moment. Now she decided to fulfill her wish.", "At the pottery class Joan achieved considerable results. Her teacher said she had a unique style. Nobody knew that she worked hard at home. Under the owl’s observation Joan experimented with forms and colours. Once she took part in the students’ show at the college, and the Museum of Arts asked her to sell her works for two thousand pounds. The sum covered all her debts and she could afford to buy a new dress and shoes and even more.", "The next step was the annual National Art Festival, at which a secretary, Joan Harrison, presented her personal exhibition. Her fame and income were growing. Joan left her office and became a potter. A year later she and the art director of the museum were happily married. They moved to a large country house and now Joan had her own pottery.", "Joan took the lucky owl with her. It took its honorary place in the large living room. In her last years she often remembered the shop where she had bought the owl, her evening classes and her first steps in pottery. Joan was so proud of the owl that each piece of her pottery had a picture of the owl on it. Lots of famous artists and important people visited Joan and her husband, but Joan never gave her owl to anybody until her dying day."], "questions": ["What nature-friendly ideas started a new branch in the tourism business?", "What means of transport is the most popular with tourists?", "Why can tourism be dangerous to nature?", "What are the reasons that make people go on a trip?", "What kind of tourism is getting popular with elderly people?", "Why does travelling make people smarter?", "What are the ways to save money while travelling?"], "statements": [{"n": 13, "text": "Joan collected small statues of birds.", "answer": "2"}, {"n": 14, "text": "Joan had a well-paid job.", "answer": "2"}, {"n": 15, "text": "The wooden owl improved Joan’s mood.", "answer": "1"}, {"n": 16, "text": "Joan joined the pottery class because of her friends’ advice.", "answer": "3"}, {"n": 17, "text": "Joan successfully participated in art exhibitions.", "answer": "1"}, {"n": 18, "text": "There was an image of the owl on Joan’s every work.", "answer": "1"}, {"n": 19, "text": "After Joan’s death the wooden owl disappeared from her house.", "answer": "3"}], "key": ["4", "6", "1", "5", "3", "7"]};
const $=id=>document.getElementById(id), letters=['A','B','C','D','E','F'], labels={'1':'True','2':'False','3':'Not stated'};
let answers=Array(13).fill(''), textIndex=0, questionIndex=0, pageIndex=0, completed=false, context=null, storageKey=null, revision=0;
const startedAt=Date.now();
letters.forEach((letter,index)=>{const button=document.createElement('button');button.textContent=letter;button.onclick=()=>{textIndex=index;render()};$('letters').append(button)});
DATA.questions.forEach((question,index)=>{const line=document.createElement('div');line.className='question';const n=document.createElement('strong');n.textContent=(index+1)+'.';const text=document.createElement('span');text.textContent=question;line.append(n,text);$('questions').append(line);const option=document.createElement('option');option.value=String(index+1);option.textContent=(index+1)+' · '+question;$('matchAnswer').append(option)});
// Keep the answer selector compact even when the original question is long.
Array.from($('matchAnswer').options).forEach((option,index)=>{if(index)option.textContent=String(index)});
DATA.statements.forEach((item,index)=>{const button=document.createElement('button');button.textContent=item.n;button.onclick=()=>{questionIndex=index;render()};$('numbers').append(button)});
document.querySelectorAll('[data-screen]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-screen]').forEach(b=>b.classList.toggle('active',b===button));document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===button.dataset.screen))});
function snapshot(){const results=answers.map((value,index)=>{const matching=index<6,expected=matching?DATA.key[index]:DATA.statements[index-6].answer;return {questionIndex:index,questionLabel:matching?'12 · '+letters[index]:String(DATA.statements[index-6].n),prompt:matching?'Текст '+letters[index]+': выберите соответствующий вопрос':DATA.statements[index-6].text,studentAnswer:matching?(value?value+' · '+DATA.questions[Number(value)-1]:''):(labels[value]||''),correctAnswer:matching?expected+' · '+DATA.questions[Number(expected)-1]:labels[expected],selectedValue:value,correctValue:expected,isCorrect:value===expected,answered:!!value}});return {type:'oge-reading-progress',revision:++revision,results,answers,score:results.filter(r=>r.isCorrect).length,total:13,status:completed?'completed':'in_progress',timeSeconds:Math.round((Date.now()-startedAt)/1000),source:'oge-reading',completed}}
function publish(){if(storageKey){try{localStorage.setItem(storageKey,JSON.stringify({answers,completed}))}catch{}}if(context){$('saveStatus').textContent=context.isTeacher?'Предпросмотр учителя':'Сохранение…';$('saveStatus').className='status';window.parent.postMessage(snapshot(),location.origin)}else if(window.parent===window){$('saveStatus').textContent='Предпросмотр · ответы не отправляются'}}
function change(index,value){if(completed)return;answers[index]=value;render();publish()}
$('matchAnswer').onchange=e=>change(textIndex,e.target.value);
document.querySelectorAll('[data-value]').forEach(button=>button.onclick=()=>change(6+questionIndex,button.dataset.value));
$('prevPage').onclick=()=>{pageIndex=Math.max(0,pageIndex-1);render()};$('nextPage').onclick=()=>{pageIndex=Math.min(5,pageIndex+1);render()};
function feedback(id,index){const el=$(id), expected=index<6?DATA.key[index]:DATA.statements[index-6].answer;el.textContent=completed?(answers[index]===expected?'✓ Верно':'Правильный ответ: '+(index<6?expected:labels[expected])):'';el.className='review '+(answers[index]===expected?'correct':'wrong')}
function render(){$('text').innerHTML=DATA.texts[textIndex];$('story').innerHTML=DATA.paragraphs[pageIndex];$('pageLabel').textContent='Страница '+(pageIndex+1)+' / 6';$('prevPage').disabled=pageIndex===0;$('nextPage').disabled=pageIndex===5;$('matchLabel').textContent='Текст '+letters[textIndex]+' → вопрос';$('matchAnswer').value=answers[textIndex];$('matchAnswer').disabled=completed;$('statement').textContent=DATA.statements[questionIndex].text;$('progress').textContent=answers.filter(Boolean).length+' / 13';[...$('letters').children].forEach((b,i)=>b.className=(i===textIndex?'active ':'')+(answers[i]?'filled':''));[...$('numbers').children].forEach((b,i)=>b.className=(i===questionIndex?'active ':'')+(answers[i+6]?'filled':''));document.querySelectorAll('[data-value]').forEach(b=>{b.classList.toggle('chosen',b.dataset.value===answers[6+questionIndex]);b.disabled=completed});feedback('matchReview',textIndex);feedback('statementReview',6+questionIndex);$('finish').textContent=completed?'Reading завершён':'Завершить Reading';$('finish').disabled=completed}
$('finish').onclick=()=>{if(answers.some(a=>!a)){$('notice').textContent='Ответьте на все 13 пунктов.';return}completed=true;$('notice').textContent='Результат: '+answers.filter((v,i)=>v===(i<6?DATA.key[i]:DATA.statements[i-6].answer)).length+' / 13';render();publish()};
window.addEventListener('message',event=>{if(event.source!==parent||event.origin!==location.origin||!event.data)return;const data=event.data;if(data.type==='oge-reading-context'){context=data;storageKey='oge-reading:'+data.storageKey;try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved&&Array.isArray(saved.answers)&&saved.answers.length===13){answers=saved.answers.map((v,i)=>typeof v==='string'&&/^[1-7]?$/.test(v)&&(i<6||!v||Number(v)<=3)?v:'');completed=!!saved.completed&&answers.every(Boolean)}}catch{}render();$('saveStatus').textContent=data.isTeacher?'Предпросмотр учителя':'Ответы сохраняются автоматически';if(answers.some(Boolean))publish()}if(data.type==='oge-reading-save-status'&&data.revision===revision){$('saveStatus').textContent=data.ok?'✓ Ответы сохранены':'Не удалось сохранить · повторяем…';$('saveStatus').className='status '+(data.ok?'success':'error')}});
render();window.parent.postMessage({type:'oge-reading-ready'},location.origin);if(window.parent===window)publish();

let activeSpeechButton=null;
function stopSpeech(){if('speechSynthesis' in window)speechSynthesis.cancel();if(activeSpeechButton)activeSpeechButton.textContent='Play Listen';activeSpeechButton=null}
function speakPassage(button,id){if(!('speechSynthesis' in window))return;if(activeSpeechButton===button){stopSpeech();return}stopSpeech();const speech=new SpeechSynthesisUtterance($(id).textContent);speech.lang='en-GB';speech.rate=.9;activeSpeechButton=button;button.textContent='Stop';speech.onend=()=>{if(activeSpeechButton===button){button.textContent='Play Listen';activeSpeechButton=null}};speech.onerror=speech.onend;speechSynthesis.speak(speech)}
$('listenText').onclick=e=>speakPassage(e.currentTarget,'text');$('listenStory').onclick=e=>speakPassage(e.currentTarget,'story');
if(!('speechSynthesis' in window))document.querySelectorAll('.listen').forEach(b=>b.disabled=true);
window.addEventListener('pagehide',stopSpeech);
document.querySelectorAll('[data-screen],#letters button,#prevPage,#nextPage').forEach(b=>b.addEventListener('click',stopSpeech));
</script></body></html>

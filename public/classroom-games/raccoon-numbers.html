<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raccoon Numbers 1–9</title>
<style>
:root {
  --bg:#f7f5ff;
  --panel:#ffffffee;
  --ink:#303553;
  --muted:#727896;
  --line:#e5def5;
  --purple:#7868e8;
  --purple2:#eee9ff;
  --green:#4dbb83;
  --red:#ef7783;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  overflow:hidden;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 8% 8%,rgba(255,170,205,.18),transparent 22%),
    radial-gradient(circle at 92% 5%,rgba(120,104,232,.14),transparent 24%),
    var(--bg);
}
button{font:inherit}

.app{
  height:100vh;
  padding:8px 10px;
  display:grid;
  grid-template-rows:44px minmax(0,1fr);
  gap:7px;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:5px 10px;
  border:1px solid var(--line);
  border-radius:15px;
  background:var(--panel);
}
.brand{display:flex;align-items:center;gap:9px}
.icon{
  width:30px;height:30px;border-radius:10px;
  background:var(--purple2);
  display:grid;place-items:center;font-size:16px;
}
.brand strong{display:block;font-size:15px;line-height:1}
.brand span{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.top-status{
  font-size:10px;
  color:var(--muted);
  font-weight:900;
}

.main{
  min-height:0;
  display:grid;
  grid-template-columns:minmax(360px,1fr) minmax(250px,.72fr);
  gap:8px;
}
.panel{
  min-height:0;
  border:1px solid var(--line);
  border-radius:24px;
  background:var(--panel);
  overflow:hidden;
}

.left{
  padding:12px;
  display:grid;
  grid-template-rows:auto auto minmax(0,1fr);
  gap:9px;
}
.instructions{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:10px;
}
.instructions h1{
  margin:0;
  font-size:24px;
  line-height:1.02;
}
.instructions p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:11px;
}
.listen-state{
  min-width:150px;
  padding:8px 10px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#fff;
  font-size:11px;
  font-weight:950;
  text-align:center;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}
.btn{
  border:0;
  border-radius:12px;
  height:42px;
  font-size:12px;
  font-weight:950;
  cursor:pointer;
}
.btn.primary{background:var(--purple);color:#fff}
.btn.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}

.keypad{
  min-height:0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:9px;
}
.key{
  min-height:0;
  border:1px solid var(--line);
  border-radius:22px;
  background:#fff;
  color:var(--ink);
  font-size:clamp(34px,5vw,58px);
  font-weight:1000;
  cursor:pointer;
  transition:.14s ease;
  box-shadow:0 8px 18px rgba(65,50,95,.05);
}
.key:hover{transform:translateY(-2px);background:#faf9ff}
.key.correct{background:#eaf9f1;border-color:#a7dcc0;color:#257452}
.key.wrong{background:#fff0f2;border-color:#edb0b8;color:#b64d5b}

.right{
  padding:10px;
  display:grid;
  grid-template-rows:minmax(0,1fr) auto;
  gap:8px;
}
.raccoon{
  min-height:0;
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  background:#fff;
  display:grid;
  place-items:center;
}
.raccoon img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}
.message{
  min-height:62px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:18px;
  background:#fcfbff;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:14px;
  font-weight:900;
}

@media(max-height:720px){
  .app{grid-template-rows:38px minmax(0,1fr);padding:5px 7px;gap:5px}
  .topbar{padding:4px 8px;border-radius:12px}
  .brand strong{font-size:13px}
  .brand span{display:none}
  .main{grid-template-columns:minmax(320px,1fr) minmax(220px,.68fr);gap:6px}
  .left,.right{padding:8px;gap:6px}
  .instructions h1{font-size:19px}
  .instructions p{font-size:9px}
  .listen-state{font-size:9px;padding:6px 8px}
  .btn{height:35px;font-size:10px}
  .keypad{gap:6px}
  .key{border-radius:16px}
  .message{min-height:48px;font-size:11px;padding:7px 9px}
}
@media(max-width:820px){
  body{overflow:auto}
  .app{height:auto;min-height:100vh}
  .main{grid-template-columns:1fr}
  .raccoon{min-height:300px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="icon">🦝</div>
      <div>
        <strong>Numbers 1–9</strong>
        <span>The raccoon says one number. Press what you hear.</span>
      </div>
    </div>
    <div class="top-status">5 numbers, then Well done!</div>
  </header>

  <main class="main">
    <section class="panel left">
      <div class="instructions">
        <div>
          <h1>Listen and press</h1>
          <p>Никакой подсказки цифрой на экране. Только звук.</p>
        </div>
        <div class="listen-state" id="state">Press START</div>
      </div>

      <div class="controls">
        <button class="btn primary" id="startBtn" type="button">🔊 START / NEXT</button>
        <button class="btn secondary" id="repeatBtn" type="button">Repeat</button>
      </div>

      <div class="keypad" id="keypad"></div>
    </section>

  const keypad = document.getElementById('keypad');
  const state = document.getElementById('state');
  const message = document.getElementById('message');

  let target = null;
  let active = false;
  let currentAudio = null;
  let nextTimer = null;
  let round = 0;
  const maxRounds = 5;

  const players = {};
  Object.entries(audioSources).forEach(([n, src]) => {
    const a = new Audio(src);
    a.preload = 'auto';
    players[n] = a;
  });

  const wellDoneAudio = new Audio(wellDoneAudioSrc);
  wellDoneAudio.preload = 'auto';

  for (let n = 1; n <= 9; n++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'key';
    b.textContent = n;
    b.dataset.n = n;
    b.addEventListener('click', () => checkNumber(n, b));
    keypad.appendChild(b);
  }

  function stopAudio() {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
    }
    wellDoneAudio.pause();
    wellDoneAudio.currentTime = 0;
  }

  function playTarget() {
    if (!target) return;
    stopAudio();
    currentAudio = players[target];
    currentAudio.currentTime = 0;
    currentAudio.play().catch(() => {
      state.textContent = 'Press START again';
      message.textContent = 'Browser blocked audio. Press START again.';
    });
  }

  function finishGame() {
    active = false;
    target = null;
    state.textContent = 'Well done!';
    message.textContent = 'Well done!';
    stopAudio();
    wellDoneAudio.play().catch(() => {
      // fallback: just keep the message if autoplay is blocked
    });
    keypad.querySelectorAll('.key').forEach(k => k.classList.remove('correct','wrong'));
  }

  function chooseNumber() {
    clearTimeout(nextTimer);

    if (round >= maxRounds) {
      finishGame();
      return;
    }

    target = 1 + Math.floor(Math.random() * 9);
    active = true;
    keypad.querySelectorAll('.key').forEach(k => k.classList.remove('correct','wrong'));
    state.textContent = 'Listen ' + (round + 1) + ' / ' + maxRounds;
    message.textContent = 'Which number?';
    playTarget();
  }

  function checkNumber(n, btn) {
    if (!active || !target) return;

    keypad.querySelectorAll('.key').forEach(k => k.classList.remove('correct','wrong'));

    if (n === target) {
      btn.classList.add('correct');
      active = false;
      round++;
      state.textContent = round < maxRounds ? 'Next...' : 'Finished';
      message.textContent = round < maxRounds ? '' : 'Well done!';
      nextTimer = setTimeout(() => {
        if (round >= maxRounds) finishGame();
        else chooseNumber();
      }, 800);
    } else {
      btn.classList.add('wrong');
      state.textContent = 'Listen again';
      message.textContent = '';
      nextTimer = setTimeout(() => {
        btn.classList.remove('wrong');
        playTarget();
      }, 350);
    }
  }

  function startGame() {
    round = 0;
    chooseNumber();
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('repeatBtn').addEventListener('click', () => {
    if (!target) {
      if (round >= maxRounds) {
        finishGame();
      } else {
        chooseNumber();
      }
    } else {
      playTarget();
    }
  });
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word + Picture Memory</title>
<style>
:root{
  --bg:#f5f8fc;
  --paper:#fff;
  --ink:#263142;
  --muted:#758094;
  --line:#dbe3ec;
  --purple:#7c62cb;
  --purple2:#efeaff;
  --green:#5bb96c;
  --shadow:0 16px 42px rgba(52,70,100,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#fff9ef,#f2f7ff);color:var(--ink)}
.app{height:100vh;display:grid;grid-template-rows:60px 1fr 34px}
header{
  background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;
  display:flex;align-items:center;justify-content:space-between
}
.brand{display:flex;align-items:center;gap:10px}
.icon{width:42px;height:42px;border-radius:13px;background:var(--purple2);display:grid;place-items:center;font-size:24px}
.brand h1{margin:0;font-size:20px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:11px}
.score{display:flex;gap:8px}
.pill{padding:7px 11px;border-radius:999px;background:#f7f9fc;border:1px solid var(--line);font-size:12px;font-weight:900}
main{min-height:0;padding:10px 14px}
.board-wrap{
  height:100%;background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px;
  box-shadow:var(--shadow);display:grid;grid-template-rows:auto 1fr;gap:10px
}
.topline{display:flex;align-items:end;justify-content:space-between;gap:12px}
.titlebox h2{margin:0;font-size:24px}
.titlebox p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.board{
  min-height:0;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  grid-template-rows:repeat(3,minmax(0,1fr));
  gap:10px
}
.card{perspective:900px;min-width:0;min-height:0;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .34s}
.card.open .inner,.card.matched .inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;overflow:hidden
}
.front{
  background:
    radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),transparent 24%),
    linear-gradient(135deg,#f5efff,#fff5df);
}
.front::before{
  content:"★";font-size:36px;color:var(--purple);font-weight:900
}
.back{transform:rotateY(180deg);background:#fff;padding:8px}
.word{font-size:26px;font-weight:1000;color:#3a465a;text-transform:lowercase}
.pic{width:100%;height:100%;object-fit:contain;border-radius:12px;background:#fff}
.card.matched .back{
  background:#effaf2;
  box-shadow:inset 0 0 0 3px #ccebd3
}
footer{display:flex;align-items:center;justify-content:center;background:#fff;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.finish{
  position:fixed;inset:0;background:rgba(30,38,54,.34);display:none;align-items:center;justify-content:center;z-index:20
}
.finish.show{display:flex}
.finishbox{
  width:min(460px,90vw);background:#fff;border-radius:22px;padding:24px;text-align:center;
  border:1px solid var(--line);box-shadow:0 25px 70px rgba(0,0,0,.2)
}
.finishbox .big{font-size:76px}
.finishbox h3{margin:8px 0 0;font-size:30px}
.finishbox p{margin:6px 0 0;color:var(--muted);font-weight:700}
@media(max-width:900px){
  .word{font-size:22px}
  .board{gap:8px}
}

button.card{border:0;padding:0;background:transparent;font:inherit;color:inherit}.restart{border:1px solid #dcd0fb;background:#efeaff;color:#6b50af;border-radius:10px;padding:7px 10px;font-weight:800;cursor:pointer}#playAgain{margin-top:18px}.card:focus-visible{outline:3px solid var(--purple);outline-offset:2px}footer{gap:10px}#saveStatus{font-size:10px}
@media(max-width:600px){.app{grid-template-rows:85px 1fr 34px}header{padding:8px;flex-wrap:wrap;gap:5px}.icon{display:none}.brand h1{font-size:17px}.brand p{font-size:10px}.score{gap:5px}.pill,.restart{padding:5px 8px;font-size:11px}main{padding:8px}.board-wrap{padding:8px;gap:8px}.titlebox h2{font-size:18px}.titlebox p{font-size:10px}.board{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:7px}.word{font-size:clamp(12px,3.5vw,20px)}.back{padding:4px}.face{border-radius:12px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div class="icon">🃏</div>
    <div>
      <h1>Word + Picture Memory</h1>
      <p>ugly · sad · beautiful · old · happy · young</p>
    </div>
  </div>
  <div class="score"><button class="restart" id="restartBtn" type="button">Restart</button>
    <div class="pill" id="moves">Moves: 0</div>
    <div class="pill" id="pairs">Pairs: 0 / 6</div>
  </div>
</header>

<main>
  <section class="board-wrap">
    <div class="topline">
      <div class="titlebox">
        <h2>Find the word and the picture</h2>
        <p>Open two cards. Find a matching pair.</p>
      </div>
    </div>
    <div class="board" id="board"></div>
  </section>
</main>

<footer>Find all 6 matching pairs.<span id="saveStatus" aria-live="polite"></span></footer>
</div>

<div class="finish" id="finish">
  <div class="finishbox">
    <div class="big">🎉</div>
    <h3>Great job!</h3>
    <p>You found all the pairs.</p><button class="restart" id="playAgain" type="button">Play again</button>
  </div>
</div>

<script src="/classroom-games/bridge.js"></script>
<script src="/classroom-games/feelings-memory.js"></script>
</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I have and I've got</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: auto;
    }

    .page {
      width: 1600px;
      height: 998px;
      background: #ffffff;
      position: relative;
      flex: 0 0 auto;
    }

    .page img {
      display: block;
      width: 1600px;
      height: 998px;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    @media (max-width: 1600px) {
      body {
        overflow-x: hidden;
      }

      .page {
        width: 100vw;
        height: calc(100vw * 998 / 1600);
      }

      .page img {
        width: 100vw;
        height: calc(100vw * 998 / 1600);
      }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="Grammar slide: I have and I've got">
    <img src="https://storage.yandexcloud.net/kids-app/public-assets/spotlight/img/ex39-embedded1.png" alt="I have ... and I've got ... grammar table" />
  </main>
</body>
</html>

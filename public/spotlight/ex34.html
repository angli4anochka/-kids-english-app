<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tony, Bill and Mark - Click Questions</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: "Comic Sans MS", "Comic Neue", "Trebuchet MS", Arial, sans-serif;
      cursor: pointer;
      user-select: none;
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
    }

    .page {
      position: absolute;
      left: 0;
      top: 0;
      width: 1879px;
      height: 1074px;
      background: #ffffff;
      transform-origin: top left;
      overflow: hidden;
    }

    .title {
      position: absolute;
      left: 21px;
      top: 31px;
      margin: 0;
      color: #000000;
      font-size: 49px;
      line-height: 1.08;
      font-weight: 400;
      letter-spacing: 0.1px;
      z-index: 20;
      white-space: nowrap;
    }

    .title strong {
      font-weight: 700;
    }

    .people {
      position: absolute;
      left: 535px;
      top: 361px;
      width: 820px;
      height: 684px;
      display: block;
      object-fit: contain;
      z-index: 1;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #000000;
      background: #c9d9f7;
      border: 2px solid #4d84cb;
      border-radius: 999px;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
      font-size: 39px;
      line-height: 1.12;
      font-weight: 400;
      padding: 12px 24px;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.98);
      transition: opacity 120ms ease, transform 120ms ease, visibility 120ms ease;
      pointer-events: none;
    }

    .bubble.show {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .b1 {
      left: 515px;
      top: 95px;
      width: 516px;
      height: 166px;
    }

    .b2 {
      left: 1186px;
      top: 132px;
      width: 485px;
      height: 171px;
    }

    .b3 {
      left: 35px;
      top: 250px;
      width: 533px;
      height: 188px;
    }

    .b4 {
      left: 1337px;
      top: 354px;
      width: 506px;
      height: 159px;
    }

    .b5 {
      left: 0px;
      top: 522px;
      width: 515px;
      height: 193px;
    }

    .b6 {
      left: 1338px;
      top: 622px;
      width: 515px;
      height: 179px;
    }
  </style>
</head>
<body>
  <div class="viewport" id="viewport">
    <main class="page" id="page">
      <h1 class="title">
        Use the adjectives in <strong>bold</strong> in Ex. 5 to ask and answer questions about Tony, Bill<br>
        and Mark.
      </h1>

      <div class="bubble b1">Is Tony slim?</div>
      <div class="bubble b2">Are Tony’s<br>eyes big?</div>
      <div class="bubble b3">Is Mark’s hair<br>long and curly?</div>
      <div class="bubble b4">Is Bill tall?</div>
      <div class="bubble b5">What colour<br>are Mark’s<br>boots?</div>
      <div class="bubble b6">Has Bill got a<br>tie?</div>

      <img class="people" src="https://storage.yandexcloud.net/kids-app/public-assets/spotlight/img/ex34_img0.webp" alt="Tony, Bill and Mark">
    </main>
  </div>

  <script>
    const page = document.getElementById('page');
    const bubbles = Array.from(document.querySelectorAll('.bubble'));
    let currentBubble = 0;

    function fitPage() {
      const baseWidth = 1879;
      const baseHeight = 1074;
      const scale = Math.min(window.innerWidth / baseWidth, window.innerHeight / baseHeight);
      page.style.transform = `scale(${scale})`;
    }

    document.addEventListener('click', function () {
      if (currentBubble < bubbles.length) {
        bubbles[currentBubble].classList.add('show');
        currentBubble += 1;
      }
    });

    window.addEventListener('resize', fitPage);
    fitPage();
  </script>
</body>
</html>

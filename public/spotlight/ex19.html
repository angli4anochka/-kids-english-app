<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Past forms with got</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #eeeeee;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage {
      position: relative;
      width: 1090px;
      height: 689px;
    }
    #slide {
      width: 1090px;
      height: 689px;
      transform-origin: top left;
      position: absolute;
      left: 0; top: 0;
    }
    img {
      width: 1090px;
      height: 689px;
      display: block;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="slide">
      <img src="https://storage.yandexcloud.net/kids-app/public-assets/spotlight/ex19-slide.png" alt="Past forms with got" />
    </div>
  </div>
  <script>
    const W = 1090, H = 689;
    const stage = document.getElementById('stage');
    const slide = document.getElementById('slide');
    function fitSlide() {
      const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
      stage.style.width = W * scale + 'px';
      stage.style.height = H * scale + 'px';
      slide.style.transform = 'scale(' + scale + ')';
    }
    window.addEventListener('resize', fitSlide);
    fitSlide();
  </script>
</body>
</html>

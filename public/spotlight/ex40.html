<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I have and I've got - Practice</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }
    #viewport {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    .page {
      width: 1724px;
      height: 1070px;
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: top left;
      background: #ffffff;
    }
    .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>
  <div id="viewport">
  <main class="page">
    <img src="https://storage.yandexcloud.net/kids-app/public-assets/spotlight/img/ex40-embedded1.png" alt="I have and I've got exercise page" />
  </main>
  </div>
  <script>
    function scalePage() {
      var scale = Math.min(window.innerWidth / 1724, window.innerHeight / 1070);
      document.querySelector('.page').style.transform = 'scale(' + scale + ')';
    }
    window.addEventListener('resize', scalePage);
    scalePage();
  </script>
</body>
</html>

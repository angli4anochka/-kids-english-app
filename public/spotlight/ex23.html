<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bill's Family Interactive</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #ffffff;
    }

    .stage {
      --scale: 1;
      position: absolute;
      left: 0;
      top: 0;
      width: 1918px;
      height: 1079px;
      transform: scale(var(--scale));
      transform-origin: top left;
      background: #ffffff;
      overflow: hidden;
    }

    .base-image {
      position: absolute;
      left: 0;
      top: 0;
      width: 1894px;
      height: 1022px;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      z-index: 1;
    }

    .answer {
      position: absolute;
      opacity: 0;
      transform: scale(0.985);
      transform-origin: center center;
      transition: opacity 0.28s ease, transform 0.28s ease;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      z-index: 4;
    }

    .answer.visible {
      opacity: 1;
      transform: scale(1);
    }

    .hotspot {
      position: absolute;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      z-index: 8;
    }

    .hotspot:hover {
      outline: 4px solid rgba(255, 255, 255, 0.45);
      outline-offset: -5px;
      border-radius: 3px;
    }

    .hotspot:focus-visible {
      outline: 4px solid rgba(255, 255, 255, 0.8);
      outline-offset: -5px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <main class="stage" id="stage" aria-label="Talk about Bill's family">
      <img class="base-image" src="/spotlight/img/ex23_img0.webp" alt="Talk about Bill's family, as in the example." />

      <img
        class="answer"
        id="answer-tom"
        src="/spotlight/img/ex23_img1.webp"
        style="left: 1037px; top: 74px; width: 871px; height: 193px;"
        alt="Tom is Bill's grandfather. He's 68 years old."
      />

      <img
        class="answer"
        id="answer-beth"
        src="/spotlight/img/ex23_img2.webp"
        style="left: 1190px; top: 278px; width: 718px; height: 232px;"
        alt="Beth is Bill's grandmother. She's 67 years old. She is nice."
      />

      <img
        class="answer"
        id="answer-sam"
        src="/spotlight/img/ex23_img3.webp"
        style="left: 1232px; top: 522px; width: 676px; height: 275px;"
        alt="Sam is Bill's father. He's 45 years old. He is strong."
      />

      <img
        class="answer"
        id="answer-kim"
        src="/spotlight/img/ex23_img4.webp"
        style="left: 850px; top: 801px; width: 1058px; height: 203px;"
        alt="Kim and Kate are Bill's sisters. They're 8 years old. They go to school."
      />

      <button class="hotspot" data-target="tom" aria-label="Open Tom answer" style="left: 1039px; top: 67px; width: 849px; height: 178px;"></button>
      <button class="hotspot" data-target="beth" aria-label="Open Beth answer" style="left: 1193px; top: 273px; width: 695px; height: 213px;"></button>
      <button class="hotspot" data-target="sam" aria-label="Open Sam answer" style="left: 1258px; top: 513px; width: 629px; height: 260px;"></button>
      <button class="hotspot" data-target="kim" aria-label="Open Kim and Kate answer" style="left: 852px; top: 800px; width: 1035px; height: 178px;"></button>
    </main>
  </div>

  <script>
    const STAGE_WIDTH = 1918;
    const STAGE_HEIGHT = 1079;
    const stage = document.getElementById("stage");

    function fitPage() {
      const padding = 10;
      const scale = Math.min(
        (window.innerWidth - padding) / STAGE_WIDTH,
        (window.innerHeight - padding) / STAGE_HEIGHT,
        1
      );
      stage.style.setProperty("--scale", Math.max(scale, 0.1).toString());
    }

    document.querySelectorAll(".hotspot").forEach((button) => {
      button.addEventListener("click", () => {
        const target = button.dataset.target;
        const answer = document.getElementById(`answer-${target}`);
        answer.classList.add("visible");
        button.style.display = "none";
      });
    });

    window.addEventListener("resize", fitPage);
    fitPage();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Students Letter Slide</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
  }
  body {
    display: grid;
    place-items: center;
    font-family: Arial, sans-serif;
  }
  .slide {
    position: relative;
    width: min(100vw, calc(100vh * 1914 / 1079));
    aspect-ratio: 1914 / 1079;
    background: #fff;
    overflow: hidden;
  }
  .frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    object-position: center;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  .click-layer {
    position: absolute;
    inset: 0;
    z-index: 2;
    cursor: pointer;
  }
  .hint {
    position: absolute;
    left: 50%;
    bottom: 2%;
    transform: translateX(-50%);
    z-index: 3;
    background: rgba(255,255,255,.88);
    color: #555;
    padding: .45em .8em;
    border-radius: 999px;
    font: 600 clamp(12px, 1.1vw, 18px)/1 Arial, sans-serif;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    transition: opacity .2s ease;
  }
  .hint.hidden { opacity: 0; }
</style>
</head>
<body>
  <main class="slide" aria-label="Students reading a letter slide with click-through questions and answers">
    <img class="frame" id="frame" alt="" />
    <div class="click-layer" id="clickLayer" aria-label="Click to show the next element" title="Click to show the next element"></div>
    <div class="hint" id="hint">Click to add the answer.</div>
  </main>
<script>
  const frames = [
    'https://storage.yandexcloud.net/kids-app/public-assets/spotlight/img/ex28_img0.webp',
    'https://storage.yandexcloud.net/kids-app/public-assets/spotlight/img/ex28_img1.webp',
    'https://storage.yandexcloud.net/kids-app/public-assets/spotlight/img/ex28_img2.webp',
    'https://storage.yandexcloud.net/kids-app/public-assets/spotlight/img/ex28_img3.webp',
    'https://storage.yandexcloud.net/kids-app/public-assets/spotlight/img/ex28_img4.webp',
    'https://storage.yandexcloud.net/kids-app/public-assets/spotlight/img/ex28_img5.webp',
    'https://storage.yandexcloud.net/kids-app/public-assets/spotlight/img/ex28_img6.webp'
  ];
  const hints = ['','','','','','',''];

  const frame = document.getElementById('frame');
  const clickLayer = document.getElementById('clickLayer');
  const hint = document.getElementById('hint');
  let step = 0;

  function render() {
    frame.src = frames[step];
    if (hints[step]) {
      hint.textContent = hints[step];
      hint.classList.remove('hidden');
    } else {
      hint.classList.add('hidden');
    }
  }

  function nextStep() {
    if (step < frames.length - 1) {
      step += 1;
      render();
    }
  }

  clickLayer.addEventListener('click', nextStep);
  document.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      nextStep();
    }
    if (e.key.toLowerCase() === 'r') {
      step = 0;
      render();
    }
  });

  render();
</script>
</body>
</html>

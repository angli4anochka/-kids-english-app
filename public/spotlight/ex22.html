  <title>Bill's family tree</title>
  <style>
    :root {
      --slide-w: 1899;
      --slide-h: 1071;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
    }

    .stage-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(var(--slide-w) * 1px);
      height: calc(var(--slide-h) * 1px);
      transform-origin: center center;
      background: #ffffff;
    }

    .slide {
      position: relative;
      width: calc(var(--slide-w) * 1px);
      height: calc(var(--slide-h) * 1px);
      overflow: hidden;
      background: #ffffff;
    }

    .base-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .step {
      position: absolute;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .28s ease, transform .28s ease;
      pointer-events: none;
    }

    .step.visible {
      opacity: 1;
      transform: translateY(0);
    }

      </div>

      <div class="step mike-outline" aria-hidden="true"></div>

      <div class="step aunt-bubble">

      </div>

      <div class="step cousins-outline" aria-hidden="true"></div>

<div class="click-layer" id="clickLayer" aria-label="Next step"></div>
    </main>
  </div>

  <script>
    const stageWrap = document.getElementById("stageWrap");
    const steps = Array.from(document.querySelectorAll(".step"));
    const clickLayer = document.getElementById("clickLayer");
    let currentStep = -1;

    function fitStage() {
      const slideW = 1899;
      const slideH = 1071;
      const scale = Math.min(window.innerWidth / slideW, window.innerHeight / slideH);
      stageWrap.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }

    function showNextStep() {
      if (currentStep < steps.length - 1) {
        currentStep += 1;
        steps[currentStep].classList.add("visible");
      }
    }

    function showPreviousStep() {
      if (currentStep >= 0) {
        steps[currentStep].classList.remove("visible");
        currentStep -= 1;
      }
    }

    clickLayer.addEventListener("click", showNextStep);

    document.addEventListener("keydown", (event) => {
      if (event.key === " " || event.key === "ArrowRight" || event.key === "Enter") {
        event.preventDefault();
        showNextStep();
      }

      if (event.key === "ArrowLeft" || event.key === "Backspace") {
        event.preventDefault();
        showPreviousStep();
      }
    });

    window.addEventListener("resize", fitStage);
    fitStage();
  </script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Find the Words + Right/Wrong — A-H</title>
<style>
  :root{
    --yellow:#f6c51f;
    --blue:#245fa8;
    --dark:#24335d;
    --sky:#65bfd7;
    --green:#22a853;
    --red:#e74848;
    --orange:#efbd63;
    --cream:#fff7d2;
    --ink:#111;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#f2f2f2;
    font-family:"Trebuchet MS", Arial, sans-serif;
    overflow:hidden;
    color:var(--ink);
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .slide{
    width:1220px;
    height:820px;
    background:#fff;
    border:12px solid var(--yellow);
    box-shadow:0 10px 28px rgba(0,0,0,.22);
    position:relative;
    overflow:hidden;
    padding:0 28px 22px;
    transform:scale(.85);
    transform-origin:center center;
    flex:0 0 auto;
  }

  .header{
    height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
  }

  .title{
    width:560px;
    height:76px;
    margin:0 0 0 -28px;
    background:var(--dark);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"Comic Sans MS","Trebuchet MS",cursive;
    font-size:33px;
    font-weight:900;
    text-shadow:2px 3px 0 rgba(0,0,0,.25);
    border-radius:0 0 22px 0;
  }

  .tools{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:10px;
    flex-wrap:wrap;
  }

  .score{
    background:var(--cream);
    border:2px solid var(--orange);
    border-radius:16px;
    padding:7px 13px;
    font-weight:900;
    min-width:108px;
    text-align:center;
    box-shadow:0 2px 0 rgba(0,0,0,.07);
  }

  .score span{
    display:block;
    color:var(--blue);
    font-size:22px;
    line-height:1;
    margin-top:2px;
  }

  .btn{
    border:none;
    border-radius:15px;
    background:var(--blue);
    color:#fff;
    padding:9px 15px;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,.18);
  }

  .btn.secondary{
    background:#fff;
    color:var(--blue);
    border:2px solid var(--blue);
    box-shadow:none;
  }

  .btn.orange{background:#f0a63a;}
  .btn.green{background:var(--green);}
  .btn.red{background:var(--red);}
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18);}

  .task{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:16px;
    font-weight:900;
    margin-bottom:8px;
  }

  .badge{
    width:29px;
    height:29px;
    border-radius:4px;
    background:#4266a9;
    color:#fff;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    flex:0 0 auto;
  }

  .instruction{
    background:#fffef8;
    border:2px dashed rgba(240,182,76,.75);
    border-radius:16px;
    padding:8px 11px;
    font-size:14px;
    line-height:1.28;
    margin-bottom:10px;
  }

  .main{
    display:grid;
    grid-template-columns:1fr .95fr;
    gap:18px;
    height:620px;
  }

  .panel{
    background:#eefaff;
    border:3px solid #86cde0;
    border-radius:28px;
    padding:14px;
    box-shadow:inset 0 0 0 7px #f8fdff;
    overflow:hidden;
  }

  .right-panel{
    background:#fff9df;
    border-color:var(--orange);
  }

  .panel-title{
    margin:0 0 10px;
    text-align:center;
    font-family:"Comic Sans MS","Trebuchet MS",cursive;
    color:var(--blue);
    font-size:28px;
    font-weight:900;
    text-shadow:1px 2px 0 #fff;
  }

  .friends{
    height:108px;
    background:#fff;
    border:2px solid #9bd9e8;
    border-radius:22px;
    margin-bottom:10px;
    padding:5px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .friends img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    display:block;
  }

  .find-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:9px;
  }

  .find-row{
    background:#fff;
    border:2px solid #9bd9e8;
    border-radius:18px;
    padding:9px 11px;
    display:grid;
    grid-template-columns:70px 1fr 175px;
    gap:12px;
    align-items:center;
    box-shadow:0 2px 0 rgba(0,0,0,.06);
  }

  .emoji{
    font-size:38px;
    text-align:center;
    line-height:1;
  }

  .pattern{
    font-family:"Comic Sans MS","Trebuchet MS",cursive;
    font-size:28px;
    font-weight:900;
    color:#333;
    letter-spacing:2px;
    white-space:nowrap;
  }

  .word-input{
    width:100%;
    height:42px;
    border:3px solid #d8d8d8;
    border-radius:14px;
    background:#fff;
    padding:4px 10px;
    font-family:"Comic Sans MS","Trebuchet MS",cursive;
    font-size:22px;
    font-weight:900;
    outline:none;
    text-align:center;
  }

  .word-input.ok{
    border-color:var(--green);
    background:#effff4;
    color:#158238;
  }

  .word-input.bad{
    border-color:var(--red);
    background:#fff1f1;
    color:#c22828;
  }

  .rw-stage{
    display:grid;
    grid-template-rows:auto 1fr auto;
    gap:12px;
    height:552px;
  }

  .card-box{
    background:#fff;
    border:3px solid #f0bd63;
    border-radius:26px;
    padding:16px;
    display:grid;
    grid-template-columns:170px 1fr;
    gap:18px;
    align-items:center;
    min-height:235px;
    box-shadow:0 2px 0 rgba(0,0,0,.06);
  }

  .big-pic{
    height:170px;
    background:#f7fcff;
    border:2px solid #9bd9e8;
    border-radius:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:86px;
  }

  .sentence{
    font-family:"Comic Sans MS","Trebuchet MS",cursive;
    font-size:36px;
    line-height:1.15;
    font-weight:900;
    color:#222;
    text-align:center;
  }

  .sentence span{
    color:#f08a00;
  }

  .rw-buttons{
    display:flex;
    justify-content:center;
    gap:14px;
  }

  .feedback{
    min-height:90px;
    background:#fff;
    border:2px dashed #9cccdc;
    border-radius:22px;
    padding:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:22px;
    font-weight:900;
    line-height:1.22;
  }

  .feedback.ok{
    border-color:var(--green);
    background:#effff4;
    color:#158238;
  }

  .feedback.bad{
    border-color:var(--red);
    background:#fff1f1;
    color:#c22828;
  }

  .progress{
    text-align:center;
    font-weight:900;
    color:#75531a;
    background:#fff7d2;
    border:2px solid var(--orange);
    border-radius:16px;
    padding:8px 12px;
  }

  .finish{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:#fff;
    border:8px solid var(--yellow);
    border-radius:30px;
    padding:26px 34px;
    text-align:center;
    box-shadow:0 8px 28px rgba(0,0,0,.22);
    z-index:10;
    display:none;
    min-width:360px;
  }

  .finish.show{display:block;}

  .finish h2{
    margin:0 0 8px;
    font-family:"Comic Sans MS","Trebuchet MS",cursive;
    color:var(--green);
    font-size:34px;
  }

  .finish p{
    margin:0 0 16px;
    font-size:20px;
    font-weight:900;
  }

  .modal-bg{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.25);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:20;
    padding:30px;
  }

  .modal-bg.show{display:flex;}

  .modal{
    width:min(720px,100%);
    background:#fff;
    border:8px solid var(--yellow);
    border-radius:28px;
    padding:26px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    position:relative;
  }

  .modal h2{
    margin:0 0 16px;
    text-align:center;
    color:var(--blue);
    font-family:"Comic Sans MS","Trebuchet MS",cursive;
    font-size:30px;
  }

  .hint-list{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    font-size:17px;
    font-weight:800;
  }

  .hint-item{
    background:#eefaff;
    border:2px solid #9bd9e8;
    border-radius:16px;
    padding:10px;
  }

  .close{
    position:absolute;
    right:15px;
    top:14px;
    width:38px;
    height:38px;
    border-radius:50%;
    border:2px solid var(--blue);
    background:#fff;
    color:var(--blue);
    font-weight:900;
    cursor:pointer;
    font-size:19px;
  }

  @media(max-width:980px){
    html,body{overflow:auto;height:auto;}
    body{align-items:flex-start;}
    .slide{width:100%;height:auto;min-height:100vh;transform:none;border-width:8px;padding:0 12px 22px;}
    .header{height:auto;flex-direction:column;align-items:stretch;gap:8px;}
    .title{margin:0 -12px 6px;width:auto;border-radius:0 0 18px 18px;}
    .main{grid-template-columns:1fr;height:auto;}
    .find-row{grid-template-columns:52px 1fr;}
    .word-input{grid-column:1 / span 2;}
    .card-box{grid-template-columns:1fr;}
    .rw-stage{height:auto;}
    .hint-list{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<main class="slide">
  <div class="header">
    <h1 class="title">Find the Words + Right / Wrong</h1>
    <div class="tools">
      <div class="score">Score <span id="score">0 / 13</span></div>
      <button class="btn secondary" id="resetBtn">Reset</button>
    </div>
  </div>

  <div class="task"><span class="badge">4</span> Complete the words. Then play Right / Wrong.</div>

  <section class="main">
    <div class="panel">
      <h2 class="panel-title">Find the words</h2>
      <div class="friends">
        <img src="https://storage.yandexcloud.net/kids-app/html-assets/spotlight-find-words-right-wrong-ah/251dff55ffb83d0b.png" alt="Alphabet friends">
      </div>
      <div class="find-grid" id="findGrid"></div>
    </div>

    <div class="panel right-panel">
      <h2 class="panel-title">Right or Wrong?</h2>
      <div class="rw-stage">
        <div class="progress" id="rwProgress">Question 1 / 5</div>
        <div class="card-box">
          <div class="big-pic" id="rwPic">🐱</div>
          <div class="sentence" id="rwSentence">It’s a <span>cat</span>.</div>
        </div>
        <div class="rw-buttons">
          <button class="btn green" id="rightBtn">Right</button>
          <button class="btn red" id="wrongBtn">Wrong</button>
          <button class="btn secondary" id="nextBtn">Next</button>
        </div>
        <div class="feedback" id="feedback">Choose Right or Wrong.</div>
      </div>
    </div>
  </section>

  <div class="finish" id="finish">
    <h2>Well done!</h2>
    <p>You finished this page.</p>
    <button class="btn" id="againBtn">Play again</button>
  </div>

</main>

<script>
const findWords = [
  {answer:"apple", pattern:"a _ _ l _", emoji:"🍎"},
  {answer:"fox", pattern:"f _ x", emoji:"🦊"},
  {answer:"girl", pattern:"g _ r _", emoji:"👧"},
  {answer:"doll", pattern:"d _ _ l", emoji:"🪆"},
  {answer:"cat", pattern:"c _ t", emoji:"🐱"},
  {answer:"egg", pattern:"e _ _", emoji:"🥚"},
  {answer:"ball", pattern:"b _ _ l", emoji:"⚽"},
  {answer:"hat", pattern:"h _ t", emoji:"👒"}
];

const rwQuestions = [
  {pic:"🐱", sentence:"It’s a cat.", shown:"cat", correct:true, correctText:"It’s a cat."},
  {pic:"🦊", sentence:"It’s a cat.", shown:"cat", correct:false, correctText:"Wrong. It’s a fox."},
  {pic:"📖", sentence:"It’s a book.", shown:"book", correct:true, correctText:"It’s a book."},
  {pic:"🪆", sentence:"It’s a ball.", shown:"ball", correct:false, correctText:"Wrong. It’s a doll."},
  {pic:"👒", sentence:"It’s a hat.", shown:"hat", correct:true, correctText:"It’s a hat."}
];

let findScore = 0;
let rwScore = 0;
let rwIndex = 0;
let answered = false;
let rwAnswers = [];
let reported = false;

const findGrid = document.getElementById("findGrid");
const scoreEl = document.getElementById("score");
const rwPic = document.getElementById("rwPic");
const rwSentence = document.getElementById("rwSentence");
const feedback = document.getElementById("feedback");
const rwProgress = document.getElementById("rwProgress");
const finish = document.getElementById("finish");

function normalize(text){
  return String(text || "").toLowerCase().trim().replace(/\s+/g," ");
}

function renderFindWords(){
  findGrid.innerHTML = "";
  findWords.forEach(item => {
    const row = document.createElement("div");
    row.className = "find-row";
    row.innerHTML = `
      <div class="emoji">${item.emoji}</div>
      <div class="pattern">${item.pattern}</div>
      <input class="word-input" data-answer="${item.answer}" autocomplete="off" spellcheck="false">
    `;
    findGrid.appendChild(row);
  });

  findGrid.querySelectorAll(".word-input").forEach(input => {
    input.addEventListener("input", () => {
      const okBefore = input.classList.contains("ok");
      const ok = normalize(input.value) === input.dataset.answer;
      input.classList.toggle("ok", ok);
      input.classList.toggle("bad", Boolean(input.value) && !ok);

      if(ok && !okBefore) findScore++;
      if(!ok && okBefore) findScore--;
      updateScore();
    });
  });
}

function renderRw(){
  const q = rwQuestions[rwIndex];
  rwPic.textContent = q.pic;
  rwSentence.innerHTML = q.sentence.replace(q.shown, `<span>${q.shown}</span>`);
  rwProgress.textContent = `Question ${rwIndex + 1} / ${rwQuestions.length}`;
  feedback.className = "feedback";
  feedback.textContent = "Choose Right or Wrong.";
  answered = false;
}

function answerRw(userAnswer){
  if(answered) return;
  answered = true;
  const q = rwQuestions[rwIndex];
  const ok = userAnswer === q.correct;
  rwAnswers[rwIndex] = ok;

  if(ok){
    rwScore++;
    feedback.className = "feedback ok";
    feedback.textContent = q.correctText;
  } else {
    feedback.className = "feedback bad";
    feedback.textContent = q.correct ? "No. This sentence is right." : q.correctText;
  }
  updateScore();
}

function nextRw(){
  if(rwIndex < rwQuestions.length - 1){
    rwIndex++;
    renderRw();
  } else {
    if(findScore + rwScore >= 13){
      finish.classList.add("show");
    } else {
      feedback.className = "feedback";
      feedback.textContent = "Finish the words on the left too.";
    }
  }
}

function reportResults(){
  const inputs = findGrid.querySelectorAll(".word-input");
  const findResults = findWords.map((item, i) => {
    const input = inputs[i];
    const isCorrect = input ? input.classList.contains("ok") : false;
    return {
      questionIndex: i,
      correctAnswer: item.answer,
      studentAnswer: input ? input.value : "",
      isCorrect,
      sentence: `${item.pattern} → ${item.answer}`,
    };
  });
  const rwResults = rwQuestions.map((q, i) => {
    const isCorrect = Boolean(rwAnswers[i]);
    const label = q.correct ? "Right" : "Wrong";
    const wrongLabel = q.correct ? "Wrong" : "Right";
    return {
      questionIndex: findResults.length + i,
      correctAnswer: label,
      studentAnswer: isCorrect ? label : wrongLabel,
      isCorrect,
      sentence: q.sentence,
    };
  });
  const results = [...findResults, ...rwResults];
  const totalScore = results.filter(r => r.isCorrect).length;
  window.parent.postMessage({
    type: "find-words-right-wrong-done",
    score: totalScore,
    total: results.length,
    results,
  }, "*");
}

function updateScore(){
  scoreEl.textContent = `${findScore + rwScore} / 13`;
  if(findScore + rwScore >= 13){
    setTimeout(() => finish.classList.add("show"), 300);
    if(!reported){
      reported = true;
      reportResults();
    }
  }
}

function resetAll(){
  findScore = 0;
  rwScore = 0;
  rwIndex = 0;
  answered = false;
  rwAnswers = [];
  reported = false;
  finish.classList.remove("show");
  renderFindWords();
  renderRw();
  updateScore();
}

document.getElementById("rightBtn").addEventListener("click", () => answerRw(true));
document.getElementById("wrongBtn").addEventListener("click", () => answerRw(false));
document.getElementById("nextBtn").addEventListener("click", nextRw);
document.getElementById("resetBtn").addEventListener("click", resetAll);
document.getElementById("againBtn").addEventListener("click", resetAll);

resetAll();
</script>
</body>
</html>

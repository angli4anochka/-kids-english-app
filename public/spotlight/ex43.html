<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Do you have? / Have you got?</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    .page {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      background: #ffffff;
    }
    .slide {
      width: min(100vw, calc(100vh * 1703 / 1068));
      height: min(100vh, calc(100vw * 1068 / 1703));
      position: relative;
      background: #fff;
    }
    .slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="slide" aria-label="Do you have? / have you got? Etc. questions">
      <img src="https://storage.yandexcloud.net/kids-app/public-assets/spotlight/img/ex43-embedded1.png" alt="Do you have? / have you got? Etc. questions" />
    </section>
  </main>
</body>
</html>

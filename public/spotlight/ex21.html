<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>People in the family</title>
  <style>
    :root {
      --slide-w: 1892;
      --slide-h: 1066;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      position: relative;
      user-select: none;
    }

    .stage-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(var(--slide-w) * 1px);
      height: calc(var(--slide-h) * 1px);
      transform-origin: center center;
    }

    .slide {
      position: relative;
      width: calc(var(--slide-w) * 1px);
      height: calc(var(--slide-h) * 1px);
      background: #ffffff;
      overflow: hidden;
    }

    .base, .step img {
      position: absolute;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .title { left: 120px; top: 25px; width: 670px; height: 285px; }
    .family { left: 815px; top: 0; width: 1077px; height: 1066px; }

    .step {
      position: absolute;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .28s ease, transform .28s ease;
      pointer-events: none;
    }

    .step.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .bubble1 { left: 10px; top: 352px; width: 554px; height: 237px; }
    .bubble2 { left: 226px; top: 566px; width: 578px; height: 237px; }
    .bubble3 { left: 15px; top: 771px; width: 554px; height: 237px; }

    .step img { width: 100%; height: 100%; }

    .click-layer {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background: transparent;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div class="stage-wrap" id="stageWrap">
    <main class="slide" id="slide">
      <img class="base title" src="https://storage.yandexcloud.net/kids-app/public-assets/spotlight/img/ex21_img0.webp" alt="People in the family" draggable="false" />
      <img class="base family" src="https://storage.yandexcloud.net/kids-app/public-assets/spotlight/img/ex21_img1.webp" alt="Family tree wall" draggable="false" />

      <div class="step bubble1"><img src="https://storage.yandexcloud.net/kids-app/public-assets/spotlight/img/ex21_img2.webp" alt="What are we going to talk about?" draggable="false" /></div>
      <div class="step bubble2"><img src="https://storage.yandexcloud.net/kids-app/public-assets/spotlight/img/ex21_img3.webp" alt="What family members do you know?" draggable="false" /></div>
      <div class="step bubble3"><img src="https://storage.yandexcloud.net/kids-app/public-assets/spotlight/img/ex21_img4.webp" alt="Who do you have in your family?" draggable="false" /></div>

      <div class="click-layer" id="clickLayer" aria-label="Next step"></div>
    </main>
  </div>

  <script>
    const stageWrap = document.getElementById('stageWrap');
    const steps = Array.from(document.querySelectorAll('.step'));
    const clickLayer = document.getElementById('clickLayer');
    let currentStep = -1;

    function fitStage() {
      const slideW = 1892;
      const slideH = 1066;
      const scale = Math.min(window.innerWidth / slideW, window.innerHeight / slideH);
      stageWrap.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }

    function showNextStep() {
      if (currentStep < steps.length - 1) {
        currentStep += 1;
        steps[currentStep].classList.add('visible');
      }
    }

    function showPreviousStep() {
      if (currentStep >= 0) {
        steps[currentStep].classList.remove('visible');
        currentStep -= 1;
      }
    }

    clickLayer.addEventListener('click', showNextStep);

    document.addEventListener('keydown', (event) => {
      if (event.key === ' ' || event.key === 'ArrowRight' || event.key === 'Enter') {
        event.preventDefault();
        showNextStep();
      }
      if (event.key === 'ArrowLeft' || event.key === 'Backspace') {
        event.preventDefault();
        showPreviousStep();
      }
    });

    window.addEventListener('resize', fitStage);
    fitStage();
  </script>
</body>
</html>

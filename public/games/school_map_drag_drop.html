<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Subjects Drag and Drop</title>
  <style>
    :root {
      --ink: #18385f;
      --shadow: 0 12px 28px rgba(22, 55, 98, .20);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      background: #eef6ff;
      color: var(--ink);
      user-select: none;
    }

    body {
      display: grid;
      place-items: center;
    }

    .game {
      position: relative;
      width: min(100vw, calc(100vh * 4 / 3));
      height: min(100vh, calc(100vw * 3 / 4));
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.22);
      background-image: url("https://storage.yandexcloud.net/kids-app/html-assets/games-school_map_drag_drop/3492a8cb5b0e510c.png");
      background-size: cover;
      background-position: center;
    }

    .top-note {
      display: none;
    }

    .score {
      position: absolute;
      left: 3.2%;
      top: 12.3%;
      z-index: 10;
      width: 10%;
      min-width: 84px;
      padding: .44em .5em;
      border-radius: 14px;
      background: rgba(255,255,255,.86);
      border: 2px solid rgba(255,255,255,.85);
      box-shadow: 0 8px 22px rgba(0,0,0,.12);
      text-align: center;
      font-weight: 950;
      font-size: clamp(12px, 1.45vw, 20px);
      color: #1c3e66;
    }

    .drop-zone {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--w);
      height: var(--h);
      transform: translate(-50%, -50%);
      border-radius: 22px;
      border: 3px dashed rgba(255,255,255,0);
      z-index: 4;
      transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;
    }

    .drop-zone.active {
      border-color: rgba(255,255,255,.85);
      background: rgba(255,255,255,.16);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.28), 0 0 24px rgba(255,255,255,.22);
    }

    .drop-zone.correct-flash {
      border-color: rgba(112, 214, 126, .95);
      background: rgba(112, 214, 126, .20);
    }

    .answer-label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(.96);
      min-width: 54%;
      padding: .32em .68em;
      border-radius: 15px;
      background: rgba(255,255,255,.96);
      border: 3px solid rgba(255,255,255,.97);
      box-shadow: 0 8px 18px rgba(0,0,0,.16);
      color: #1f4069;
      font-size: clamp(9px, .9vw, 15px);
      white-space: nowrap;
      font-weight: 950;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease, transform .22s ease;
      z-index: 30;
    }

    .drop-zone.filled .answer-label {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .drop-zone.filled::after {
      content: "✓";
      position: absolute;
      right: 7%;
      top: 50%;
      transform: translateY(-50%);
      width: 1.9em;
      height: 1.9em;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #67c46e;
      color: white;
      font-weight: 950;
      font-size: clamp(12px, 1.15vw, 18px);
      box-shadow: 0 5px 13px rgba(0,0,0,.16);
      z-index: 31;
    }

    .word-bank {
      position: absolute;
      left: 3.1%;
      right: 3.1%;
      bottom: 1.9%;
      z-index: 16;
      min-height: 8.2%;
      padding: .55% .75%;
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      gap: .65%;
      border-radius: 22px;
      background: rgba(255,255,255,.90);
      border: 3px solid rgba(255,255,255,.92);
      box-shadow: 0 12px 28px rgba(0,0,0,.15);
      backdrop-filter: blur(3px);
    }

    .word-card {
      position: relative;
      height: 100%;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .22em;
      border-radius: 16px;
      background: linear-gradient(135deg, #ffffff, #fff3c9);
      border: 2px solid rgba(255,255,255,.95);
      box-shadow: 0 7px 16px rgba(0,0,0,.12), inset 0 -4px rgba(0,0,0,.04);
      color: #1d3c65;
      font-weight: 950;
      font-size: clamp(9px, .92vw, 14px);
      line-height: 1.05;
      white-space: nowrap;
      cursor: grab;
      touch-action: none;
      transition: transform .12s ease, opacity .2s ease, box-shadow .12s ease;
      z-index: 20;
    }

    .word-card:active { cursor: grabbing; }

    .word-card.dragging {
      position: fixed;
      width: var(--drag-w);
      height: var(--drag-h);
      z-index: 80;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(1.06);
      box-shadow: 0 18px 36px rgba(0,0,0,.24);
    }

    .word-card.used {
      opacity: .24;
      transform: scale(.94);
      pointer-events: none;
      filter: grayscale(.25);
    }

    .word-card.wrong {
      animation: shake .34s ease;
      background: linear-gradient(135deg, #fff, #ffd8d8);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      55% { transform: translateX(7px); }
      80% { transform: translateX(-4px); }
    }

    .icon {
      font-size: 1.3em;
      line-height: 1;
    }


    .art-old-label-cover {
      position: absolute;
      left: 58.55%;
      top: 61.35%;
      width: 15.7%;
      height: 7.6%;
      transform: translate(-50%, -50%);
      z-index: 10;
      border-radius: 12px;
      background: linear-gradient(135deg, #aa7df4 0%, #8d63df 58%, #7e52d2 100%);
      box-shadow:
        inset 0 -7px rgba(0,0,0,.05),
        0 0 0 2px rgba(255,255,255,.08);
      pointer-events: none;
    }

    .art-old-label-cover::before {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      top: 16%;
      height: 18%;
      border-radius: 999px;
      background: rgba(255,255,255,.14);
    }

    .art-big-question {
      position: absolute;
      left: 58%;
      top: 53.5%;
      transform: translate(-50%, -50%);
      z-index: 11;
      color: rgba(255,255,255,.74);
      font-size: clamp(46px, 6.2vw, 92px);
      font-weight: 950;
      line-height: 1;
      text-shadow: 0 4px 12px rgba(0,0,0,.24);
      pointer-events: none;
    }

    .drop-zone[data-subject="Art"].filled ~ .art-big-question {
      display: none;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 13%;
      transform: translateX(-50%) translateY(10px);
      z-index: 90;
      padding: .55em 1em;
      border-radius: 999px;
      background: rgba(255,255,255,.95);
      box-shadow: 0 12px 28px rgba(0,0,0,.18);
      color: #1d3c65;
      font-weight: 950;
      font-size: clamp(13px, 1.5vw, 22px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .done {
      position: absolute;
      inset: 0;
      z-index: 120;
      display: none;
      place-items: center;
      background: rgba(255,248,220,.16);
      pointer-events: none;
    }

    .done.show { display: grid; }

    .done-card {
      padding: .55em .9em;
      border-radius: 28px;
      background: rgba(255,255,255,.96);
      border: 4px solid white;
      box-shadow: 0 22px 58px rgba(0,0,0,.24);
      color: #2d9b55;
      font-size: clamp(32px, 5vw, 72px);
      font-weight: 950;
      text-align: center;
      animation: pop .45s ease both;
    }

    .done-card small {
      display: block;
      color: #213b5d;
      margin-top: .15em;
      font-size: .38em;
    }

    @keyframes pop {
      from { transform: scale(.72); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 850px) {
      .word-bank {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        min-height: 16%;
        bottom: 1.2%;
      }

      .word-card { min-height: 36px; }

      .top-note { display: none; }
    }
  </style>
</head>
<body>
  <main class="game" id="game" aria-label="School subjects drag and drop game">
    <div class="score" id="score">0 / 9</div>

    <section class="drop-zone" style="--x: 26%; --y: 34%; --w: 24%; --h: 20%;" data-subject="English">
      <div class="answer-label">English</div>
    </section>

    <section class="drop-zone" style="--x: 74%; --y: 34%; --w: 25%; --h: 20%;" data-subject="Maths">
      <div class="answer-label">Maths</div>
    </section>

    <section class="drop-zone" style="--x: 15%; --y: 54%; --w: 22%; --h: 18%;" data-subject="Science">
      <div class="answer-label">Science</div>
    </section>

    <section class="drop-zone" style="--x: 39%; --y: 55%; --w: 19%; --h: 18%;" data-subject="History">
      <div class="answer-label">History</div>
    </section>

    <section class="drop-zone" style="--x: 58%; --y: 54%; --w: 19%; --h: 18%;" data-subject="Art">
      <div class="answer-label">Art</div>
    </section>

    <section class="drop-zone" style="--x: 80%; --y: 54%; --w: 18%; --h: 18%;" data-subject="Geography">
      <div class="answer-label">Geography</div>
    </section>

    <section class="drop-zone" style="--x: 24%; --y: 78%; --w: 24%; --h: 17%;" data-subject="Music">
      <div class="answer-label">Music</div>
    </section>

    <section class="drop-zone" style="--x: 49%; --y: 78%; --w: 20%; --h: 17%;" data-subject="IT">
      <div class="answer-label">IT</div>
    </section>

    <section class="drop-zone" style="--x: 73%; --y: 78%; --w: 24%; --h: 17%;" data-subject="PE">
      <div class="answer-label">PE</div>
    </section>

    <div class="art-old-label-cover" aria-hidden="true"></div>
    <div class="art-big-question" aria-hidden="true">?</div>

    <section class="word-bank" id="wordBank" aria-label="Subject words">
      <div class="word-card" data-subject="English"><span class="icon">📖</span>English</div>
      <div class="word-card" data-subject="Maths"><span class="icon">➗</span>Maths</div>
      <div class="word-card" data-subject="Science"><span class="icon">🔬</span>Science</div>
      <div class="word-card" data-subject="History"><span class="icon">🏛️</span>History</div>
      <div class="word-card" data-subject="Art"><span class="icon">🎨</span>Art</div>
      <div class="word-card" data-subject="Geography"><span class="icon">🌍</span>Geography</div>
      <div class="word-card" data-subject="Music"><span class="icon">🎵</span>Music</div>
      <div class="word-card" data-subject="IT"><span class="icon">💻</span>IT</div>
      <div class="word-card" data-subject="PE"><span class="icon">⚽</span>PE</div>
    </section>

    <div class="toast" id="toast">Good!</div>

    <div class="done" id="done">
      <div class="done-card">Great job!<small>All subjects are in the rooms.</small></div>
    </div>
  </main>

  <script>
    const cards = Array.from(document.querySelectorAll('.word-card'));
    const zones = Array.from(document.querySelectorAll('.drop-zone'));
    const scoreEl = document.getElementById('score');
    const toast = document.getElementById('toast');
    const done = document.getElementById('done');

    const solved = new Set();
    let dragCard = null;
    let originalParent = null;
    let originalNext = null;
    let resultSent = false;

    function showToast(text, good = true) {
      toast.textContent = text;
      toast.style.color = good ? '#1d3c65' : '#8a2630';
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 900);
    }

    function updateScore() {
      scoreEl.textContent = `${solved.size} / ${zones.length}`;

      if (solved.size === zones.length) {
        done.classList.add('show');
        if (!resultSent && window.parent !== window) {
          resultSent = true;
          window.parent.postMessage({
            type: 'school-map-done',
            score: solved.size,
            total: zones.length,
            results: { subjects: Array.from(solved) }
          }, '*');
        }
        setTimeout(() => done.classList.remove('show'), 2200);
      }
    }

    function getCenterTarget(x, y) {
      return zones.find(zone => {
        if (zone.classList.contains('filled')) return false;
        const rect = zone.getBoundingClientRect();
        return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
      });
    }

    function setDragPosition(card, x, y) {
      card.style.left = x + 'px';
      card.style.top = y + 'px';
    }

    function startDrag(event, card) {
      if (card.classList.contains('used')) return;

      event.preventDefault();
      dragCard = card;
      originalParent = card.parentNode;
      originalNext = card.nextSibling;

      const rect = card.getBoundingClientRect();
      card.style.setProperty('--drag-w', rect.width + 'px');
      card.style.setProperty('--drag-h', rect.height + 'px');

      document.body.appendChild(card);
      card.classList.add('dragging');
      setDragPosition(card, event.clientX, event.clientY);

      zones.forEach(zone => zone.classList.add('active'));
      try { card.setPointerCapture(event.pointerId); } catch(e) {}
    }

    function moveDrag(event) {
      if (!dragCard) return;
      event.preventDefault();

      setDragPosition(dragCard, event.clientX, event.clientY);

      const target = getCenterTarget(event.clientX, event.clientY);
      zones.forEach(zone => zone.classList.toggle('correct-flash', zone === target));
    }

    function returnCard(card) {
      card.classList.remove('dragging');
      card.style.left = '';
      card.style.top = '';
      card.style.removeProperty('--drag-w');
      card.style.removeProperty('--drag-h');

      if (originalNext) {
        originalParent.insertBefore(card, originalNext);
      } else {
        originalParent.appendChild(card);
      }
    }

    function endDrag(event) {
      if (!dragCard) return;

      const card = dragCard;
      const target = getCenterTarget(event.clientX, event.clientY);
      const subject = card.dataset.subject;

      zones.forEach(zone => {
        zone.classList.remove('active', 'correct-flash');
      });

      if (target && target.dataset.subject === subject) {
        target.classList.add('filled');
        solved.add(subject);

        card.classList.remove('dragging');
        card.classList.add('used');
        card.style.left = '';
        card.style.top = '';
        card.style.removeProperty('--drag-w');
        card.style.removeProperty('--drag-h');

        originalParent.appendChild(card);

        showToast(`${subject} ✓`, true);
        updateScore();
      } else {
        returnCard(card);
        card.classList.remove('wrong');
        void card.offsetWidth;
        card.classList.add('wrong');
        showToast('Try again', false);
      }

      dragCard = null;
      originalParent = null;
      originalNext = null;
    }

    cards.forEach(card => {
      card.addEventListener('pointerdown', event => startDrag(event, card));
    });

    window.addEventListener('pointermove', moveDrag);
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);

    updateScore();
  </script>
</body>
</html>

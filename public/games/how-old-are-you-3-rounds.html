<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>How old are you? — 3 Rounds</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Trebuchet MS", Arial, sans-serif;
    background: linear-gradient(180deg, #fff8fb 0%, #f4efff 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #342b45;
  }

  .card {
    width: min(1000px, 96vw);
    min-height: min(700px, 92vh);
    background: rgba(255,255,255,0.94);
    border-radius: 32px;
    box-shadow: 0 18px 50px rgba(92, 68, 120, 0.15);
    padding: clamp(22px, 4vw, 48px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 22px;
    overflow: auto;
  }

  .top {
    text-align: center;
  }

  .round {
    display: inline-block;
    padding: 8px 16px;
    border-radius: 999px;
    background: #efe7fb;
    color: #6f55a0;
    font-size: clamp(14px, 1.8vw, 18px);
    font-weight: 900;
    margin-bottom: 12px;
  }

  .label {
    font-size: clamp(15px, 2vw, 21px);
    font-weight: 700;
    color: #8b7aa8;
    margin-bottom: 10px;
  }

  h1 {
    margin: 0;
    font-size: clamp(38px, 6vw, 72px);
    line-height: 1.08;
    color: #5c3d8f;
    letter-spacing: 1px;
  }

  .slots {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 9px;
    margin: 4px auto 0;
    min-height: 70px;
  }

  .slot {
    width: clamp(42px, 5vw, 58px);
    height: clamp(52px, 6vw, 68px);
    border: 3px dashed #d8caee;
    border-radius: 16px;
    display: grid;
    place-items: center;
    font-size: clamp(26px, 3vw, 38px);
    font-weight: 900;
    color: #5c3d8f;
    background: #fcfaff;
    cursor: pointer;
  }

  .slot.fixed {
    cursor: default;
    border-style: solid;
    border-color: #eadff8;
  }

  .gap {
    width: clamp(16px, 2vw, 26px);
  }

  .letters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 13px;
    padding: 22px;
    border-radius: 26px;
    background: #f7f0ff;
  }

  .letter {
    width: clamp(52px, 6vw, 72px);
    height: clamp(52px, 6vw, 72px);
    border: none;
    border-radius: 18px;
    background: white;
    box-shadow: 0 6px 14px rgba(92, 61, 143, 0.13);
    font-size: clamp(26px, 3vw, 36px);
    font-weight: 900;
    color: #5c3d8f;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }

  .letter:hover {
    transform: translateY(-4px) rotate(-1deg);
    box-shadow: 0 10px 20px rgba(92, 61, 143, 0.18);
  }

  .letter:disabled {
    opacity: .22;
    cursor: default;
    transform: none;
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 16px;
  }

  .control-btn {
    border: none;
    border-radius: 999px;
    padding: 13px 24px;
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
  }

  #resetBtn {
    background: #ece3f9;
    color: #5c3d8f;
  }

  #checkBtn {
    background: #5c3d8f;
    color: white;
  }

  #message {
    text-align: center;
    min-height: 34px;
    margin-top: 8px;
    font-size: 22px;
    font-weight: 900;
  }

  .success { color: #2f8f62; }
  .try { color: #c26b4a; }

  .final-screen {
    display: none;
    text-align: center;
    margin: auto;
  }

  .final-screen.show {
    display: block;
  }

  .final-star {
    font-size: clamp(72px, 12vw, 130px);
    margin-bottom: 10px;
  }

  .final-screen h2 {
    font-size: clamp(34px, 5vw, 60px);
    color: #5c3d8f;
    margin: 0 0 14px;
  }

  .final-screen p {
    font-size: clamp(20px, 2.5vw, 28px);
    color: #7b6996;
    margin: 0 0 24px;
  }

  #playAgainBtn {
    background: #5c3d8f;
    color: white;
  }

  @media (max-height: 700px) {
    .card { min-height: auto; padding: 20px; gap: 15px; }
    .letters { padding: 16px; gap: 9px; }
    .slot { height: 48px; }
    .letter { height: 50px; }
  }
</style>
</head>

<body>
  <main class="card" id="gameCard">

    <div id="gameArea">
      <section class="top">
        <div class="round" id="roundLabel">Round 1 / 3</div>
        <div class="label">Build the phrase</div>
        <h1>How old are you?</h1>
      </section>

      <div class="slots" id="slots" aria-label="Answer area"></div>

      <section>
        <div class="letters" id="letters"></div>

        <div class="controls">
          <button class="control-btn" id="resetBtn">↻ Start again</button>
          <button class="control-btn" id="checkBtn">✓ Check</button>
        </div>

        <div id="message"></div>
      </section>
    </div>

    <section class="final-screen" id="finalScreen">
      <div class="final-star">⭐</div>
      <h2>Great job!</h2>
      <p>You finished all 3 rounds!</p>
      <button class="control-btn" id="playAgainBtn">Play again</button>
    </section>

  </main>

<script>
  const target = "HOWOLDAREYOU";
  const display = [
    ..."HOW", "gap",
    ..."OLD", "gap",
    ..."ARE", "gap",
    ..."YOU", "?"
  ];

  const totalRounds = 3;

  const slotsEl = document.getElementById("slots");
  const lettersEl = document.getElementById("letters");
  const messageEl = document.getElementById("message");
  const resetBtn = document.getElementById("resetBtn");
  const checkBtn = document.getElementById("checkBtn");
  const roundLabel = document.getElementById("roundLabel");
  const gameArea = document.getElementById("gameArea");
  const finalScreen = document.getElementById("finalScreen");
  const playAgainBtn = document.getElementById("playAgainBtn");

  let currentRound = 1;
  let answer = [];
  let buttons = [];
  let currentLetters = [];

  function shuffle(array) {
    const copy = [...array];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function renderSlots() {
    slotsEl.innerHTML = "";
    let answerIndex = 0;

    display.forEach(item => {
      if (item === "gap") {
        const gap = document.createElement("div");
        gap.className = "gap";
        slotsEl.appendChild(gap);
      } else if (item === "?") {
        const slot = document.createElement("div");
        slot.className = "slot fixed";
        slot.textContent = "?";
        slotsEl.appendChild(slot);
      } else {
        const slot = document.createElement("div");
        slot.className = "slot";
        slot.textContent = answer[answerIndex]?.letter || "";
        slot.dataset.index = answerIndex;

        slot.addEventListener("click", () => {
          const index = Number(slot.dataset.index);
          if (!answer[index]) return;

          const removed = answer.splice(index, 1)[0];
          removed.button.disabled = false;

          messageEl.textContent = "";
          messageEl.className = "";
          renderSlots();
        });

        slotsEl.appendChild(slot);
        answerIndex++;
      }
    });
  }

  function renderLetters() {
    lettersEl.innerHTML = "";
    buttons = [];

    currentLetters.forEach(letter => {
      const btn = document.createElement("button");
      btn.className = "letter";
      btn.textContent = letter;
      btn.setAttribute("aria-label", letter);

      btn.addEventListener("click", () => {
        if (answer.length >= target.length) return;

        answer.push({ letter, button: btn });
        btn.disabled = true;
        messageEl.textContent = "";
        messageEl.className = "";
        renderSlots();
      });

      lettersEl.appendChild(btn);
      buttons.push(btn);
    });
  }

  function startRound() {
    answer = [];
    currentLetters = shuffle([...target]);
    roundLabel.textContent = `Round ${currentRound} / ${totalRounds}`;
    messageEl.textContent = "";
    messageEl.className = "";
    renderLetters();
    renderSlots();
  }

  function resetRound() {
    answer = [];
    messageEl.textContent = "";
    messageEl.className = "";
    buttons.forEach(btn => btn.disabled = false);
    renderSlots();
  }

  function nextRound() {
    if (currentRound < totalRounds) {
      currentRound++;
      startRound();
    } else {
      gameArea.style.display = "none";
      finalScreen.classList.add("show");
    }
  }

  checkBtn.addEventListener("click", () => {
    const built = answer.map(x => x.letter).join("");

    if (built === target) {
      messageEl.textContent = currentRound < totalRounds ? "Perfect! ⭐ Next round!" : "Perfect! ⭐";
      messageEl.className = "success";

      buttons.forEach(btn => btn.disabled = true);

      setTimeout(nextRound, 900);
    } else {
      messageEl.textContent = "Try again 💜";
      messageEl.className = "try";
    }
  });

  resetBtn.addEventListener("click", resetRound);

  playAgainBtn.addEventListener("click", () => {
    currentRound = 1;
    finalScreen.classList.remove("show");
    gameArea.style.display = "block";
    startRound();
  });

  startRound();
</script>
</body>
</html>

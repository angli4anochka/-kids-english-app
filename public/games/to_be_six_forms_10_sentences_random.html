<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To be trainer</title>
  <style>
    :root{
      --ink:#17233b;
      --muted:#63748d;
      --blue:#2f73d8;
      --blue-dark:#1d67d0;
      --blue-soft:#eef7ff;
      --green:#178c3b;
      --green-soft:#eaf8ef;
      --red:#d84545;
      --red-soft:#ffe9ec;
      --yellow:#ffd86d;
      --shadow:0 18px 42px rgba(31,80,140,.16);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 10% 12%, rgba(255,255,255,.95), transparent 18%),
        radial-gradient(circle at 88% 16%, rgba(255,255,255,.68), transparent 18%),
        linear-gradient(135deg,#f8fbff 0%,#eef7ff 100%);
      user-select:none;
    }

    .app{
      width:100vw;
      height:100vh;
      padding:clamp(6px,1vh,12px);
      display:grid;
      place-items:center;
    }

    .trainer{
      width:min(1120px,100%);
      height:100%;
      min-height:0;
      display:grid;
      grid-template-rows:auto minmax(0,1fr) auto;
      gap:clamp(7px,1.1vh,12px);
      border-radius:22px;
      background:rgba(255,255,255,.96);
      border:2px solid #dfeeff;
      box-shadow:var(--shadow);
      padding:clamp(8px,1.25vh,14px);
      overflow:hidden;
    }

    .top{
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:12px;
    }

    .tab{
      display:inline-flex;
      align-items:center;
      gap:8px;
      border-radius:17px;
      background:linear-gradient(135deg,var(--blue),var(--blue-dark));
      color:#fff;
      font-weight:950;
      font-size:clamp(15px,2.3vh,21px);
      padding:8px 14px;
      box-shadow:0 10px 22px rgba(47,115,216,.24), inset 0 -4px rgba(0,0,0,.12);
      white-space:nowrap;
    }

    h1{
      margin:0;
      text-align:center;
      font-size:clamp(24px,4.6vh,42px);
      line-height:1;
      color:var(--blue);
      text-shadow:0 3px 0 rgba(255,255,255,.9);
    }

    .progress{
      justify-self:end;
      padding:9px 16px;
      border-radius:19px;
      color:var(--blue);
      background:#f8fbff;
      border:2px solid #dbeafc;
      font-size:clamp(15px,2.1vh,20px);
      font-weight:950;
      white-space:nowrap;
    }

    .main{
      min-height:0;
      display:grid;
      place-items:center;
      overflow:hidden;
    }

    .task-panel{
      width:min(930px,100%);
      min-height:0;
      border:4px solid #cfe5fb;
      border-radius:22px;
      background:
        radial-gradient(circle at 28% 18%, rgba(255,255,255,.76), transparent 22%),
        linear-gradient(135deg,#f9fcff,#eef8ff);
      box-shadow:inset 0 -5px rgba(47,115,216,.04);
      padding:clamp(10px,1.8vh,18px);
      display:grid;
      grid-template-rows:auto auto minmax(0,1fr) auto auto;
      gap:clamp(8px,1.4vh,14px);
      overflow:hidden;
    }

    .task-label{
      text-align:center;
      color:var(--muted);
      font-size:clamp(13px,1.9vh,18px);
      font-weight:900;
    }

    .type-badge{
      justify-self:center;
      display:inline-grid;
      place-items:center;
      min-width:min(430px,100%);
      min-height:clamp(42px,6.8vh,62px);
      border-radius:999px;
      padding:7px 22px;
      color:#fff;
      font-size:clamp(20px,4.2vh,34px);
      font-weight:950;
      box-shadow:0 13px 28px rgba(0,0,0,.14), inset 0 -5px rgba(0,0,0,.12);
      text-align:center;
      animation:popIn .22s ease both;
    }

    .type-badge.positive{
      background:linear-gradient(135deg,#53d77a,#178c3b);
    }

    .type-badge.negative{
      background:linear-gradient(135deg,#ff8b95,#d84545);
    }

    .sentence-card{
      min-height:clamp(128px,28vh,220px);
      border-radius:24px;
      background:linear-gradient(135deg,#fff8ce,#ffd86d);
      display:grid;
      place-items:center;
      text-align:center;
      padding:clamp(16px,3vh,28px);
      box-shadow:0 18px 34px rgba(0,0,0,.13), inset 0 -8px rgba(0,0,0,.08);
      position:relative;
      overflow:hidden;
      animation:popIn .22s ease both;
    }

    .sentence-card::after{
      content:"";
      position:absolute;
      inset:9px;
      border-radius:18px;
      border:3px solid rgba(255,255,255,.46);
      pointer-events:none;
    }

    .sentence{
      position:relative;
      z-index:1;
      font-size:clamp(30px,8.5vh,64px);
      line-height:1.08;
      font-weight:950;
      color:#244a78;
    }

    .blank{
      display:inline-grid;
      place-items:center;
      min-width:clamp(110px,20vh,180px);
      padding:0 10px 6px;
      color:var(--blue);
      border-bottom:6px solid var(--blue);
    }

    .choices{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:clamp(7px,1vh,11px);
    }

    .choice{
      border:0;
      border-radius:999px;
      min-width:clamp(96px,14vh,128px);
      min-height:clamp(42px,6.5vh,56px);
      padding:7px 13px;
      background:#fff;
      color:var(--blue);
      border:2px solid #9ec6f5;
      font-family:inherit;
      font-size:clamp(17px,3.3vh,25px);
      font-weight:950;
      cursor:pointer;
      box-shadow:0 7px 16px rgba(47,115,216,.1), inset 0 -4px rgba(0,0,0,.04);
      transition:transform .12s ease, background .12s ease, border-color .12s ease;
    }

    .choice:hover{
      transform:translateY(-2px);
      background:#f3f9ff;
    }

    .choice.correct{
      border-color:#3bae5c;
      background:var(--green-soft);
      color:var(--green);
    }

    .choice.wrong{
      border-color:#ef8a94;
      background:var(--red-soft);
      color:#b6303b;
      animation:shake .28s ease;
    }

    .hint{
      min-height:44px;
      display:grid;
      place-items:center;
      text-align:center;
      border-radius:16px;
      background:#eff6ff;
      color:#5f7898;
      font-size:clamp(13px,1.9vh,17px);
      font-weight:900;
      line-height:1.2;
      padding:8px 14px;
      border:2px solid #dbeafc;
    }

    .bottom{
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
    }

    .btn{
      border:0;
      border-radius:14px;
      min-width:120px;
      padding:9px 18px;
      background:linear-gradient(135deg,#2f7ceb,#1d67d0);
      color:#fff;
      font-family:inherit;
      font-size:clamp(15px,2vh,19px);
      font-weight:950;
      cursor:pointer;
      box-shadow:0 12px 24px rgba(47,115,216,.24), inset 0 -4px rgba(0,0,0,.12);
    }

    .btn.secondary{
      background:linear-gradient(135deg,#8bbcf6,#5c9eee);
    }

    .finish{
      display:none;
      place-items:center;
      text-align:center;
      min-height:0;
    }

    .finish.show{
      display:grid;
    }

    .finish-card{
      width:min(650px,100%);
      min-height:210px;
      border-radius:24px;
      background:linear-gradient(135deg,#fff8ce,#ffd86d);
      display:grid;
      place-items:center;
      padding:28px;
      box-shadow:0 20px 38px rgba(0,0,0,.14), inset 0 -8px rgba(0,0,0,.08);
      color:#244a78;
      font-size:clamp(30px,7vh,54px);
      font-weight:950;
      line-height:1.08;
    }

    @keyframes popIn{
      from{opacity:0; transform:translateY(12px) scale(.96)}
      to{opacity:1; transform:translateY(0) scale(1)}
    }

    @keyframes shake{
      0%,100%{transform:translateX(0)}
      25%{transform:translateX(-6px)}
      55%{transform:translateX(6px)}
      80%{transform:translateX(-3px)}
    }

    @media(max-width:900px){
      html,body{overflow:auto}
      .app{height:auto;min-height:100vh}
      .trainer{height:auto;min-height:calc(100vh - 28px)}
      .top{grid-template-columns:1fr}
      .progress{justify-self:start}
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="trainer">
      <div class="top">
        <div class="tab">✎ Practice</div>
        <h1>to be: positive / negative</h1>
        <div class="progress" id="progress">1 / 10</div>
      </div>

      <section class="main" id="main">
        <div class="task-panel">
          <div class="task-label">Look at the sentence type. Then choose the correct word.</div>

          <div class="type-badge positive" id="typeBadge">Positive sentence</div>

          <div class="sentence-card" id="sentenceCard">
            <div class="sentence" id="sentence">I <span class="blank">___</span> twelve.</div>
          </div>

          <div class="choices" id="choices"></div>

          <div class="hint" id="hint">First read: positive or negative?</div>
        </div>
      </section>

      <section class="finish" id="finish">
        <div class="finish-card" id="finishCard">Great job!<br>10 / 10</div>
      </section>

      <div class="bottom">
        <button class="btn secondary" id="resetBtn" type="button">Reset</button>
      </div>
    </section>
  </main>

  <script>
    const baseTasks = [
      {
        type:"positive",
        label:"Positive sentence",
        before:"I",
        after:"twelve.",
        answer:"am",
        hint:"Positive with I: I am twelve."
      },
      {
        type:"negative",
        label:"Negative sentence",
        before:"I",
        after:"a teacher.",
        answer:"am not",
        hint:"Negative with I: I am not a teacher."
      },
      {
        type:"positive",
        label:"Positive sentence",
        before:"She",
        after:"new.",
        answer:"is",
        hint:"Positive with she: She is new."
      },
      {
        type:"negative",
        label:"Negative sentence",
        before:"He",
        after:"in Class 2E.",
        answer:"isn't",
        hint:"Negative with he: He isn’t in Class 2E."
      },
      {
        type:"positive",
        label:"Positive sentence",
        before:"It",
        after:"an eraser.",
        answer:"is",
        hint:"Positive with it: It is an eraser."
      },
      {
        type:"negative",
        label:"Negative sentence",
        before:"It",
        after:"a pencil.",
        answer:"isn't",
        hint:"Negative with it: It isn’t a pencil."
      },
      {
        type:"positive",
        label:"Positive sentence",
        before:"We",
        after:"students.",
        answer:"are",
        hint:"Positive with we: We are students."
      },
      {
        type:"negative",
        label:"Negative sentence",
        before:"We",
        after:"in Class 3B.",
        answer:"aren't",
        hint:"Negative with we: We aren’t in Class 3B."
      },
      {
        type:"positive",
        label:"Positive sentence",
        before:"They",
        after:"at school.",
        answer:"are",
        hint:"Positive with they: They are at school."
      },
      {
        type:"negative",
        label:"Negative sentence",
        before:"They",
        after:"teachers.",
        answer:"aren't",
        hint:"Negative with they: They aren’t teachers."
      }
    ];

    const allOptions = ["am", "am not", "is", "isn't", "are", "aren't"];

    let tasks = [];

    function shuffle(array){
      const copy = [...array];
      for(let i = copy.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function makeDeck(){
      tasks = shuffle(baseTasks);
    }

    const sentence = document.getElementById("sentence");
    const sentenceCard = document.getElementById("sentenceCard");
    const choices = document.getElementById("choices");
    const hint = document.getElementById("hint");
    const progress = document.getElementById("progress");
    const main = document.getElementById("main");
    const finish = document.getElementById("finish");
    const finishCard = document.getElementById("finishCard");
    const typeBadge = document.getElementById("typeBadge");

    let index = 0;
    let score = 0;
    let locked = false;
    let results = [];

    function renderTask(){
      locked = false;
      const task = tasks[index];

      progress.textContent = `${index + 1} / ${tasks.length}`;
      typeBadge.textContent = task.label;
      typeBadge.className = `type-badge ${task.type}`;
      sentence.innerHTML = `${task.before} <span class="blank">___</span> ${task.after}`;
      hint.textContent = "First read: positive or negative?";
      choices.innerHTML = "";

      shuffle(allOptions).forEach(option => {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.type = "button";
        btn.textContent = option;
        btn.dataset.option = option;
        btn.addEventListener("click", () => choose(btn));
        choices.appendChild(btn);
      });

      sentenceCard.style.animation = "none";
      typeBadge.style.animation = "none";
      void sentenceCard.offsetWidth;
      sentenceCard.style.animation = "";
      typeBadge.style.animation = "";
    }

    function choose(btn){
      if (locked) return;

      const task = tasks[index];
      const option = btn.dataset.option;

      if (option === task.answer) {
        locked = true;
        btn.classList.add("correct");
        sentence.innerHTML = `${task.before} <span class="blank">${task.answer}</span> ${task.after}`;
        hint.textContent = task.hint;
        score += 1;
        results.push({
          type: task.type,
          sentence: `${task.before} ${task.answer} ${task.after}`,
          answer: option,
          correct: true
        });

        setTimeout(() => {
          index += 1;
          if (index >= tasks.length) {
            finishGame();
          } else {
            renderTask();
          }
        }, 850);
      } else {
        btn.classList.remove("wrong");
        void btn.offsetWidth;
        btn.classList.add("wrong");
        hint.textContent = task.hint;
        results.push({
          type: task.type,
          sentence: `${task.before} ___ ${task.after}`,
          chosen: option,
          correctAnswer: task.answer,
          correct: false
        });
      }
    }

    function finishGame(){
      main.style.display = "none";
      finish.classList.add("show");
      progress.textContent = `${score} / ${tasks.length}`;
      finishCard.innerHTML = `Great job!<br>${score} / ${tasks.length}`;

      const payload = {
        type:"to-be-six-forms-complete",
        score,
        total:tasks.length,
        results,
        sentAt:new Date().toISOString()
      };

      window.parent.postMessage(payload, "*");
      window.postMessage(payload, "*");
      localStorage.setItem("toBeSixFormsLastResult", JSON.stringify(payload));
    }

    function resetGame(){
      index = 0;
      score = 0;
      locked = false;
      results = [];
      makeDeck();
      main.style.display = "";
      finish.classList.remove("show");
      renderTask();
    }

    document.getElementById("resetBtn").addEventListener("click", resetGame);

    resetGame();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School! Scratch Vocabulary Game</title>
  <style>
    :root {
      --blue: #2f73d8;
      --blue-dark: #173d79;
      --paper: rgba(255, 251, 236, 0.92);
      --paper-soft: rgba(255,255,255,0.78);
      --ink: #17345c;
      --green: #23a668;
      --shadow: 0 12px 34px rgba(0,0,0,.22);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: #f0dca5;
    }

    body {
      background-image:
        linear-gradient(90deg, rgba(255, 244, 190, 0.16), rgba(13, 37, 78, 0.08)),
        url("https://storage.yandexcloud.net/kids-app/html-assets/games-school_intro_scratch/0199bd79aa58311b.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      padding: 18px;
    }

    .top-panel {
      position: absolute;
      top: 12px;
      left: 14px;
      width: min(190px, 20vw);
      padding: 7px 9px 8px;
      border-radius: 12px;
      background: rgba(255, 241, 196, 0.42);
      box-shadow: 0 5px 14px rgba(0,0,0,.10);
      border: 2px solid rgba(255,255,255,.36);
      backdrop-filter: blur(2px);
      z-index: 10;
      pointer-events: none;
    }

    .lesson-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0;
      border-radius: 0;
      background: transparent;
      color: var(--blue-dark);
      font-weight: 900;
      font-size: clamp(8px, .62vw, 11px);
      text-shadow: 0 2px 0 rgba(255,255,255,.95), 0 5px 12px rgba(0,0,0,.16);
    }

    .lesson-badge span:first-child {
      display: inline-grid;
      place-items: center;
      width: 16px;
      height: 16px;
      border-radius: 6px;
      background: var(--blue);
      color: #fff;
      box-shadow: inset 0 -3px rgba(0,0,0,.12);
    }

    h1 {
      margin: 4px 0 1px;
      font-size: clamp(17px, 1.7vw, 26px);
      line-height: .95;
      color: var(--blue);
      text-shadow: 0 3px 0 #fff, 0 8px 18px rgba(0,0,0,.10);
    }

    .prompt {
      margin: 0 0 4px;
      font-size: clamp(9px, .72vw, 12px);
      font-weight: 900;
      color: #17345c;
      text-shadow: 0 2px 0 rgba(255,255,255,.95), 0 6px 14px rgba(0,0,0,.16);
    }

    .instruction {
      display: inline-block;
      max-width: 170px;
      padding: 0;
      border-radius: 0;
      background: transparent;
      color: #17345c;
      font-size: clamp(6px, .52vw, 9px);
      font-weight: 900;
      line-height: 1.18;
      text-shadow: 0 2px 0 rgba(255,255,255,.95), 0 5px 12px rgba(0,0,0,.16);
    }

    .toolbar {
      position: absolute;
      bottom: 8px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 7px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(255,255,255,.92), rgba(255,248,218,.86));
      border: 3px solid rgba(255,255,255,.8);
      box-shadow: var(--shadow);
      z-index: 10;
      max-width: 90px;
    }

    .game-title {
      font-size: clamp(12px, 1vw, 15px);
      font-weight: 900;
      color: var(--blue-dark);
      margin-right: 4px;
      white-space: nowrap;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(11px, .95vw, 15px);
      font-weight: 900;
      color: #2d4a70;
    }

    .progress {
      width: min(90px, 10vw);
      height: 8px;
      border-radius: 999px;
      background: #dde9f7;
      overflow: hidden;
      box-shadow: inset 0 2px 5px rgba(0,0,0,.13);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #40c97a, #78e1ff);
      border-radius: inherit;
      transition: width .35s ease;
    }

    .reset-btn {
      border: 0;
      border-radius: 14px;
      padding: 5px 9px;
      background: linear-gradient(135deg, #ff7eb3, #ffb26b);
      color: white;
      font-weight: 950;
      font-size: clamp(11px, .9vw, 14px);
      box-shadow: 0 8px 18px rgba(154, 65, 91, .24), inset 0 -4px rgba(0,0,0,.11);
      cursor: pointer;
    }

    .reset-btn:hover { transform: translateY(-1px); }

    .scratch-area {
      position: absolute;
      inset: 0;
      z-index: 4;
    }

    .scratch-card {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: clamp(82px, 7.7vw, 112px);
      height: clamp(42px, 4.2vw, 58px);
      transform: translate(-50%, -50%);
      border-radius: 14px;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.98), transparent 28%),
        linear-gradient(145deg, #fffef6, #fce8a6);
      border: 3px solid rgba(255,255,255,.95);
      box-shadow: 0 10px 24px rgba(35, 69, 119, .24), inset 0 -4px rgba(0,0,0,.04);
      user-select: none;
      touch-action: none;
    }

    .scratch-card.revealed {
      box-shadow: 0 14px 28px rgba(35, 69, 119, .28), 0 0 0 4px rgba(79, 205, 129, .24);
      transition: .25s ease;
    }

    .card-number {
      position: absolute;
      top: 7px;
      left: 8px;
      z-index: 1;
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-size: 13px;
      font-weight: 950;
      box-shadow: 0 4px 8px rgba(0,0,0,.15);
    }

    .word {
      position: relative;
      z-index: 0;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 0 8px;
      text-align: center;
      font-size: clamp(13px, 1.05vw, 17px);
      font-weight: 950;
      color: #1f4f90;
      text-shadow: 0 2px 0 #fff, 0 6px 14px rgba(0,0,0,.12);
    }

    .scratch-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      cursor: grab;
    }

    .scratch-layer:active { cursor: grabbing; }

    .hint {
      position: absolute;
      left: 22px;
      bottom: 22px;
      padding: 10px 14px;
      border-radius: 18px;
      background: rgba(255,255,255,.8);
      border: 3px solid rgba(255,255,255,.78);
      box-shadow: var(--shadow);
      font-size: clamp(12px, 1vw, 15px);
      font-weight: 800;
      color: #385477;
      z-index: 9;
    }

    .success {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      pointer-events: none;
      z-index: 20;
      background: rgba(255, 247, 215, .14);
    }

    .success.show { display: grid; }

    .success-card {
      padding: 24px 34px;
      border-radius: 30px;
      background: rgba(255,255,255,.95);
      border: 4px solid #fff;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      font-size: clamp(28px, 4.5vw, 64px);
      color: var(--green);
      font-weight: 950;
      text-align: center;
      animation: pop .55s ease both;
    }

    .success-card small {
      display: block;
      margin-top: 7px;
      font-size: clamp(16px, 2vw, 28px);
      color: #234064;
    }

    @keyframes pop {
      0% { transform: scale(.65) rotate(-2deg); opacity: 0; }
      80% { transform: scale(1.05) rotate(1deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); }
    }

    .confetti {
      position: fixed;
      top: -20px;
      left: 0;
      font-size: 26px;
      pointer-events: none;
      z-index: 25;
      animation: fall 1.4s linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(105vh) rotate(540deg); opacity: .1; }
    }

    @media (max-width: 980px) {
      .top-panel { width: min(360px, 58vw); }
      .toolbar { gap: 8px; max-width: 52vw; }
      .game-title { display: none; }
      .scratch-card { width: clamp(84px, 12vw, 116px); height: clamp(46px, 6.5vw, 66px); }
    }

    @media (max-width: 700px) {
      html, body { overflow: auto; }
      .stage { min-height: 100vh; height: 100vh; }
      .top-panel { width: min(220px, 54vw); left: 10px; top: 10px; }
      .toolbar { top: auto; bottom: 12px; right: 12px; left: 12px; max-width: none; justify-content: space-between; }
      .hint { left: 12px; bottom: 76px; right: 12px; }
      .scratch-card { width: clamp(76px, 18vw, 100px); height: clamp(42px, 10vw, 58px); }
      .word { font-size: clamp(14px, 3.2vw, 20px); }
    }
  </style>

<style>
  .lesson-badge, .card-number, .game-title, #score, .progress { display: none !important; }
  .progress-wrap { gap: 0 !important; }
</style>

</head>
<body>
  <main class="stage">
    <section class="top-panel">
      <h1>School!</h1>
      <p class="prompt">What can you see?</p>
      <div class="instruction">Scratch the hidden words in the classroom and say them aloud.</div>
    </section>

    <section class="toolbar" aria-label="Game controls">
      <div class="game-title">Scratch and read</div>
      <div class="progress-wrap">
        <span id="score" style="display:none">0 / 6</span><div class="progress" style="display:none" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div><button class="reset-btn" id="resetBtn" type="button">Reset</button>
      </div>
    </section>

    <section class="scratch-area" aria-label="Vocabulary scratch game">
      <article class="scratch-card" style="--x: 18%; --y: 36%;" data-word="timetable">
        <div class="word">timetable</div>
        <canvas class="scratch-layer" aria-label="Scratch to reveal word 1"></canvas>
      </article>

      <article class="scratch-card" style="--x: 70%; --y: 20%;" data-word="lesson">
        <div class="word">lesson</div>
        <canvas class="scratch-layer" aria-label="Scratch to reveal word 2"></canvas>
      </article>

      <article class="scratch-card" style="--x: 45%; --y: 55%;" data-word="classroom">
        <div class="word">classroom</div>
        <canvas class="scratch-layer" aria-label="Scratch to reveal word 3"></canvas>
      </article>

      <article class="scratch-card" style="--x: 27%; --y: 73%;" data-word="class">
        <div class="word">class</div>
        <canvas class="scratch-layer" aria-label="Scratch to reveal word 4"></canvas>
      </article>

      <article class="scratch-card" style="--x: 83%; --y: 50%;" data-word="room">
        <div class="word">room</div>
        <canvas class="scratch-layer" aria-label="Scratch to reveal word 5"></canvas>
      </article>

      <article class="scratch-card" style="--x: 57%; --y: 84%;" data-word="school">
        <div class="word">school</div>
        <canvas class="scratch-layer" aria-label="Scratch to reveal word 6"></canvas>
      </article>
    </section>

  </main>

  <div class="success" id="success">
    <div class="success-card">Great job!<small>Now answer: What can you see?</small></div>
  </div>

  <script>
    const cards = Array.from(document.querySelectorAll('.scratch-card'));
    const scoreEl = document.getElementById('score');
    const progressFill = document.getElementById('progressFill');
    const resetBtn = document.getElementById('resetBtn');
    const success = document.getElementById('success');
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    let resultSent = false;

    function paintFoil(canvas) {
      const card = canvas.closest('.scratch-card');
      const rect = card.getBoundingClientRect();
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';

      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalCompositeOperation = 'source-over';

      const gradient = ctx.createLinearGradient(0, 0, rect.width, rect.height);
      gradient.addColorStop(0, '#d7dce6');
      gradient.addColorStop(0.22, '#f7f9ff');
      gradient.addColorStop(0.45, '#aeb7c8');
      gradient.addColorStop(0.72, '#eef2fb');
      gradient.addColorStop(1, '#bcc5d6');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, rect.width, rect.height);

      ctx.fillStyle = 'rgba(255,255,255,.28)';
      for (let i = 0; i < 55; i++) {
        const x = Math.random() * rect.width;
        const y = Math.random() * rect.height;
        const r = 1 + Math.random() * 2.2;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.strokeStyle = 'rgba(255,255,255,.32)';
      ctx.lineWidth = 3;
      for (let i = -rect.height; i < rect.width; i += 24) {
        ctx.beginPath();
        ctx.moveTo(i, rect.height);
        ctx.lineTo(i + rect.height, 0);
        ctx.stroke();
      }

      ctx.fillStyle = 'rgba(36, 61, 100, .62)';
      ctx.font = `900 ${Math.max(11, rect.width * 0.13)}px Trebuchet MS, Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('SCRATCH', rect.width / 2, rect.height / 2 - 4);
    }

    function getPointerPosition(event, canvas) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left),
        y: (event.clientY - rect.top)
      };
    }

    function scratch(event, canvas) {
      event.preventDefault();
      const ctx = canvas.getContext('2d');
      const pos = getPointerPosition(event, canvas);
      const rect = canvas.getBoundingClientRect();
      const radius = Math.max(16, Math.min(rect.width, rect.height) * 0.22);

      ctx.save();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function scratchedPercent(canvas) {
      const ctx = canvas.getContext('2d');
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let transparent = 0;
      let total = 0;
      const step = 32;
      for (let i = 3; i < data.length; i += 4 * step) {
        total++;
        if (data[i] < 50) transparent++;
      }
      return transparent / total;
    }

    function updateProgress() {
      const revealed = cards.filter(card => card.classList.contains('revealed')).length;
      scoreEl.textContent = `${revealed} / ${cards.length}`;
      progressFill.style.width = `${(revealed / cards.length) * 100}%`;

      if (revealed === cards.length) {
        success.classList.add('show');
        launchConfetti();
        if (!resultSent && window.parent !== window) {
          resultSent = true;
          window.parent.postMessage({
            type: 'school-intro-done',
            score: revealed,
            total: cards.length,
            results: { revealed }
          }, '*');
        }
        setTimeout(() => success.classList.remove('show'), 2400);
      }
    }

    function revealCard(card) {
      if (card.classList.contains('revealed')) return;
      card.classList.add('revealed');
      const canvas = card.querySelector('canvas');
      canvas.style.opacity = 0;
      setTimeout(() => { canvas.style.display = 'none'; }, 220);
      updateProgress();
    }

    function setupCard(card) {
      const canvas = card.querySelector('.scratch-layer');
      let drawing = false;
      let checkTimer = null;
      canvas.style.transition = 'opacity .22s ease';
      paintFoil(canvas);

      canvas.addEventListener('pointerdown', (event) => {
        drawing = true;
        canvas.setPointerCapture(event.pointerId);
        scratch(event, canvas);
      });

      canvas.addEventListener('pointermove', (event) => {
        if (!drawing) return;
        scratch(event, canvas);
        if (!checkTimer) {
          checkTimer = requestAnimationFrame(() => {
            checkTimer = null;
            if (scratchedPercent(canvas) > 0.42) revealCard(card);
          });
        }
      });

      const end = (event) => {
        if (!drawing) return;
        drawing = false;
        try { canvas.releasePointerCapture(event.pointerId); } catch(e) {}
        if (scratchedPercent(canvas) > 0.34) revealCard(card);
      };
      canvas.addEventListener('pointerup', end);
      canvas.addEventListener('pointercancel', end);
      canvas.addEventListener('pointerleave', end);
    }

    function resetGame() {
      success.classList.remove('show');
      resultSent = false;
      cards.forEach(card => {
        card.classList.remove('revealed');
        const canvas = card.querySelector('canvas');
        canvas.style.display = 'block';
        canvas.style.opacity = 1;
        paintFoil(canvas);
      });
      updateProgress();
    }

    function launchConfetti() {
      const icons = ['⭐', '✏️', '📚', '🎒', '✨', '💙'];
      for (let i = 0; i < 28; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti';
        piece.textContent = icons[Math.floor(Math.random() * icons.length)];
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.animationDelay = `${Math.random() * 0.45}s`;
        piece.style.animationDuration = `${1 + Math.random() * 0.9}s`;
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 2200);
      }
    }

    cards.forEach(setupCard);
    resetBtn.addEventListener('click', resetGame);

    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        cards.forEach(card => {
          if (!card.classList.contains('revealed')) paintFoil(card.querySelector('canvas'));
        });
      }, 180);
    });

    updateProgress();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2a — Spider-Man quiz</title>
  <style>
    :root {
      --red:#e63e45;
      --red-dark:#b92630;
      --blue:#3f73b3;
      --blue-dark:#28517e;
      --ink:#263247;
      --muted:#6d7685;
      --line:#e4e8ed;
      --green:#35a96f;
      --green-bg:#eaf8f1;
      --red-bg:#fff0ef;
      --yellow-bg:#fff7e7;
      --cream:#fffaf6;
      --shadow:0 20px 55px rgba(43,34,29,.13);
    }

    * { box-sizing:border-box; }
    html,body {
      margin:0;
      min-height:100%;
      font-family:Inter, ui-rounded, "Segoe UI", Arial, sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 8% 10%, rgba(230,62,69,.14), transparent 26%),
        radial-gradient(circle at 90% 12%, rgba(63,115,179,.18), transparent 26%),
        #f4f1ee;
      overflow:hidden;
    }

    button,input { font:inherit; }

    .app {
      width:min(1180px, calc(100vw - 24px));
      height:min(90vh, 840px);
      margin:5vh auto;
      background:rgba(255,255,255,.98);
      border:1px solid rgba(214,205,198,.8);
      border-radius:28px;
      box-shadow:var(--shadow);
      overflow:hidden;
      display:grid;
      grid-template-rows:auto 1fr auto;
    }

    header {
      display:flex;
      align-items:center;
      gap:16px;
      padding:17px 22px 14px;
      border-bottom:1px solid #ece8e3;
      background:#fff;
    }

    .badge {
      width:56px;
      height:56px;
      border-radius:18px;
      display:grid;
      place-items:center;
      color:#fff;
      font-size:21px;
      font-weight:950;
      background:linear-gradient(145deg,var(--red),var(--red-dark));
      box-shadow:0 8px 18px rgba(185,38,48,.24);
      transform:rotate(-3deg);
      flex:none;
    }

    h1 {
      margin:0;
      font-size:clamp(27px,3vw,42px);
      line-height:1;
      letter-spacing:-.04em;
    }

    .subtitle {
      margin:7px 0 0;
      color:var(--muted);
      font-size:14px;
    }

    .score {
      margin-left:auto;
      min-width:120px;
      padding:10px 13px;
      border-radius:16px;
      background:#fff1f2;
      border:1px solid #f2c8cb;
      color:var(--red-dark);
      font-weight:900;
      text-align:center;
    }

    main {
      padding:18px 20px;
      min-height:0;
      display:grid;
      grid-template-columns:320px 1fr;
      gap:20px;
      align-items:stretch;
    }

    .side {
      border-radius:24px;
      overflow:hidden;
      border:1px solid #dfe3e8;
      background:#dfe8ef;
      position:relative;
      min-height:0;
    }

    .side img {
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .side::after {
      content:"";
      position:absolute;
      inset:auto 0 0;
      height:38%;
      background:linear-gradient(transparent,rgba(26,34,48,.82));
    }

    .side-copy {
      position:absolute;
      left:18px;
      right:18px;
      bottom:16px;
      z-index:2;
      color:#fff;
    }

    .side-copy strong {
      display:block;
      font-size:28px;
      margin-bottom:5px;
    }

    .side-copy span {
      font-size:13px;
      opacity:.9;
    }

    .quiz-card {
      border:1px solid #e5e1dd;
      border-radius:24px;
      background:#fff;
      box-shadow:0 12px 28px rgba(44,33,25,.07);
      padding:22px;
      min-height:0;
      display:flex;
      flex-direction:column;
    }

    .topline {
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:12px;
    }

    .question-count {
      color:var(--red-dark);
      font-size:12px;
      font-weight:950;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .attempts {
      margin-left:auto;
      color:var(--muted);
      font-size:13px;
      font-weight:800;
    }

    .question {
      margin:0 0 18px;
      font-size:clamp(25px,3vw,36px);
      line-height:1.18;
      letter-spacing:-.03em;
    }

    .choices {
      display:grid;
      gap:10px;
    }

    .choice {
      border:1px solid #d8dee7;
      border-radius:16px;
      background:#fff;
      color:#344054;
      padding:13px 15px;
      font-weight:850;
      cursor:pointer;
      text-align:left;
      transition:.16s ease;
    }

    .choice:hover {
      border-color:#e57d82;
      transform:translateY(-1px);
    }

    .choice.selected {
      background:#fff0f1;
      border-color:#df666d;
      color:#9e2d35;
      box-shadow:inset 0 0 0 1px #df666d;
    }

    .choice.correct {
      background:var(--green-bg);
      border-color:#70c895;
      color:#246a47;
    }

    .choice.wrong {
      background:var(--red-bg);
      border-color:#e58e89;
      color:#98362f;
    }

    .short-answer {
      display:none;
    }

    .short-answer.show {
      display:block;
    }

    .short-answer input {
      width:100%;
      border:1px solid #d7dde6;
      border-radius:15px;
      padding:13px 14px;
      outline:none;
      color:var(--ink);
    }

    .short-answer input:focus {
      border-color:#df666d;
      box-shadow:0 0 0 4px rgba(230,62,69,.11);
    }

    .feedback {
      display:none;
      margin-top:15px;
      padding:13px 15px;
      border-radius:16px;
      font-weight:850;
      line-height:1.45;
    }

    .feedback.show { display:block; }
    .feedback.correct {
      background:var(--green-bg);
      border:1px solid #a8ddbf;
      color:#256b48;
    }

    .feedback.incorrect {
      background:var(--red-bg);
      border:1px solid #efb0ac;
      color:#98362f;
    }

    .feedback.hint {
      background:var(--yellow-bg);
      border:1px solid #efcf95;
      color:#815a19;
    }

    .paragraph-hint {
      display:none;
      margin-top:12px;
      padding:13px 15px;
      border-radius:16px;
      background:#eef5ff;
      border:1px solid #b9d4f4;
      color:#2b527c;
      line-height:1.55;
      font-weight:750;
    }

    .paragraph-hint.show { display:block; }

    .actions {
      margin-top:auto;
      padding-top:18px;
      display:flex;
      justify-content:flex-end;
      gap:10px;
    }

    .btn {
      border:0;
      border-radius:15px;
      padding:12px 20px;
      font-weight:950;
      cursor:pointer;
      transition:.18s ease;
    }

    .btn:hover:not(:disabled) { transform:translateY(-2px); }

    .check {
      color:#fff;
      background:linear-gradient(135deg,var(--red),var(--red-dark));
      box-shadow:0 9px 20px rgba(185,38,48,.22);
    }

    .next {
      display:none;
      color:#fff;
      background:linear-gradient(135deg,var(--blue),var(--blue-dark));
      box-shadow:0 9px 20px rgba(39,79,125,.22);
    }

    .result {
      display:none;
      height:100%;
      place-items:center;
      text-align:center;
      padding:24px;
    }

    .result.show {
      display:grid;
    }

    .result-card {
      width:min(620px,100%);
      border:1px solid #dfe4ea;
      border-radius:26px;
      padding:28px;
      background:#fff;
      box-shadow:0 14px 34px rgba(42,50,65,.10);
    }

    .result-icon {
      width:82px;
      height:82px;
      border-radius:24px;
      display:grid;
      place-items:center;
      margin:0 auto 16px;
      background:var(--green-bg);
      color:var(--green);
      font-size:42px;
      font-weight:950;
    }

    .result h2 {
      margin:0 0 8px;
      font-size:36px;
      letter-spacing:-.03em;
    }

    .result p {
      margin:0;
      color:var(--muted);
      font-size:17px;
      line-height:1.5;
    }

    .result-score {
      margin:18px 0;
      font-size:54px;
      line-height:1;
      font-weight:950;
      color:var(--red-dark);
    }

    footer {
      display:flex;
      align-items:center;
      gap:10px;
      padding:12px 20px 16px;
      border-top:1px solid #ece8e3;
      background:#fff;
    }

    .footer-note {
      margin-right:auto;
      color:var(--muted);
      font-size:14px;
    }

    .continue {
      display:none;
      color:#fff;
      background:linear-gradient(135deg,var(--blue),var(--blue-dark));
      box-shadow:0 9px 20px rgba(39,79,125,.22);
    }

    @media(max-width:860px) {
      html,body { overflow:auto; }
      .app {
        height:auto;
        min-height:calc(100vh - 20px);
        margin:10px auto;
      }
      main {
        grid-template-columns:1fr;
      }
      .side {
        height:280px;
      }
    }

    @media(max-width:560px) {
      header { padding:14px; }
      .score { display:none; }
      main { padding:14px; }
      .quiz-card { padding:17px; }
    }
    /* Lesson iframe: use the complete embedded viewport without page scrolling. */
    html,body{width:100%;height:100%;overflow:hidden}
    .app{height:calc(100vh - 24px);margin:12px auto}
    main{min-height:0;overflow:hidden}
  </style>
</head>

        <div class="side-copy">
          <strong>Spider-Man quiz</strong>
          <span>Read carefully. Tiny details enjoy causing large mistakes.</span>
        </div>
      </aside>

      <section id="quizCard" class="quiz-card">
        <div class="topline">
          <div id="questionCount" class="question-count">Question 1 of 8</div>
          <div id="attempts" class="attempts">Attempt 1 of 2</div>
        </div>

        <h2 id="question" class="question"></h2>

        <div id="choices" class="choices"></div>

        <div id="shortAnswer" class="short-answer">
          <input id="answerInput" type="text" autocomplete="off" placeholder="Write a short answer">
        </div>

        <div id="feedback" class="feedback"></div>
        <div id="paragraphHint" class="paragraph-hint"></div>

        <div class="actions">
          <button id="checkBtn" class="btn check">Check</button>
          <button id="nextBtn" class="btn next">Next</button>
        </div>
      </section>

      <section id="result" class="result">
        <div class="result-card">
          <div class="result-icon">✓</div>
          <h2>Quiz complete</h2>
          <div id="resultScore" class="result-score">8 / 8</div>
          <p id="resultText">You remembered the story well.</p>
        </div>
      </section>
    </main>

    <footer>
      <div id="footerNote" class="footer-note">Answer the question and press Check.</div>
      <button id="continueBtn" class="btn continue">Continue</button>
    </footer>
  </section>

  <script>
    const questions = [
      {
        type:'choice',
        question:'Where does Peter Parker live?',
        options:['London','New York City','Paris'],
        answer:'New York City',
        paragraph:'Paragraph 1: Peter Parker is a quiet teenager from New York City.'
      },
      {
        type:'choice',
        question:'Who does Peter live with?',
        options:['Mary Jane','Aunt May','The Green Goblin'],
        answer:'Aunt May',
        paragraph:'Paragraph 1: Peter lives with his aunt, Aunt May.'
      },
      {
        type:'choice',
        question:'Where does the spider bite Peter?',
        options:['at school','at home','in a science lab'],
        answer:'in a science lab',
        paragraph:'Paragraph 2: A spider bites Peter in a science lab.'
      },
      {
        type:'choice',
        question:'What can Spider-Man do?',
        options:['fly','climb walls','become invisible'],
        answer:'climb walls',
        paragraph:'Paragraph 3: Peter can climb walls and move like a spider.'
      },
      {
        type:'choice',
        question:'Who is Spider-Man’s enemy?',
        options:['Mary Jane','Aunt May','The Green Goblin'],
        answer:'The Green Goblin',
        paragraph:'Paragraph 4: The Green Goblin is Spider-Man’s enemy.'
      },
      {
        type:'text',
        question:'Who is Peter’s friend?',
        accepted:['mary jane','mary jane.','his friend is mary jane','mary jane is his friend'],
        displayAnswer:'Mary Jane.',
        paragraph:'Paragraph 1: Mary Jane is Peter’s close friend.'
      },
      {
        type:'text',
        question:'Is Peter strong and fast?',
        accepted:['yes','yes.','yes, he is','yes he is','yes, he is.','yes he is.'],
        displayAnswer:'Yes, he is.',
        paragraph:'Paragraph 3: Peter is strong and fast.'
      },
      {
        type:'text',
        question:'Has Peter got special powers?',
        accepted:['yes','yes.','yes, he has','yes he has','yes, he has.','yes he has.'],
        displayAnswer:'Yes, he has.',
        paragraph:'Paragraph 2: After the spider bite, Peter gets special powers.'
      }
    ];

    let index = 0;
    let attempt = 1;
    let selected = '';
    let score = 0;
    const results = [];

    const questionCount = document.getElementById('questionCount');
    const attempts = document.getElementById('attempts');
    const questionEl = document.getElementById('question');
    const choicesEl = document.getElementById('choices');
    const shortAnswer = document.getElementById('shortAnswer');
    const answerInput = document.getElementById('answerInput');
    const feedback = document.getElementById('feedback');
    const paragraphHint = document.getElementById('paragraphHint');
    const checkBtn = document.getElementById('checkBtn');
    const nextBtn = document.getElementById('nextBtn');
    const quizCard = document.getElementById('quizCard');
    const side = document.getElementById('side');
    const result = document.getElementById('result');
    const scoreEl = document.getElementById('score');
    const resultScore = document.getElementById('resultScore');
    const resultText = document.getElementById('resultText');
    const continueBtn = document.getElementById('continueBtn');
    const footerNote = document.getElementById('footerNote');

    function normalise(value){
      return value
        .trim()
        .toLowerCase()
        .replace(/\s+/g,' ');
    }

    function render(){
      const item = questions[index];
      attempt = 1;
      selected = '';

      questionCount.textContent = `Question ${index + 1} of ${questions.length}`;
      attempts.textContent = 'Attempt 1 of 2';
      questionEl.textContent = item.question;

      feedback.className = 'feedback';
      feedback.textContent = '';
      paragraphHint.className = 'paragraph-hint';
      paragraphHint.textContent = '';

      checkBtn.style.display = 'inline-block';
      nextBtn.style.display = 'none';

      choicesEl.innerHTML = '';
      shortAnswer.classList.remove('show');
      answerInput.value = '';
      answerInput.disabled = false;

      if(item.type === 'choice'){
        item.options.forEach(option => {
          const button = document.createElement('button');
          button.className = 'choice';
          button.textContent = option;
          button.dataset.value = option;

          button.addEventListener('click', () => {
            document.querySelectorAll('.choice')
              .forEach(btn => btn.classList.toggle('selected', btn === button));
            selected = option;
          });

          choicesEl.appendChild(button);
        });
      }else{
        shortAnswer.classList.add('show');
      }

      footerNote.textContent = 'Answer the question and press Check.';
    }

    function currentAnswer(){
      const item = questions[index];
      return item.type === 'choice' ? selected : normalise(answerInput.value);
    }

    function isCorrect(){
      const item = questions[index];
      const answer = currentAnswer();

      if(item.type === 'choice'){
        return answer === item.answer;
      }

      return item.accepted.includes(answer);
    }

    function lockCurrent(correct){
      const item = questions[index];

      if(item.type === 'choice'){
        document.querySelectorAll('.choice').forEach(button => {
          button.disabled = true;
          button.classList.remove('correct','wrong');

          if(button.dataset.value === item.answer){
            button.classList.add('correct');
          }

          if(button.dataset.value === selected && selected !== item.answer){
            button.classList.add('wrong');
          }
        });
      }else{
        answerInput.disabled = true;
      }
    }

    function answerDisplay(){
      const item = questions[index];
      return item.type === 'choice' ? item.answer : item.displayAnswer;
    }

    checkBtn.addEventListener('click', () => {
      const item = questions[index];
      const answer = currentAnswer();

      if(!answer){
        feedback.className = 'feedback show hint';
        feedback.textContent =
          item.type === 'choice'
            ? 'Choose one answer first.'
            : 'Write a short answer first.';
        return;
      }

      if(isCorrect()){
        score++;
        scoreEl.textContent = score;
        lockCurrent(true);

        feedback.className = 'feedback show correct';
        feedback.textContent = `Correct: ${answerDisplay()}`;

        results.push({
          question:item.question,
          answer,
          correct:true,
          attempts:attempt
        });

        checkBtn.style.display = 'none';
        nextBtn.style.display = 'inline-block';
        footerNote.textContent = 'Correct. Go to the next question.';
        return;
      }

      if(attempt === 1){
        attempt = 2;
        attempts.textContent = 'Attempt 2 of 2';
        feedback.className = 'feedback show incorrect';
        feedback.textContent = 'Not quite. Read the question again and try once more.';
        footerNote.textContent = 'One more attempt.';
        return;
      }

      lockCurrent(false);
      feedback.className = 'feedback show incorrect';
      feedback.textContent = `The correct answer is: ${answerDisplay()}`;

      paragraphHint.className = 'paragraph-hint show';
      paragraphHint.textContent = item.paragraph;

      results.push({
        question:item.question,
        answer,
        correct:false,
        attempts:2,
        correctAnswer:answerDisplay()
      });

      checkBtn.style.display = 'none';
      nextBtn.style.display = 'inline-block';
      footerNote.textContent = 'Review the paragraph, then continue.';
    });

    nextBtn.addEventListener('click', () => {
      if(index < questions.length - 1){
        index++;
        render();
        return;
      }

      quizCard.style.display = 'none';
      side.style.display = 'none';
      result.classList.add('show');

      resultScore.textContent = `${score} / ${questions.length}`;

      if(score === questions.length){
        resultText.textContent = 'Perfect. You remembered every detail.';
      }else if(score >= 6){
        resultText.textContent = 'Strong result. You understood the story well.';
      }else{
        resultText.textContent = 'Good start. Review the story once more.';
      }

      continueBtn.style.display = 'inline-block';
      footerNote.textContent = 'The reading quiz is complete.';

      localStorage.setItem('spideyQuizResult',JSON.stringify({
        score,
        total:questions.length,
        answers:results
      }));
    });

    continueBtn.addEventListener('click', () => {
      const result = JSON.parse(localStorage.getItem('spideyQuizResult') || '{}');

      window.parent?.postMessage({
        type:'lesson-step-complete',
        lesson:'2a',
        step:'spidey-reading-comprehension',
        result
      },'*');

      continueBtn.textContent = 'Done ✓';
    });

    render();
  </script>

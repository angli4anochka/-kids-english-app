<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A or An? Dog Quiz</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Nunito,"Trebuchet MS",sans-serif;color:#21375b;overflow:hidden}
    button{font:inherit}.scene{min-height:100vh;background:linear-gradient(#d9ecff55,#fff0),url('https://storage.yandexcloud.net/kids-app/html-assets/games-a_an_dog_quiz_stage1/486b2e9462a39ab3.png') center/cover no-repeat;display:grid;place-items:center;position:relative}
    .scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(26,48,83,.12));pointer-events:none}
    .lesson-goal{position:absolute;z-index:3;left:clamp(28px,6vw,100px);top:50%;transform:translateY(-50%);width:min(360px,28vw);padding:25px 28px;background:rgba(255,255,255,.94);border:4px solid #6c63e8;border-radius:28px;box-shadow:0 16px 38px #23375b3b;font-size:clamp(20px,2vw,30px);line-height:1.35;font-weight:900;color:#35466d;text-align:left}.lesson-goal strong{display:block;margin-bottom:7px;color:#5a55d7;font-size:.72em;text-transform:uppercase;letter-spacing:.08em}
    .dog-wrap{position:relative;z-index:2;margin-top:17vh;cursor:pointer;border:0;background:none;padding:0;filter:drop-shadow(0 20px 15px #29446744);animation:idle 2.4s ease-in-out infinite}
    .dog{width:clamp(220px,28vw,390px);height:auto;display:block;transition:.2s}.dog-wrap:hover .dog{transform:scale(1.06)}
    .bubble{position:absolute;right:-58px;top:-72px;background:#fff;border:5px solid #6c63e8;border-radius:36px;padding:15px 29px;font-size:clamp(22px,2.4vw,38px);font-weight:900;color:#5a55d7;box-shadow:0 10px 25px #29386138;animation:float 1.5s ease-in-out infinite}
    .bubble:after{content:"";position:absolute;left:23px;bottom:-21px;width:28px;height:28px;background:white;border-right:5px solid #6c63e8;border-bottom:5px solid #6c63e8;transform:rotate(45deg)}
    @keyframes idle{50%{transform:translateY(-9px)}}@keyframes float{50%{transform:translateY(-8px)}}
    .modal-backdrop{position:fixed;inset:0;z-index:10;background:rgba(22,33,61,.58);backdrop-filter:blur(7px);display:none;place-items:center;padding:18px}.modal-backdrop.open{display:grid}
    .modal{width:min(880px,96vw);max-height:94vh;overflow:auto;background:#fff;border-radius:30px;padding:28px 32px 25px;box-shadow:0 25px 80px #10162d88;position:relative}
    .close{position:absolute;right:20px;top:18px;width:42px;height:42px;border:0;border-radius:50%;background:#edf0ff;color:#5961c9;font-size:26px;cursor:pointer}
    h1{margin:0;text-align:center;font-size:clamp(30px,4vw,48px);color:#4d55c5}.rule{text-align:center;margin:8px 40px 20px;font-size:18px}.rule b{color:#ec6b70}
    .quiz{display:grid;grid-template-columns:1fr 1fr;gap:11px 16px}.item{display:flex;align-items:center;gap:10px;background:#f6f7ff;border:2px solid transparent;border-radius:18px;padding:10px 13px;transition:.2s}.item.good{background:#eafaf0;border-color:#4bc47a}.item.bad{background:#fff0f1;border-color:#ef6b72}
    .num{width:27px;color:#8a91aa;font-weight:800}.choices{display:flex;gap:5px}.choice{width:47px;height:40px;border:2px solid #cdd2ef;border-radius:12px;background:#fff;color:#5b61c6;font-weight:900;cursor:pointer}.choice:hover{border-color:#7069e9}.choice.selected{background:#6c63e8;color:#fff;border-color:#6c63e8}.word{font-size:21px;font-weight:800}.mark{margin-left:auto;font-size:22px}
    .actions{display:flex;justify-content:center;gap:12px;margin-top:21px;flex-wrap:wrap}.check,.again,.next{border:0;border-radius:15px;padding:13px 27px;font-size:18px;font-weight:900;cursor:pointer}.check{background:#ffca4b;color:#3c3f54;box-shadow:0 6px 0 #dba62c}.again{display:none;background:#e8eaff;color:#525ac2}.next{display:none;background:#65c98b;color:#fff;box-shadow:0 6px 0 #3ca966}.result{text-align:center;min-height:30px;margin-top:13px;font-weight:900;font-size:22px;color:#4d55c5}
    .stage{display:none}.stage.active{display:block}.words{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}.word-task{display:flex;align-items:center;gap:12px;background:#f6f7ff;border:2px solid transparent;border-radius:17px;padding:12px 15px;font-size:20px;font-weight:900}.word-task.good{background:#eafaf0;border-color:#4bc47a}.word-task.bad{background:#fff0f1;border-color:#ef6b72}.word-task input{width:44px;height:42px;border:2px solid #9ba4df;border-radius:10px;text-align:center;text-transform:lowercase;font:900 21px Nunito,sans-serif;color:#4d55c5;outline:none}.word-task input:focus{border-color:#665ee7;box-shadow:0 0 0 3px #665ee722}.word-task .mark{margin-left:auto}.back{border:0;background:#edf0ff;color:#5961c9;border-radius:12px;padding:9px 15px;font-weight:900;cursor:pointer;margin-bottom:8px}
    @media(max-width:760px){.lesson-goal{top:24px;left:50%;transform:translateX(-50%);width:88vw;text-align:center;padding:15px 20px}.dog-wrap{margin-top:28vh}.quiz,.words{grid-template-columns:1fr}.modal{padding:24px 17px}.bubble{right:-20px}.item{padding:8px}.rule{margin-left:30px;margin-right:30px}}
  
    html,body{width:100%;height:100%}
    body{background:#cfe5ff}
    .modal{max-width:min(880px,calc(100vw - 16px));max-height:calc(100vh - 16px)}
    @media (max-width:760px){.modal{max-height:calc(100vh - 12px)}}
</style>
</head>
<body>
<main class="scene">
    <div class="lesson-goal"><strong>Today’s mission</strong>Today you will meet new classmates and tell them about yourself.</div>
    <button class="dog-wrap" id="dog" aria-label="Open the quiz"><span class="bubble">Click!</span><img class="dog" src="https://storage.yandexcloud.net/kids-app/html-assets/games-a_an_dog_quiz_stage1/7b04e491638af5ba.png" alt="Friendly puppy"></button>
  </main>
  <div class="modal-backdrop" id="backdrop" role="dialog" aria-modal="true" aria-labelledby="title">
    <section class="modal"><button class="close" id="close" aria-label="Close">×</button>
      <div class="stage active" id="stage1"><h1 id="title">A or An?</h1><p class="rule">Choose <b>a</b> before a consonant sound and <b>an</b> before a vowel sound.</p>
      <div class="quiz" id="quiz"></div>
      <div class="actions"><button class="check" id="check">Check answers</button><button class="again" id="again">Try again</button><button class="next" id="next">Next →</button></div><div class="result" id="result"></div></div>
      </section>
  </div>
<script>
    const tasks=[['apple','an'],['dog','a'],['elephant','an'],['book','a'],['orange','an'],['umbrella','an'],['cat','a'],['ice cream','an'],['pencil','a'],['egg','an']];
    const quiz=document.querySelector('#quiz');
    const backdrop=document.querySelector('#backdrop');
    const result=document.querySelector('#result');
    const again=document.querySelector('#again');
    const next=document.querySelector('#next');
    const dog=document.querySelector('#dog');
    const close=document.querySelector('#close');
    let submitted=false;

    tasks.forEach(([word],i)=>{quiz.insertAdjacentHTML('beforeend',`<div class="item" data-i="${i}"><span class="num">${i+1}.</span><span class="choices"><button class="choice" data-value="a">a</button><button class="choice" data-value="an">an</button></span><span class="word">${word}</span><span class="mark"></span></div>`)});

    const collectAnswers = () => Array.from(document.querySelectorAll('.item')).map((item,i)=>({
      word: tasks[i][0],
      chosen: item.dataset.answer || "",
      correct: tasks[i][1],
      isCorrect: item.dataset.answer === tasks[i][1],
    }));

    const submitResult = (score, total) => {
      if (submitted) return;
      submitted = true;
      const payload = {
        type: 'unit1b-a-an-dog-quiz-done',
        score,
        total,
        results: { answers: collectAnswers() },
      };
      try { window.parent?.postMessage(payload, "*"); } catch {}
    };

    quiz.addEventListener('click',e=>{
      if(!e.target.matches('.choice')) return;
      const item=e.target.closest('.item');
      item.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));
      e.target.classList.add('selected');
      item.dataset.answer=e.target.dataset.value;
      item.classList.remove('good','bad');
      item.querySelector('.mark').textContent='';
      result.textContent='';
    });

    dog.onclick=()=>backdrop.classList.add('open');
    close.onclick=()=>backdrop.classList.remove('open');
    backdrop.addEventListener('click',e=>{if(e.target===backdrop)backdrop.classList.remove('open')});

    const evaluate = () => {
      let score=0;
      let answered=0;
      document.querySelectorAll('.item').forEach((item,i)=>{
        const chosen=item.dataset.answer;
        if(chosen) answered++;
        const ok=chosen===tasks[i][1];
        item.classList.toggle('good',ok);
        item.classList.toggle('bad',!ok);
        item.querySelector('.mark').textContent=ok?'✓':'✗';
        if(ok) score++;
      });
      result.textContent=answered<tasks.length?'Answer all the questions. Your score: '+score+'/10':score===10?'Perfect! 10/10 🎉':'Great try! Your score: '+score+'/10';
      again.style.display='inline-block';
      next.style.display='inline-block';
      submitResult(score, tasks.length);
    };

    document.querySelector('#check').onclick=evaluate;
    again.onclick=()=>{document.querySelectorAll('.item').forEach(item=>{delete item.dataset.answer;item.className='item';item.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));item.querySelector('.mark').textContent=''});result.textContent='';again.style.display='none';next.style.display='none'};
    next.onclick=()=>{evaluate();backdrop.classList.remove('open');};
    document.addEventListener('keydown',e=>{if(e.key==='Escape')backdrop.classList.remove('open')});
  </script>
</body>
</html>

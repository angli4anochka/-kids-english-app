<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading — Sally’s profile</title>
  <style>
    :root{--navy:#102a56;--blue:#3976e8;--purple:#7658df;--green:#14845e;--red:#d74655;--muted:#667d9f}*{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,ui-rounded,"Nunito Sans",system-ui,sans-serif;color:var(--navy);background:radial-gradient(circle at 8% 0,#dceaff 0,transparent 34%),linear-gradient(145deg,#fbfdff,#edf3ff)}
    body{height:100dvh}.app{width:min(1220px,100%);height:100dvh;margin:auto;padding:8px 14px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;overflow:hidden}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{display:flex;align-items:center;gap:10px;min-width:0}.badge{width:40px;aspect-ratio:1;display:grid;place-items:center;border:2px solid #fff;border-radius:12px;color:#fff;background:linear-gradient(145deg,#6096f3,#355fc5);box-shadow:0 7px 18px #315fc733;font-size:1.2rem;font-weight:900;flex:0 0 auto}h1,h2,h3,p{margin:0}h1{font-size:1.5rem;line-height:1.05;letter-spacing:0}.eyebrow{color:#6d83a5;font-size:.66rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.score{padding:7px 12px;border:1px solid #5175af26;border-radius:999px;background:#ffffffdc;box-shadow:0 6px 18px #30518614;font-weight:950}
    .workspace{min-height:0;display:grid;grid-template-columns:minmax(280px,.72fr) minmax(500px,1.28fr);gap:10px;overflow:hidden}.profile-wrap,.questions{min-height:0;border:3px solid #fff;border-radius:18px;background:#ffffffdf;box-shadow:0 16px 40px #284e8b1f}.profile-wrap{padding:10px;display:grid;place-items:center;overflow:hidden}.profile{width:min(340px,100%);overflow:hidden;border:2px solid #cddcf0;border-radius:18px;background:#fff;box-shadow:0 14px 32px #274b841f}.cover{height:72px;background:linear-gradient(135deg,#4f8ceb,#7658df)}.identity{display:flex;align-items:flex-end;gap:12px;padding:0 16px}.avatar{width:88px;height:88px;margin-top:-40px;overflow:hidden;border:4px solid #fff;border-radius:18px;background:#e7eef8;box-shadow:0 7px 18px #233f6b24}.avatar img{width:100%;height:100%;display:block;object-fit:contain}.identity-text{padding-bottom:8px}.identity-text h2{font-size:1.25rem;line-height:1.05}.identity-text p{margin-top:2px;color:var(--muted);font-size:.9rem;font-weight:750}.details{display:grid;gap:8px;padding:12px 16px 16px}.detail{padding:9px 11px;border-radius:12px;background:#f2f6fc}.detail small{display:block;color:#7185a4;font-size:.65rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.detail strong{display:block;margin-top:4px;font-size:.96rem}.subjects{display:flex;gap:7px;margin-top:7px}.subject{padding:6px 9px;border-radius:9px;color:#fff;background:#3976e8;font-size:.82rem;font-weight:900}.subject:last-child{background:#7658df}
    .questions{padding:12px;display:grid;grid-template-rows:auto auto auto auto;gap:8px;overflow:hidden}.questions h2{font-size:1.38rem;line-height:1.08}.question{min-height:0;padding:10px 12px;border:2px solid #d8e3f3;border-radius:14px;background:#fafdff}.question label,.question h3{display:block;margin-bottom:7px;font-size:.96rem;font-weight:900}.answer-line{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px;color:var(--muted);font-weight:850}.answer-line input{height:36px;border:2px solid #c7d7ec;border-radius:10px;padding:0 10px;color:var(--navy);background:#fff;font:inherit;font-weight:900;outline:none}.answer-line input:focus{border-color:var(--blue)}.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.choice input{position:absolute;opacity:0}.choice label{display:grid;place-items:center;min-height:36px;margin:0;border:2px solid #c7d7ec;border-radius:10px;background:#fff;cursor:pointer;font-size:.9rem}.choice input:checked+label{border-color:var(--blue);color:#fff;background:linear-gradient(135deg,var(--blue),var(--purple))}.question.correct{border-color:#55b996;background:#eefaf6}.question.wrong{border-color:#e37682;background:#fff2f3}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.button{min-height:38px;border:0;border-radius:11px;padding:0 16px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 7px 18px #526cd633;font:inherit;font-weight:900;cursor:pointer}.button.send{display:none;background:linear-gradient(135deg,#13805c,#24a878)}.button:disabled{opacity:.55;cursor:not-allowed}.feedback{min-height:20px;font-size:.94rem;font-weight:900}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}
    @media(max-width:860px){html,body{overflow:auto}.app{height:auto;min-height:100dvh;overflow:visible}.workspace{grid-template-columns:1fr;overflow:visible}.profile-wrap,.questions{overflow:visible}.profile{width:min(360px,100%)}}@media(max-width:560px){.app{padding:10px}.profile-wrap,.questions{border-width:3px;border-radius:18px}.choices{grid-template-columns:repeat(2,1fr)}.answer-line{display:block}.answer-line input{width:100%;margin-top:7px}.button{flex:1}.feedback{width:100%;text-align:center}h1{font-size:1.3rem}}

  </style>
</head>
<body>
  <main class="app">
    <header><div class="title"><span class="badge">9</span><div><p class="eyebrow">Profile reading</p><h1>Meet Sally Owens</h1></div></div><span class="score">0 / 3</span></header>
    <section class="workspace">
      <div class="profile-wrap"><article class="profile"><div class="cover"></div><div class="identity"><div class="avatar"><img src="https://storage.yandexcloud.net/kids-app/html-assets/unit1-english-in-use-profile-reading-sally/sally-profile-01-4c64e9caca.webp" alt="Sally Owens"></div><div class="identity-text"><h2>Sally Owens</h2><p>Student profile</p></div></div><div class="details"><div class="detail"><small>Name</small><strong>Sally Owens</strong></div><div class="detail"><small>School</small><strong>Forest Park School</strong></div><div class="detail"><small>Level subjects</small><div class="subjects"><span class="subject">Music</span><span class="subject">Maths</span></div></div></div></article></div>
      <section class="questions"><div><p class="eyebrow">Read and answer</p><h2>Look at Sally’s profile</h2></div>
        <div class="question text-question" data-answer="Sally Owens"><label for="name-answer">What’s her name?</label><div class="answer-line"><span>Her name is</span><input id="name-answer" autocomplete="off" aria-label="Sally's name"></div></div>
        <div class="question text-question" data-answer="Forest Park School"><label for="school-answer">What school is she at?</label><div class="answer-line"><span>She is at</span><input id="school-answer" autocomplete="off" aria-label="Sally's school"></div></div>
        <div class="question subject-question"><h3>What subjects does she choose?</h3><div class="choices"><div class="choice"><input id="science" type="checkbox" value="Science"><label for="science">Science</label></div><div class="choice"><input id="music" type="checkbox" value="Music"><label for="music">Music</label></div><div class="choice"><input id="it" type="checkbox" value="IT"><label for="it">IT</label></div><div class="choice"><input id="maths" type="checkbox" value="Maths"><label for="maths">Maths</label></div></div></div>
        <div class="actions"><button class="button check" type="button">Check</button><button class="button send" type="button">Send to teacher</button><p class="feedback" aria-live="polite"></p></div>
      </section>
    </section>
  </main>
  <script>
    const textQuestions=[...document.querySelectorAll('.text-question')],subjectQuestion=document.querySelector('.subject-question'),checkboxes=[...subjectQuestion.querySelectorAll('input')],scoreLabel=document.querySelector('.score'),feedback=document.querySelector('.feedback'),send=document.querySelector('.send');let result=null;const normalize=value=>value.trim().toLowerCase().replace(/[.!?]/g,'').replace(/\s+/g,' ');
    document.querySelector('.check').addEventListener('click',()=>{if(textQuestions.some(q=>!q.querySelector('input').value.trim())||checkboxes.every(box=>!box.checked)){feedback.textContent='Answer all three questions.';feedback.className='feedback bad';return}let score=0;const answers={};textQuestions.forEach(q=>{const value=q.querySelector('input').value,ok=normalize(value)===normalize(q.dataset.answer);q.classList.toggle('correct',ok);q.classList.toggle('wrong',!ok);answers[q.querySelector('label').textContent]=value;if(ok)score++});const selected=checkboxes.filter(box=>box.checked).map(box=>box.value),subjectsOK=selected.length===2&&selected.includes('Music')&&selected.includes('Maths');subjectQuestion.classList.toggle('correct',subjectsOK);subjectQuestion.classList.toggle('wrong',!subjectsOK);answers.subjects=selected;if(subjectsOK)score++;scoreLabel.textContent=`${score} / 3`;feedback.textContent=score===3?'Excellent! 3/3':`${score}/3 — check the red answers.`;feedback.className=`feedback ${score===3?'good':'bad'}`;result={activityId:'profile-reading-sally',answers,score,maxScore:3,completed:score===3,timestamp:new Date().toISOString()};send.style.display='inline-block'});
    document.querySelectorAll('input').forEach(input=>input.addEventListener('input',()=>{input.closest('.question').classList.remove('correct','wrong');feedback.textContent='';send.style.display='none'}));send.addEventListener('click',()=>{if(!result)return;window.parent.postMessage({type:'UNIPLAY_ACTIVITY_RESULT',payload:result},'*');window.parent.postMessage({type:'lesson-result',...result},'*');try{localStorage.setItem('profile-reading-sally-result',JSON.stringify(result))}catch{}send.textContent='Sent';send.disabled=true;feedback.textContent='Result sent to teacher.';feedback.className='feedback good'});
  </script>
</body>
</html>

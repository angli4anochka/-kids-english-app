<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Capital Letters Practice</title>
  <style>
    :root {
      --ink:#17366f;
      --muted:#6b7da7;
      --blue:#5f7fe8;
      --purple:#8f7de8;
      --line:#dce6fb;
      --ok:#219a70;
      --bad:#d75464;
      --panel:rgba(255,255,255,.96);
      --shadow:0 22px 60px rgba(37,57,110,.17);
    }

    * { box-sizing:border-box; }

    html, body {
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
    }

    body {
      font-family:Inter, "Segoe UI", Arial, sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 8% 8%, rgba(108,145,238,.24), transparent 28%),
        radial-gradient(circle at 92% 10%, rgba(154,132,236,.18), transparent 24%),
        linear-gradient(135deg,#f8fbff 0%,#eef4ff 54%,#f8f5ff 100%);
    }

    button { font:inherit; }

    .app {
      width:100%;
      height:100%;
      min-height:0;
      padding:clamp(10px,1.4vw,18px);
      display:grid;
      grid-template-rows:auto 1fr;
      gap:8px;
    }

    .topbar {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      flex:0 0 auto;
    }

    .title h1 {
      margin:0;
      font-size:clamp(24px,2.5vw,38px);
      line-height:1;
      letter-spacing:0;
    }

    .title p {
      margin:4px 0 0;
      color:var(--muted);
      font-weight:750;
      font-size:clamp(13px,1vw,16px);
    }

    .progress {
      min-width:min(310px,38vw);
      display:flex;
      align-items:center;
      gap:10px;
    }

    .track {
      flex:1;
      height:10px;
      border-radius:999px;
      background:#dfe8fb;
      overflow:hidden;
    }

    .fill {
      width:0;
      height:100%;
      border-radius:inherit;
      background:linear-gradient(90deg,var(--blue),var(--purple));
      transition:width .2s ease;
    }

    .progress-text {
      min-width:68px;
      text-align:right;
      color:var(--muted);
      font-weight:900;
      font-size:14px;
    }

    .workspace {
      min-height:0;
      height:100%;
      overflow:hidden;
      padding:clamp(12px,1.5vw,20px);
      border-radius:22px;
      border:1px solid rgba(255,255,255,.88);
      background:var(--panel);
      box-shadow:var(--shadow);
      display:grid;
      grid-template-rows:1fr auto;
      gap:10px;
    }

    .exercise-grid {
      width:min(1180px,100%);
      margin:0 auto;
      display:grid;
      grid-template-columns:repeat(2,minmax(360px,1fr));
      gap:10px;
      align-content:start;
      min-height:0;
    }

    .sentence-card {
      padding:13px 15px;
      border:2px solid var(--line);
      border-radius:18px;
      background:#fbfdff;
      transition:border-color .15s ease, background .15s ease;
    }

    .sentence-card.correct {
      border-color:#7ed0b1;
      background:#effaf6;
    }

    .sentence-card.wrong {
      border-color:#eca0ab;
      background:#fff3f5;
    }

    .sentence-number {
      display:inline-grid;
      place-items:center;
      width:28px;
      height:28px;
      margin-right:6px;
      border-radius:50%;
      color:white;
      background:linear-gradient(135deg,var(--blue),var(--purple));
      font-size:13px;
      font-weight:950;
    }

    .word-row {
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:6px;
      min-height:42px;
    }

    .word {
      border:2px solid #dce6fb;
      border-radius:12px;
      padding:7px 10px;
      color:#28498f;
      background:white;
      font-size:clamp(14px,1.25vw,16px);
      font-weight:850;
      cursor:pointer;
      transition:transform .12s ease, border-color .12s ease, background .12s ease, color .12s ease;
    }

    .word:hover:not(:disabled) {
      transform:translateY(-1px);
      border-color:#9fb4ec;
      background:#f5f8ff;
    }

    .word.selected {
      color:white;
      border-color:transparent;
      background:linear-gradient(135deg,var(--blue),var(--purple));
      box-shadow:0 8px 16px rgba(73,96,207,.20);
    }

    .word.correct-word {
      color:#15704f;
      border-color:#6fc5a3;
      background:#e8f8f2;
      box-shadow:none;
    }

    .word.wrong-word {
      color:#af3f50;
      border-color:#e695a0;
      background:#fff0f2;
      box-shadow:none;
    }

    .word.missed-word {
      color:#af3f50;
      border-color:#e695a0;
      background:repeating-linear-gradient(-45deg,#fff4f5,#fff4f5 6px,#ffe9ec 6px,#ffe9ec 12px);
    }

    .corrected {
      min-height:22px;
      margin-top:7px;
      color:var(--ok);
      font-size:14px;
      font-weight:900;
    }

    .bottom {
      width:min(1180px,100%);
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }

    .main-feedback {
      min-height:22px;
      font-size:15px;
      font-weight:900;
    }

    .main-feedback.ok { color:var(--ok); }
    .main-feedback.bad { color:var(--bad); }

    .actions {
      display:flex;
      gap:10px;
      flex:0 0 auto;
    }

    .btn {
      border:0;
      border-radius:14px;
      padding:9px 18px;
      font-size:15px;
      font-weight:950;
      cursor:pointer;
    }

    .btn.primary {
      color:white;
      background:linear-gradient(135deg,var(--blue),var(--purple));
      box-shadow:0 11px 23px rgba(73,96,207,.24);
    }

    .btn.secondary {
      color:var(--ink);
      background:#edf3ff;
    }

    @media (max-width:900px) {
      .exercise-grid { grid-template-columns:1fr; }
    }

    @media (max-height:700px) {
      .app { padding:9px 12px; gap:7px; }
      .workspace { padding:10px 14px; gap:8px; }
      .exercise-grid { gap:9px; }
      .sentence-card { padding:10px 12px; }
      .word-row { min-height:36px; gap:5px; }
      .word { padding:5px 8px; font-size:14px; }
      .corrected { min-height:17px; margin-top:5px; font-size:12px; }
      .btn { padding:8px 15px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title">
        <h1>Correct the capital letters</h1>
        <p>Click only the words that need a capital letter.</p>
      </div>

      <div class="progress" aria-label="Progress">
        <div class="track"><div class="fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">0 of 4</div>
      </div>
    </header>

    <section class="workspace">
      <div class="exercise-grid" id="exerciseGrid"></div>

      <div class="bottom">
        <div class="main-feedback" id="mainFeedback" aria-live="polite"></div>

        <div class="actions">
          <button class="btn secondary" id="resetButton" type="button">Reset</button>
          <button class="btn primary" id="checkButton" type="button">Check</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const sentences = [
      {
        words: ["Sarah", "is", "15.", "she's", "in", "my", "geography", "class."],
        correctIndexes: [3],
        corrected: "Sarah is 15. She's in my geography class."
      },
      {
        words: ["Their", "names", "are", "Claire", "and", "Steve", "lennon."],
        correctIndexes: [6],
        corrected: "Their names are Claire and Steve Lennon."
      },
      {
        words: ["She's", "Nora", "and", "i'm", "Phil.", "We", "are", "from", "england."],
        correctIndexes: [3, 8],
        corrected: "She's Nora and I'm Phil. We are from England."
      },
      {
        words: ["The", "art", "class", "is", "in", "Room", "D", "on", "tuesdays", "and", "thursdays."],
        correctIndexes: [8, 10],
        corrected: "The art class is in Room D on Tuesdays and Thursdays."
      }
    ];

    const exerciseGrid = document.getElementById("exerciseGrid");
    const mainFeedback = document.getElementById("mainFeedback");
    const progressFill = document.getElementById("progressFill");
    const progressText = document.getElementById("progressText");

    function post(type, detail = {}) {
      const message = { type, lessonId: "capital-letters-from-book", ...detail };
      window.parent.postMessage(message, "*");
      window.dispatchEvent(new CustomEvent(type, { detail: message }));
    }

    function capitaliseToken(token) {
      if (token.toLowerCase() === "i'm") return "I'm";
      return token.charAt(0).toUpperCase() + token.slice(1);
    }

    function render() {
      exerciseGrid.innerHTML = "";

      sentences.forEach((sentence, sentenceIndex) => {
        const card = document.createElement("article");
        card.className = "sentence-card";
        card.dataset.index = sentenceIndex;

        const row = document.createElement("div");
        row.className = "word-row";

        const number = document.createElement("span");
        number.className = "sentence-number";
        number.textContent = sentenceIndex + 1;
        row.appendChild(number);

        sentence.words.forEach((word, wordIndex) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "word";
          button.dataset.wordIndex = wordIndex;
          button.dataset.original = word;
          button.textContent = word;

          button.addEventListener("click", () => {
            button.classList.toggle("selected");
            button.textContent = button.classList.contains("selected")
              ? capitaliseToken(word)
              : word;

            card.classList.remove("correct", "wrong");
            button.classList.remove("correct-word", "wrong-word", "missed-word");
            card.querySelector(".corrected").textContent = "";
            mainFeedback.textContent = "";
          });

          row.appendChild(button);
        });

        const corrected = document.createElement("div");
        corrected.className = "corrected";

        card.appendChild(row);
        card.appendChild(corrected);
        exerciseGrid.appendChild(card);
      });

      updateProgress();
    }

    function updateProgress() {
      const completed = [...document.querySelectorAll(".sentence-card.correct")].length;
      progressText.textContent = `${completed} of 4`;
      progressFill.style.width = `${(completed / 4) * 100}%`;
    }

    document.getElementById("checkButton").addEventListener("click", () => {
      let correctCount = 0;

      [...document.querySelectorAll(".sentence-card")].forEach(card => {
        const sentenceIndex = Number(card.dataset.index);
        const sentence = sentences[sentenceIndex];
        const buttons = [...card.querySelectorAll(".word")];
        const selectedIndexes = buttons
          .filter(button => button.classList.contains("selected"))
          .map(button => Number(button.dataset.wordIndex));

        const exact =
          selectedIndexes.length === sentence.correctIndexes.length &&
          selectedIndexes.every(index => sentence.correctIndexes.includes(index));

        card.classList.remove("correct", "wrong");

        buttons.forEach(button => {
          button.classList.remove("correct-word", "wrong-word", "missed-word");

          const index = Number(button.dataset.wordIndex);
          const selected = button.classList.contains("selected");
          const shouldBeSelected = sentence.correctIndexes.includes(index);

          if (selected && shouldBeSelected) {
            button.classList.add("correct-word");
          } else if (selected && !shouldBeSelected) {
            button.classList.add("wrong-word");
          } else if (!selected && shouldBeSelected) {
            button.classList.add("missed-word");
          }
        });

        if (exact) {
          correctCount += 1;
          card.classList.add("correct");
          card.querySelector(".corrected").textContent = `✓ ${sentence.corrected}`;
        } else {
          card.classList.add("wrong");
          card.querySelector(".corrected").textContent = "";
        }
      });

      updateProgress();

      if (correctCount === 4) {
        mainFeedback.textContent = "Excellent! All four sentences are correct.";
        mainFeedback.className = "main-feedback ok";
        post("lesson:capital-letters-complete", { score: 4, total: 4 });
      } else {
        mainFeedback.textContent = `${correctCount} of 4 correct. Check the red or striped words.`;
        mainFeedback.className = "main-feedback bad";
        post("lesson:capital-letters-checked", { score: correctCount, total: 4 });
      }
    });

    document.getElementById("resetButton").addEventListener("click", () => {
      mainFeedback.textContent = "";
      mainFeedback.className = "main-feedback";
      render();
      post("lesson:capital-letters-reset");
    });

    render();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monday Timetable + Days</title>
  <style>
    :root{
      --ink:#1e3d64;
      --soft:#5f7898;
      --paper:rgba(255,255,255,.9);
      --shadow:0 16px 38px rgba(31,70,118,.18);
    }

    *{box-sizing:border-box}

    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 10% 10%, rgba(255,255,255,.9), transparent 18%),
        radial-gradient(circle at 88% 12%, rgba(255,255,255,.62), transparent 18%),
        linear-gradient(135deg,#eaf7ff 0%,#fff2c9 100%);
      user-select:none;
    }

    .app{
      width:100vw;
      height:100vh;
      padding:clamp(8px,1vw,16px);
      display:grid;
      grid-template-rows:1fr;
      gap:0;
      place-items:center;
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }

    .title-wrap{
      display:flex;
      flex-direction:column;
      gap:5px;
      min-width:0;
    }

    .badge{
      width:max-content;
      padding:6px 11px;
      border-radius:999px;
      background:rgba(255,255,255,.72);
      box-shadow:0 7px 18px rgba(0,0,0,.08);
      font-weight:950;
      color:#2b4e78;
      font-size:clamp(12px,1.1vw,16px);
    }

    h1{
      margin:0;
      font-size:clamp(24px,2.7vw,40px);
      line-height:.95;
      color:#2f73d8;
      text-shadow:0 3px 0 rgba(255,255,255,.95);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .screen-counter{
      padding:8px 13px;
      border-radius:999px;
      background:rgba(255,255,255,.78);
      box-shadow:0 7px 18px rgba(0,0,0,.08);
      font-weight:950;
      font-size:clamp(13px,1.2vw,18px);
      white-space:nowrap;
    }

    .stage{
      min-height:0;
      height:100%;
      position:relative;
      width:min(1180px,100%);
      justify-self:center;
    }

    .screen{
      position:absolute;
      inset:0;
      display:none;
      grid-template-rows:1fr auto;
      gap:clamp(6px,.7vw,10px);
      border-radius:30px;
      background:var(--paper);
      border:5px solid rgba(255,255,255,.82);
      box-shadow:var(--shadow);
      padding:clamp(10px,1vw,16px);
      overflow:hidden;
    }

    .screen.active{
      display:grid;
      animation:pop .22s ease;
    }

    @keyframes pop{
      from{opacity:.25; transform:translateY(10px) scale(.99)}
      to{opacity:1; transform:translateY(0) scale(1)}
    }

    .screen-head{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      min-height:0;
    }

    .screen-head.compact-head{
      min-height:0;
      margin-bottom:-2px;
    }

    .screen-head h2{
      margin:0;
      font-size:clamp(24px,3vw,46px);
      color:#244d80;
    }

    .pill{
      padding:8px 13px;
      border-radius:999px;
      background:#fff6d1;
      color:#6d5527;
      font-weight:950;
      box-shadow:inset 0 -3px rgba(0,0,0,.04);
      font-size:clamp(12px,1.05vw,16px);
    }

    .content{
      min-height:0;
      display:grid;
      gap:clamp(10px,1.1vw,18px);
      align-content:start;
    }

    .question-box{
      min-height:clamp(42px,4vw,56px);
      display:grid;
      place-items:center;
      text-align:center;
      padding:9px 15px;
      border-radius:22px;
      background:linear-gradient(135deg,#fff6d6,#fff);
      border:3px solid rgba(255,255,255,.92);
      box-shadow:0 8px 18px rgba(0,0,0,.08);
      font-size:clamp(17px,1.85vw,28px);
      font-weight:950;
      color:#244a78;
    }

    .timetable{
      width:min(960px,100%);
      justify-self:center;
      display:grid;
      grid-template-columns:minmax(72px,.36fr) 1fr minmax(72px,.36fr) 1fr;
      gap:7px;
      align-content:start;
    }

    .time-cell,
    .lesson-cell{
      min-height:clamp(34px,3.55vw,46px);
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      font-weight:950;
      border:3px solid rgba(255,255,255,.92);
      box-shadow:0 8px 16px rgba(0,0,0,.08), inset 0 -4px rgba(0,0,0,.04);
      cursor:pointer;
      transition:transform .12s ease, filter .12s ease, box-shadow .12s ease;
    }

    .time-cell{
      background:#eaf3ff;
      color:#2b5b98;
      font-size:clamp(13px,1.15vw,18px);
    }

    .lesson-cell{
      color:#1d3e66;
      font-size:clamp(14px,1.45vw,22px);
    }

    .time-cell:hover,
    .lesson-cell:hover{
      transform:translateY(-2px);
      filter:brightness(1.04);
      box-shadow:0 12px 22px rgba(0,0,0,.12), inset 0 -4px rgba(0,0,0,.04);
    }

    .lesson-cell.break{
      color:#6b5529;
    }

    .time-cell.found,
    .lesson-cell.found{
      outline:5px solid rgba(73,197,103,.32);
      box-shadow:0 0 0 6px rgba(73,197,103,.16),0 12px 24px rgba(0,0,0,.1);
    }

    .time-cell.wrong,
    .lesson-cell.wrong,
    .mini-btn.wrong,
    .day-chip.wrong{
      animation:shake .34s ease;
      outline:4px solid rgba(236,85,98,.28);
    }

    @keyframes shake{
      0%,100%{transform:translateX(0)}
      25%{transform:translateX(-7px)}
      55%{transform:translateX(7px)}
      80%{transform:translateX(-4px)}
    }

    .answer-card{
      width:min(760px,100%);
      justify-self:center;
      display:grid;
      gap:7px;
      padding:7px;
      border-radius:22px;
      background:rgba(235,246,255,.82);
      border:3px solid rgba(255,255,255,.78);
    }

    .answer-title{
      text-align:center;
      font-size:clamp(16px,1.6vw,24px);
      font-weight:950;
      color:#254d80;
    }

    .student-answer{
      width:100%;
      min-height:58px;
      resize:none;
      padding:10px 14px;
      border:3px solid rgba(255,255,255,.92);
      border-radius:18px;
      background:#fff;
      color:#244a78;
      font-family:inherit;
      font-size:clamp(15px,1.35vw,21px);
      font-weight:900;
      outline:none;
      box-shadow:inset 0 -4px rgba(0,0,0,.035);
    }

    .student-answer:focus{
      border-color:#7db7ff;
      box-shadow:0 0 0 5px rgba(125,183,255,.22), inset 0 -4px rgba(0,0,0,.035);
    }

    .send-row{
      display:grid;
      grid-template-columns:minmax(110px,.4fr) auto;
      gap:8px;
      align-items:center;
    }

    .student-name{
      min-height:38px;
      border:3px solid rgba(255,255,255,.92);
      border-radius:999px;
      padding:8px 13px;
      background:#fff;
      color:#244a78;
      font-family:inherit;
      font-size:clamp(13px,1.05vw,17px);
      font-weight:900;
      outline:none;
    }

    .send-btn{
      min-height:38px;
      border:0;
      border-radius:999px;
      padding:8px 15px;
      background:linear-gradient(135deg,#65d782,#35b65b);
      color:#fff;
      font-family:inherit;
      font-size:clamp(13px,1.05vw,17px);
      font-weight:950;
      cursor:pointer;
      box-shadow:0 8px 16px rgba(0,0,0,.13), inset 0 -4px rgba(0,0,0,.12);
    }

    .send-btn:active{
      transform:translateY(1px);
    }

    .send-status{
      min-height:18px;
      text-align:center;
      color:#2c9b55;
      font-size:clamp(12px,1vw,15px);
      font-weight:950;
    }

    .days-content{
      display:grid;
      grid-template-rows:1fr auto;
      gap:clamp(8px,.9vw,12px);
      min-height:0;
      height:100%;
    }

    .subcard.day-step{
      display:none;
      min-height:0;
      overflow:auto;
      scrollbar-width: thin;
    }

    .subcard.day-step.active{
      display:grid;
    }

    .day-task-nav{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      font-weight:950;
      color:#244a78;
      font-size:clamp(13px,1.05vw,17px);
      padding-top:2px;
    }

    .day-task-btn{
      border:0;
      border-radius:999px;
      padding:8px 14px;
      background:linear-gradient(135deg,#7db7ff,#4d8bec);
      color:#fff;
      font-family:inherit;
      font-weight:950;
      font-size:clamp(13px,1.05vw,17px);
      cursor:pointer;
      box-shadow:0 8px 16px rgba(0,0,0,.13), inset 0 -4px rgba(0,0,0,.12);
    }

    .day-task-btn:disabled{
      opacity:.35;
      cursor:default;
    }

    .subcard{
      border-radius:24px;
      background:rgba(255,255,255,.58);
      border:3px solid rgba(255,255,255,.78);
      padding:clamp(10px,1vw,15px);
      display:grid;
      gap:10px;
      align-content:start;
    }

    .subcard h3{
      margin:0;
      font-size:clamp(18px,1.65vw,25px);
      color:#254d80;
    }

    .letters-two-tasks{
      display:grid;
      grid-template-columns:1.15fr .85fr;
      gap:12px;
      min-height:0;
    }

    .mini-task{
      display:grid;
      gap:8px;
      align-content:start;
      min-height:0;
    }

    .write-task{
      background:rgba(255,255,255,.58);
      border-radius:20px;
      padding:10px;
      border:3px solid rgba(255,255,255,.72);
    }

    .missing-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:8px;
    }

    .missing-card{
      min-height:44px;
      display:grid;
      grid-template-columns:1fr auto;
      gap:8px;
      align-items:center;
      padding:7px 9px;
      border-radius:17px;
      background:#fff;
      box-shadow:0 7px 14px rgba(0,0,0,.07);
    }

    .missing-word{
      font-size:clamp(14px,1.15vw,18px);
      font-weight:950;
      letter-spacing:.03em;
      color:#244a78;
    }

    .letter-options{
      display:flex;
      gap:4px;
    }

    .mini-btn{
      width:27px;
      height:27px;
      border:0;
      border-radius:10px;
      background:#ffe48a;
      color:#244a78;
      font-weight:950;
      cursor:pointer;
      box-shadow:inset 0 -3px rgba(0,0,0,.08);
      padding:0;
      font-size:15px;
    }

    .missing-card.done{
      background:#e9ffe9;
      outline:3px solid rgba(87,203,103,.28);
    }

    .write-days{
      display:grid;
      gap:6px;
    }

    .write-row{
      min-height:32px;
      display:grid;
      grid-template-columns:auto 1fr;
      align-items:center;
      gap:5px;
      padding:5px 8px;
      border-radius:13px;
      background:#fff;
      color:#244a78;
      font-size:clamp(13px,1.05vw,17px);
      font-weight:950;
      box-shadow:0 5px 10px rgba(0,0,0,.06);
    }

    .write-row.fixed-day{
      display:flex;
      background:#eef8ff;
      color:#31577f;
    }

    .write-row span{
      min-width:18px;
    }

    .write-row input{
      width:100%;
      min-width:0;
      border:0;
      border-bottom:3px dotted #9fc3f1;
      background:transparent;
      color:#244a78;
      font-family:inherit;
      font-size:clamp(13px,1.05vw,17px);
      font-weight:950;
      outline:none;
      padding:2px 4px;
    }

    .write-row input:focus{
      border-bottom-color:#4d8bec;
    }

    .order-slots,
    .day-bank,
    .favourite-days{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      justify-content:center;
    }

    .week-sentences{
      margin-top:4px;
      display:grid;
      gap:6px;
      padding:10px;
      border-radius:20px;
      background:rgba(255,255,255,.58);
      border:3px solid rgba(255,255,255,.72);
    }

    .week-sentences h3{
      margin:0 0 2px;
      font-size:clamp(16px,1.35vw,22px);
    }

    .week-row,
    .fav-line{
      min-height:32px;
      display:grid;
      grid-template-columns:auto 1fr;
      align-items:center;
      gap:7px;
      padding:5px 8px;
      border-radius:13px;
      background:#fff;
      color:#244a78;
      font-size:clamp(13px,1.05vw,17px);
      font-weight:950;
      box-shadow:0 5px 10px rgba(0,0,0,.06);
    }

    .week-row input,
    .fav-line input{
      width:100%;
      min-width:0;
      border:0;
      border-bottom:3px dotted #9fc3f1;
      background:transparent;
      color:#244a78;
      font-family:inherit;
      font-size:clamp(13px,1.05vw,17px);
      font-weight:950;
      outline:none;
      padding:2px 4px;
    }

    .week-row input:focus,
    .fav-line input:focus{
      border-bottom-color:#4d8bec;
    }

    .fav-writing{
      width:min(760px,100%);
      justify-self:center;
      display:grid;
      gap:7px;
      padding:10px;
      border-radius:20px;
      background:rgba(255,255,255,.58);
      border:3px solid rgba(255,255,255,.72);
    }

    .order-slot{
      min-width:106px;
      min-height:40px;
      display:grid;
      place-items:center;
      padding:7px 10px;
      border-radius:15px;
      background:#eef6ff;
      border:3px dashed #9fc3f1;
      font-weight:950;
      color:#7b94b4;
    }

    .order-slot.filled{
      background:#fff;
      border-style:solid;
      border-color:#6baaf1;
      color:#244a78;
    }

    .day-chip,
    .fav-btn{
      min-width:106px;
      min-height:40px;
      padding:8px 12px;
      border:0;
      border-radius:15px;
      background:linear-gradient(135deg,#fff8ce,#ffd86d);
      color:#244a78;
      font-weight:950;
      font-size:15px;
      cursor:pointer;
      box-shadow:0 7px 14px rgba(0,0,0,.1), inset 0 -4px rgba(0,0,0,.06);
    }

    .day-chip.used{
      opacity:.28;
      pointer-events:none;
    }

    .fav-btn{
      min-width:96px;
      border-radius:999px;
      background:#eaf3ff;
      box-shadow:inset 0 -3px rgba(0,0,0,.05);
    }

    .fav-btn.selected{
      background:linear-gradient(135deg,#ff9ac2,#ffd86d);
      color:#fff;
      box-shadow:0 8px 18px rgba(0,0,0,.14), inset 0 -3px rgba(0,0,0,.08);
    }

    .fav-sentence{
      min-height:36px;
      display:grid;
      place-items:center;
      text-align:center;
      font-size:clamp(16px,1.5vw,23px);
      font-weight:950;
      color:#254d80;
    }

    .nav{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
    }

    .nav-btn{
      border:0;
      border-radius:999px;
      min-width:118px;
      padding:9px 17px;
      background:linear-gradient(135deg,#7db7ff,#4d8bec);
      color:white;
      font-weight:950;
      font-size:clamp(14px,1.2vw,18px);
      cursor:pointer;
      box-shadow:0 9px 18px rgba(0,0,0,.14), inset 0 -4px rgba(0,0,0,.12);
    }

    .nav-btn:disabled{
      opacity:.35;
      cursor:default;
    }

    .page-nav{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      padding-top:2px;
    }

    .page-nav-btn{
      border:0;
      border-radius:999px;
      min-width:118px;
      padding:9px 17px;
      background:linear-gradient(135deg,#7db7ff,#4d8bec);
      color:#fff;
      font-family:inherit;
      font-weight:950;
      font-size:clamp(14px,1.2vw,18px);
      cursor:pointer;
      box-shadow:0 9px 18px rgba(0,0,0,.14), inset 0 -4px rgba(0,0,0,.12);
    }

    .toast{
      position:fixed;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%) scale(.85);
      padding:18px 26px;
      border-radius:28px;
      background:rgba(255,255,255,.96);
      border:4px solid white;
      box-shadow:0 22px 60px rgba(0,0,0,.22);
      color:#2c9b55;
      font-size:clamp(28px,4vw,60px);
      font-weight:950;
      opacity:0;
      pointer-events:none;
      z-index:50;
      transition:opacity .2s ease, transform .2s ease;
      text-align:center;
    }

    .toast.show{
      opacity:1;
      transform:translate(-50%,-50%) scale(1);
    }

    @media (max-width:1000px){
      .missing-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }

    @media (max-width:620px){
      header{
        display:grid;
        grid-template-columns:1fr auto;
      }

      h1{
        white-space:normal;
      }

      .screen{
        border-radius:24px;
        padding:12px;
      }

      .timetable{
        grid-template-columns:68px 1fr;
      }

      .letters-two-tasks{
        grid-template-columns:1fr;
      }

      .missing-grid{
        grid-template-columns:1fr;
      }

      .order-slot,.day-chip,.fav-btn{
        min-width:92px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="stage">
      <section class="screen active" id="screenTimetable">
        <div class="content">
          <div class="question-box" id="timetableQuestion">What time does Maths start?</div>

          <div class="timetable" id="timetable">
            <div class="time-cell" data-type="time" data-subject="Maths" data-time="09:00">09:00</div>
            <button class="lesson-cell" data-type="subject" style="background:#bfe7ff;" data-subject="Maths" data-time="09:00">Maths</button>

            <div class="time-cell" data-type="time" data-subject="IT" data-time="09:50">09:50</div>
            <button class="lesson-cell" data-type="subject" style="background:#d8d0ff;" data-subject="IT" data-time="09:50">IT</button>

            <div class="time-cell" data-type="time" data-subject="break" data-time="10:40">10:40</div>
            <button class="lesson-cell break" data-type="subject" style="background:#fff0b8;" data-subject="break" data-time="10:40">break</button>

            <div class="time-cell" data-type="time" data-subject="English" data-time="11:00">11:00</div>
            <button class="lesson-cell" data-type="subject" style="background:#ffe0bd;" data-subject="English" data-time="11:00">English</button>

            <div class="time-cell" data-type="time" data-subject="PE" data-time="11:50">11:50</div>
            <button class="lesson-cell" data-type="subject" style="background:#c9f2cb;" data-subject="PE" data-time="11:50">PE</button>

            <div class="time-cell" data-type="time" data-subject="lunch break" data-time="12:40">12:40</div>
            <button class="lesson-cell break" data-type="subject" style="background:#ffefba;" data-subject="lunch break" data-time="12:40">lunch break</button>

            <div class="time-cell" data-type="time" data-subject="Science" data-time="13:20">13:20</div>
            <button class="lesson-cell" data-type="subject" style="background:#d0f7ef;" data-subject="Science" data-time="13:20">Science</button>

            <div class="time-cell" data-type="time" data-subject="History" data-time="14:10">14:10</div>
            <button class="lesson-cell" data-type="subject" style="background:#ffe6a9;" data-subject="History" data-time="14:10">History</button>
          </div>

          <div class="answer-card">
            <label class="answer-title" for="studentAnswer">What lessons have you got on Monday?</label>
            <textarea id="studentAnswer" class="student-answer" placeholder="I’ve got ..."></textarea>
            <div class="send-row">
              <input id="studentName" class="student-name" type="text" placeholder="Name" />
              <button id="sendTeacherBtn" class="send-btn" type="button">Send to teacher</button>
            </div>
            <div class="send-status" id="sendStatus"></div>
          </div>
        </div>

        <div class="page-nav">
          <button class="page-nav-btn" id="toDaysBtn" type="button">Next</button>
        </div>
      </section>

      <section class="screen" id="screenDays">
        <div class="days-content">
          <div class="subcard day-step active" data-day-panel="0">
            <div class="letters-two-tasks">
              <div class="mini-task">
                <h3>1. Complete missing letters</h3>
                <div class="missing-grid" id="missingGrid"></div>
              </div>

              <div class="mini-task write-task">
                <h3>2. Write the missing days</h3>
                <div class="write-days" id="writeDays">
                  <div class="write-row fixed-day">Sunday</div>
                  <label class="write-row"><span>M</span><input data-day-write="Monday" type="text" autocomplete="off" /></label>
                  <div class="write-row fixed-day">Tuesday</div>
                  <label class="write-row"><span>W</span><input data-day-write="Wednesday" type="text" autocomplete="off" /></label>
                  <label class="write-row"><span>T</span><input data-day-write="Thursday" type="text" autocomplete="off" /></label>
                  <label class="write-row"><span>F</span><input data-day-write="Friday" type="text" autocomplete="off" /></label>
                  <div class="write-row fixed-day">Saturday</div>
                </div>
              </div>
            </div>
          </div>

          <div class="subcard day-step" data-day-panel="1">
            <h3>Put the days in order</h3>
            <div class="order-slots" id="orderSlots"></div>
            <div class="day-bank" id="dayBank"></div>

            <div class="week-sentences">
              <h3>Write about your week</h3>
              <label class="week-row">On Sundays I <input data-week-write="Sunday" type="text" autocomplete="off" placeholder="..." /></label>
              <label class="week-row">On Mondays I <input data-week-write="Monday" type="text" autocomplete="off" placeholder="..." /></label>
              <label class="week-row">On Tuesdays I <input data-week-write="Tuesday" type="text" autocomplete="off" placeholder="..." /></label>
              <label class="week-row">On Wednesdays I <input data-week-write="Wednesday" type="text" autocomplete="off" placeholder="..." /></label>
              <label class="week-row">On Thursdays I <input data-week-write="Thursday" type="text" autocomplete="off" placeholder="..." /></label>
              <label class="week-row">On Fridays I <input data-week-write="Friday" type="text" autocomplete="off" placeholder="..." /></label>
              <label class="week-row">On Saturdays I <input data-week-write="Saturday" type="text" autocomplete="off" placeholder="..." /></label>
            </div>
          </div>

          <div class="subcard day-step" data-day-panel="2">
            <h3>Say your favourite day</h3>
            <div class="favourite-days" id="favouriteDays"></div>

            <div class="fav-writing">
              <label class="fav-line">My favourite day is <input id="favDayInput" type="text" placeholder="..." autocomplete="off" /></label>
              <label class="fav-line">because <input id="favBecauseInput" type="text" placeholder="..." autocomplete="off" /></label>
              <label class="fav-line">I like <input id="favLikeInput" type="text" placeholder="..." autocomplete="off" /></label>
              <label class="fav-line">I don’t like <input id="favDontLikeInput" type="text" placeholder="..." autocomplete="off" /></label>
            </div>

            <div class="fav-sentence" id="favSentence">My favourite day is … because …</div>
          </div>

          <div class="day-task-nav">
            <button class="day-task-btn" id="dayTaskBack" type="button">Back</button>
            <span id="dayTaskCounter">Task 1 / 3</span>
            <button class="day-task-btn" id="dayTaskNext" type="button">Next</button>
          </div>
        </div>

      </section>
    </section>

    <div class="toast" id="toast">Good!</div>
  </main>

  <script>
    const screens = [
      {
        el: document.getElementById("screenTimetable"),
        title: "Monday Timetable"
      },
      {
        el: document.getElementById("screenDays"),
        title: "Days of the Week"
      }
    ];

    const toDaysBtn = document.getElementById("toDaysBtn");
    const toast = document.getElementById("toast");
    let activeScreen = 0;

    function showScreen(index){
      activeScreen = Math.max(0, Math.min(index, screens.length - 1));

      screens.forEach((screen, i) => {
        screen.el.classList.toggle("active", i === activeScreen);
      });

      // screen title/counter removed to keep only the inner window
    }

    toDaysBtn.addEventListener("click", () => showScreen(1));

    function showToast(text){
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 800);
    }

    showScreen(0);

    const timetableTasks = [
      { text: "What time does Maths start?", type: "time", time: "09:00" },
      { text: "What time does IT start?", type: "time", time: "09:50" },
      { text: "What time does English start?", type: "time", time: "11:00" },
      { text: "What time does PE start?", type: "time", time: "11:50" },
      { text: "What time does Science start?", type: "time", time: "13:20" },
      { text: "What time does History start?", type: "time", time: "14:10" },
      { text: "At 09:50, what subject is it?", type: "subject", subject: "IT" },
      { text: "At 11:00, what subject is it?", type: "subject", subject: "English" },
      { text: "At 10:40, what is it?", type: "subject", subject: "break" },
      { text: "At 12:40, what is it?", type: "subject", subject: "lunch break" }
    ];

    const timetableQuestion = document.getElementById("timetableQuestion");
    const timetableCells = Array.from(document.querySelectorAll(".time-cell, .lesson-cell"));
    const studentAnswer = document.getElementById("studentAnswer");
    const studentName = document.getElementById("studentName");
    const sendTeacherBtn = document.getElementById("sendTeacherBtn");
    const sendStatus = document.getElementById("sendStatus");
    let timetableIndex = 0;

    function setTimetableQuestion(){
      if (timetableIndex >= timetableTasks.length){
        timetableQuestion.textContent = "Great! Now write your answer below.";
        return;
        return;
      }

      timetableQuestion.textContent = timetableTasks[timetableIndex].text;
    }

    timetableCells.forEach(cell => {
      cell.addEventListener("click", () => {
        if (timetableIndex >= timetableTasks.length) return;

        const task = timetableTasks[timetableIndex];

        const ok =
          cell.dataset.type === task.type &&
          ((task.subject && cell.dataset.subject === task.subject) ||
          (task.time && cell.dataset.time === task.time));

        if (ok){
          cell.classList.add("found");
          timetableIndex++;
          showToast("Good!");
          setTimetableQuestion();
        } else {
          cell.classList.remove("wrong");
          void cell.offsetWidth;
          cell.classList.add("wrong");
        }
      });
    });

    function getDaysResult(){
      const completedLetters = Array.from(document.querySelectorAll(".missing-card.done .missing-word"))
        .map(item => item.textContent);

      const orderedDays = Array.from(document.querySelectorAll(".order-slot.filled"))
        .map(item => item.textContent);

      const favourite = document.querySelector(".fav-btn.selected")?.textContent || "";
      const writtenDays = Array.from(document.querySelectorAll("[data-day-write]")).map(input => ({
        target: input.dataset.dayWrite,
        answer: input.value.trim()
      }));

      const weekSentences = Array.from(document.querySelectorAll("[data-week-write]")).map(input => ({
        day: input.dataset.weekWrite,
        sentence: `On ${input.dataset.weekWrite}s I ${input.value.trim()}`
      }));

      const favouriteWriting = {
        selectedDay: favourite,
        day: favDayInput.value.trim(),
        because: favBecauseInput.value.trim(),
        like: favLikeInput.value.trim(),
        dontLike: favDontLikeInput.value.trim(),
        sentence: `My favourite day is ${favDayInput.value.trim()} because ${favBecauseInput.value.trim()}. I like ${favLikeInput.value.trim()}. I don’t like ${favDontLikeInput.value.trim()}.`
      };

      return {
        completedLetters,
        writtenDays,
        orderedDays,
        weekSentences,
        favouriteDay: favourite,
        favouriteWriting
      };
    }

    function sendResultsToTeacher(){
      const answer = studentAnswer.value.trim();

      if (!answer){
        studentAnswer.focus();
        showToast("Write first!");
        sendStatus.textContent = "Write your answer first.";
        return;
      }

      const daysResult = getDaysResult();
      const score =
        Math.min(timetableIndex, timetableTasks.length) +
        daysResult.completedLetters.length +
        daysResult.orderedDays.length;
      const total = timetableTasks.length + missingData.length + days.length;

      const result = {
        type: "monday-timetable-days-done",
        lesson: "Monday Timetable + Days of the Week",
        studentName: studentName.value.trim(),
        mondayAnswer: answer,
        timetableProgress: `${Math.min(timetableIndex, timetableTasks.length)} / ${timetableTasks.length}`,
        score,
        total,
        results: {
          mondayAnswer: answer,
          timetableProgress: `${Math.min(timetableIndex, timetableTasks.length)} / ${timetableTasks.length}`,
          days: daysResult
        },
        sentAt: new Date().toISOString()
      };

      window.parent.postMessage(result, "*");
      window.postMessage(result, "*");

      localStorage.setItem("mondayTimetableLastResult", JSON.stringify(result));

      sendStatus.textContent = "Sent to teacher!";
      showToast("Sent!");
    }

    sendTeacherBtn.addEventListener("click", sendResultsToTeacher);

    const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const missingData = [
      { word:"Sunday", masked:"S_nday", answer:"u", options:["u","a","e"] },
      { word:"Monday", masked:"M_nday", answer:"o", options:["o","u","i"] },
      { word:"Tuesday", masked:"T_esday", answer:"u", options:["u","o","a"] },
      { word:"Wednesday", masked:"W_dnesday", answer:"e", options:["e","a","i"] },
      { word:"Thursday", masked:"Th_rsday", answer:"u", options:["u","e","o"] },
      { word:"Friday", masked:"Fr_day", answer:"i", options:["i","e","a"] },
      { word:"Saturday", masked:"Sat_rday", answer:"u", options:["u","o","i"] }
    ];

    const missingGrid = document.getElementById("missingGrid");
    const orderSlots = document.getElementById("orderSlots");
    const dayBank = document.getElementById("dayBank");
    const favouriteDays = document.getElementById("favouriteDays");
    const favSentence = document.getElementById("favSentence");
    const favDayInput = document.getElementById("favDayInput");
    const favBecauseInput = document.getElementById("favBecauseInput");
    const favLikeInput = document.getElementById("favLikeInput");
    const favDontLikeInput = document.getElementById("favDontLikeInput");

    const dayPanels = Array.from(document.querySelectorAll(".day-step"));
    const dayTaskBack = document.getElementById("dayTaskBack");
    const dayTaskNext = document.getElementById("dayTaskNext");
    const dayTaskCounter = document.getElementById("dayTaskCounter");
    let activeDayStep = 0;

    function showDayStep(index){
      activeDayStep = Math.max(0, Math.min(index, dayPanels.length - 1));

      dayPanels.forEach((panel, i) => {
        panel.classList.toggle("active", i === activeDayStep);
      });

      dayTaskCounter.textContent = `Task ${activeDayStep + 1} / ${dayPanels.length}`;
      dayTaskBack.disabled = false;
      dayTaskNext.disabled = activeDayStep === dayPanels.length - 1;
    }

    dayTaskBack.addEventListener("click", () => {
      if (activeDayStep === 0) {
        showScreen(0);
      } else {
        showDayStep(activeDayStep - 1);
      }
    });

    dayTaskNext.addEventListener("click", () => showDayStep(activeDayStep + 1));

    showDayStep(0);

    function renderMissing(){
      missingGrid.innerHTML = "";

      missingData.forEach(item => {
        const card = document.createElement("div");
        card.className = "missing-card";

        const word = document.createElement("div");
        word.className = "missing-word";
        word.textContent = item.masked;

        const options = document.createElement("div");
        options.className = "letter-options";

        item.options.forEach(letter => {
          const btn = document.createElement("button");
          btn.className = "mini-btn";
          btn.type = "button";
          btn.textContent = letter;

          btn.addEventListener("click", () => {
            if (card.classList.contains("done")) return;

            if (letter === item.answer){
              card.classList.add("done");
              word.textContent = item.word;
              showToast("Correct!");
            } else {
              btn.classList.remove("wrong");
              void btn.offsetWidth;
              btn.classList.add("wrong");
            }
          });

          options.appendChild(btn);
        });

        card.appendChild(word);
        card.appendChild(options);
        missingGrid.appendChild(card);
      });
    }

    function shuffle(array){
      return [...array].sort(() => Math.random() - 0.5);
    }

    let orderIndex = 0;

    function renderOrder(){
      orderSlots.innerHTML = "";
      dayBank.innerHTML = "";

      days.forEach((_, index) => {
        const slot = document.createElement("div");
        slot.className = "order-slot";
        slot.textContent = index + 1;
        orderSlots.appendChild(slot);
      });

      shuffle(days).forEach(day => {
        const btn = document.createElement("button");
        btn.className = "day-chip";
        btn.type = "button";
        btn.textContent = day;

        btn.addEventListener("click", () => {
          if (btn.classList.contains("used")) return;

          if (day === days[orderIndex]){
            const slot = orderSlots.children[orderIndex];
            slot.textContent = day;
            slot.classList.add("filled");
            btn.classList.add("used");
            orderIndex++;
            showToast("Good!");

            if (orderIndex === days.length){
              showToast("Days are in order!");
            }
          } else {
            btn.classList.remove("wrong");
            void btn.offsetWidth;
            btn.classList.add("wrong");
          }
        });

        dayBank.appendChild(btn);
      });
    }

    function updateFavouriteSentence(){
      const day = favDayInput.value.trim() || "…";
      const because = favBecauseInput.value.trim() || "…";
      const like = favLikeInput.value.trim() || "…";
      const dontLike = favDontLikeInput.value.trim() || "…";
      favSentence.textContent = `My favourite day is ${day} because ${because}. I like ${like}. I don’t like ${dontLike}.`;
    }

    [favDayInput, favBecauseInput, favLikeInput, favDontLikeInput].forEach(input => {
      input.addEventListener("input", updateFavouriteSentence);
    });

    function renderFavourite(){
      favouriteDays.innerHTML = "";

      days.forEach(day => {
        const btn = document.createElement("button");
        btn.className = "fav-btn";
        btn.type = "button";
        btn.textContent = day;

        btn.addEventListener("click", () => {
          document.querySelectorAll(".fav-btn").forEach(item => item.classList.remove("selected"));
          btn.classList.add("selected");
          favDayInput.value = day;
          updateFavouriteSentence();
        });

        favouriteDays.appendChild(btn);
      });
    }

    setTimetableQuestion();
    renderMissing();
    renderOrder();
    renderFavourite();
  </script>
</body>
</html>

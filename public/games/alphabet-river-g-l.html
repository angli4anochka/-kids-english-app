.topbar{position:absolute;top:2.2vh;left:2vw;right:2vw;display:flex;justify-content:space-between;align-items:center;z-index:12;pointer-events:none}
.progress{display:flex;gap:8px;padding:8px 12px;border-radius:18px;background:rgba(255,255,255,.86);box-shadow:0 8px 24px rgba(0,0,0,.16);backdrop-filter:blur(8px)}
.dot{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#dfe8ed;color:#688;font-weight:900;transition:.25s}
.dot.done{background:#69c76d;color:#fff;transform:scale(1.07)}
.score{padding:10px 16px;border-radius:18px;color:#173d5b;background:rgba(255,255,255,.88);box-shadow:0 8px 24px rgba(0,0,0,.16);font-weight:900}
.island{position:absolute;border:none;border-radius:50%;background:rgba(255,255,255,.04);cursor:pointer;z-index:6;transition:.2s}
.island::after{content:"";position:absolute;inset:12%;border-radius:50%;border:4px solid rgba(255,255,255,0);transition:.2s}
.island:hover{transform:scale(1.06);filter:drop-shadow(0 0 18px rgba(255,245,130,.95))}
.island:hover::after{border-color:rgba(255,255,255,.7)}
.island.done{pointer-events:none}
.island.done::before{content:"✓";position:absolute;top:12%;left:50%;transform:translateX(-50%);width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:#48b85b;color:#fff;font-size:30px;font-weight:900;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.i1{left:15.2%;top:73.2%;width:18%;height:17%}
.i2{left:30.4%;top:66.5%;width:15.5%;height:14.5%}
.i3{left:45%;top:57.3%;width:15.2%;height:14.2%}
.i4{left:58.2%;top:49%;width:14.5%;height:13.4%}
.i5{left:70.5%;top:42.6%;width:14%;height:12.5%}
.i6{left:80.8%;top:35.7%;width:13.2%;height:11.8%}
.overlay{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(7,25,41,.58);backdrop-filter:blur(6px)}
.overlay.show{display:flex}
.modal{position:relative;width:min(620px,92vw);min-height:420px;padding:28px;text-align:center;border:5px solid rgba(255,255,255,.9);border-radius:32px;background:linear-gradient(180deg,#fffdf3,#f6f1dd);box-shadow:0 28px 80px rgba(0,0,0,.35);animation:pop .28s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal h2{margin:0 0 10px;font-size:clamp(28px,4vw,48px);color:#185a86}
.prompt{margin:0 0 18px;font-size:clamp(20px,2.2vw,30px);color:#31546b;font-weight:800}
.letter{margin:12px auto;font-size:clamp(90px,13vw,160px);line-height:1;color:#ef7c24;font-weight:1000;text-shadow:0 8px 0 #ffd166}
.choice-area{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
  max-width:540px;
  margin:20px auto 0;
}
.word-btn{
  min-height:72px;
  padding:16px 18px;
  border:3px solid #dcecf5;
  border-radius:20px;
  background:linear-gradient(180deg,#ffffff,#f3f9fc);
  box-shadow:0 8px 18px rgba(0,0,0,.12);
  color:#24506c;
  font-size:clamp(22px,2.2vw,30px);
  font-weight:900;
  cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
}
.word-btn:hover{
  transform:translateY(-3px) scale(1.02);
  box-shadow:0 12px 24px rgba(0,0,0,.16);
  background:#fff9dc;
}
.word-btn.correct{
  border-color:#42aa55;
  background:linear-gradient(180deg,#70d77e,#45b95a);
  color:#fff;
  box-shadow:0 10px 22px rgba(67,185,89,.35);
}
.word-btn.wrong{
  border-color:#d95b5b;
  background:linear-gradient(180deg,#f5a4a4,#e56f6f);
  color:#fff;
}
.word-btn:disabled{cursor:default;opacity:1}
.feedback{
  min-height:34px;
  margin-top:14px;
  color:#185a86;
  font-size:24px;
  font-weight:900;
}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:22px}
button.action{min-width:150px;border:none;border-radius:16px;padding:13px 20px;cursor:pointer;font-size:18px;font-weight:900;transition:.2s}
button.action:hover{transform:translateY(-2px)}
.great{background:#f3a51f;color:#1e1e1e}.close{background:#e8edf0;color:#40586a}
.finish{position:fixed;inset:0;z-index:40;display:none;place-items:center;padding:24px;text-align:center;background:rgba(13,56,83,.72);backdrop-filter:blur(8px)}
.finish.show{display:grid}
.finish-card{width:min(650px,92vw);padding:38px;border-radius:34px;background:#fffdf1;border:6px solid #fff;box-shadow:0 30px 90px rgba(0,0,0,.4)}
.finish-card h2{margin:0 0 12px;font-size:clamp(36px,5vw,66px);color:#e57220}
.finish-card p{font-size:24px;color:#31546b;font-weight:800}
.restart{border:none;border-radius:18px;padding:14px 26px;background:#4eb866;color:#fff;font-size:20px;font-weight:900;cursor:pointer}
@media(max-width:850px){.modal{min-height:360px;padding:20px}.choice-area{grid-template-columns:1fr}.word-btn{font-size:20px}.dot{width:28px;height:28px;font-size:13px}}
@media(max-aspect-ratio: 3/2){.game{width:100vw;height:calc(100vw / 1.5)}}
@media(min-aspect-ratio: 3/2){.game{height:100vh;width:calc(100vh * 1.5)}}
/* The lesson player is an iframe with a fixed viewport: keep every control on-screen. */
.overlay,.finish{padding:clamp(6px,1.4vh,16px);overflow:hidden}
.modal{width:min(620px,96vw);min-height:0;max-height:96vh;padding:clamp(10px,2vh,24px);overflow:hidden}
.modal h2{margin-bottom:clamp(2px,1vh,8px);font-size:clamp(22px,5vh,42px)}
.prompt{margin-bottom:clamp(4px,1vh,12px);font-size:clamp(15px,3vh,25px)}
.letter{margin:clamp(2px,.8vh,8px) auto;font-size:clamp(46px,14vh,120px)}
.choice-area{grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(6px,1.2vh,12px);margin-top:clamp(5px,1.2vh,12px)}
.word-btn{min-height:clamp(40px,8vh,62px);padding:clamp(6px,1.4vh,12px) 12px;font-size:clamp(16px,3vh,24px)}
.feedback{min-height:clamp(18px,3.5vh,28px);margin-top:clamp(3px,.8vh,8px);font-size:clamp(15px,3vh,22px)}
.actions{flex-wrap:nowrap;gap:8px;margin-top:clamp(4px,1vh,10px)}
button.action{min-width:120px;padding:clamp(7px,1.5vh,11px) 14px;font-size:clamp(14px,2.5vh,17px)}
.finish-card{max-height:94vh;padding:clamp(16px,4vh,34px);overflow:hidden}
.finish-card h2{font-size:clamp(28px,8vh,58px)}
.finish-card p{font-size:clamp(16px,3.5vh,22px)}
@media(max-width:850px){.choice-area{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-height:480px){.modal{border-width:3px;border-radius:20px}.modal h2{font-size:20px}.prompt{font-size:14px}.letter{font-size:42px}.word-btn{min-height:35px;padding:4px 8px}.feedback{min-height:16px}.actions{margin-top:2px}button.action{padding:6px 10px}}
</style>
</head>
<body>
<main class="game">
  <div class="topbar">
    <div class="progress" id="progress"></div>
    <div class="score">Stars: <span id="score">0</span>/6</div>
  </div>
  <button class="island i1" aria-label="Island 1"></button>
  <button class="island i2" aria-label="Island 2"></button>
  <button class="island i3" aria-label="Island 3"></button>
  <button class="island i4" aria-label="Island 4"></button>
  <button class="island i5" aria-label="Island 5"></button>
  <button class="island i6" aria-label="Island 6"></button>
</main>

<section class="overlay" id="overlay" aria-hidden="true">
  <div class="modal">
    <h2>Your challenge</h2>
    <p class="prompt" id="prompt"></p>
    <div id="letterView" class="letter"></div>

    <div id="choiceArea" class="choice-area"></div>
    <div id="feedback" class="feedback"></div>
    <div class="actions">
      <button class="action great" id="greatBtn" disabled style="opacity:.55;cursor:not-allowed;">Great! Jump on!</button>
      <button class="action close" id="closeBtn">Close</button>
    </div>
  </div>
</section>

<section class="finish" id="finish">
  <div class="finish-card">
    <h2>You crossed the river!</h2>
    <p>Fantastic! You practised G, H, I, J, K and L.<br>You can close the lesson now.</p>
    
  </div>
</section>

<script>
const tasks={
G:[{word:"gorilla",emoji:"🦍"},{word:"goat",emoji:"🐐"},{word:"gift",emoji:"🎁"},{word:"girl",emoji:"👧"}],
H:[{word:"horse",emoji:"🐴"},{word:"hat",emoji:"🎩"},{word:"house",emoji:"🏠"},{word:"hot dog",emoji:"🌭"}],
I:[{word:"insect",emoji:"🐞"},{word:"ink",emoji:"🖋️"},{word:"igloo",emoji:"🧊"},{word:"iguana",emoji:"🦎"}],
J:[{word:"jet",emoji:"✈️"},{word:"jam",emoji:"🍓"},{word:"juice",emoji:"🧃"},{word:"jacket",emoji:"🧥"}],
K:[{word:"kangaroo",emoji:"🦘"},{word:"key",emoji:"🔑"},{word:"king",emoji:"🤴"},{word:"kite",emoji:"🪁"}],
L:[{word:"lion",emoji:"🦁"},{word:"lamp",emoji:"💡"},{word:"leaf",emoji:"🍃"},{word:"lemon",emoji:"🍋"}]
};
const letters=Object.keys(tasks);
const allItems = Object.entries(tasks).flatMap(([letter, arr]) => arr.map(item => ({...item, letter})));

let remainingLetters=[],completed=new Set(),activeIsland=null,currentLetter=null,currentCorrect=null,solvedCurrent=false;

const overlay=document.getElementById("overlay"),
      finish=document.getElementById("finish"),
      score=document.getElementById("score"),
      progress=document.getElementById("progress"),
      prompt=document.getElementById("prompt"),
      letterView=document.getElementById("letterView"),
      choiceArea=document.getElementById("choiceArea"),
      feedback=document.getElementById("feedback"),
      greatBtn=document.getElementById("greatBtn");

function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}

function renderProgress(){
  progress.innerHTML="";
  letters.forEach(letter=>{
    const d=document.createElement("div");
    d.className="dot"+(completed.has(letter)?" done":"");
    d.textContent=completed.has(letter)?"✓":"?";
    progress.appendChild(d);
  });
}

function resetGame(){
  remainingLetters=shuffle(letters);
  completed=new Set();
  activeIsland=null;
  currentLetter=null;
  currentCorrect=null;
  solvedCurrent=false;
  score.textContent="0";
  document.querySelectorAll(".island").forEach(i=>i.classList.remove("done"));
  finish.classList.remove("show");
  overlay.classList.remove("show");
  renderProgress();
}

function pickChoices(targetLetter){
  const correct = tasks[targetLetter][Math.floor(Math.random()*tasks[targetLetter].length)];
  currentCorrect = correct.word;

  const otherLetters = shuffle(letters.filter(letter => letter !== targetLetter)).slice(0, 3);
  const distractors = otherLetters.map(letter => {
    const items = tasks[letter];
    return {...items[Math.floor(Math.random() * items.length)], letter};
  });

  return shuffle([{...correct, letter: targetLetter}, ...distractors]);
}

function renderChoices(targetLetter){
  choiceArea.innerHTML="";
  const choices = pickChoices(targetLetter);
  choices.forEach(item=>{
    const btn=document.createElement("button");
    btn.className="word-btn";
    btn.textContent=item.word;
    btn.addEventListener("click", ()=>checkChoice(btn, item.word));
    choiceArea.appendChild(btn);
  });
}

function openChallenge(island){
  if(island.classList.contains("done")||!remainingLetters.length)return;
  activeIsland=island;
  currentLetter=remainingLetters.pop();
  solvedCurrent=false;
  feedback.textContent="";
  greatBtn.disabled=true;
  greatBtn.style.opacity=".55";
  greatBtn.style.cursor="not-allowed";

  prompt.textContent="Choose the correct word. There are 4 mixed words from different letters.";
  letterView.style.display="block";
  letterView.textContent=currentLetter + currentLetter.toLowerCase();
  renderChoices(currentLetter);

  overlay.classList.add("show");
  overlay.setAttribute("aria-hidden","false");
}

function checkChoice(btn, chosenWord){
  if(solvedCurrent) return;
  const buttons = document.querySelectorAll(".word-btn");
  if(chosenWord === currentCorrect){
    btn.classList.add("correct");
    feedback.textContent = "Great job!";
    solvedCurrent = true;
    greatBtn.disabled=false;
    greatBtn.style.opacity="1";
    greatBtn.style.cursor="pointer";
    buttons.forEach(b=>b.disabled=true);
  } else {
    btn.classList.add("wrong");
    feedback.textContent = "Try again!";
    setTimeout(()=>{
      btn.classList.remove("wrong");
      if(!solvedCurrent) feedback.textContent = "";
    }, 700);
  }
}

document.querySelectorAll(".island").forEach(island=>island.addEventListener("click",()=>openChallenge(island)));

document.getElementById("closeBtn").addEventListener("click",()=>{
  overlay.classList.remove("show");
  overlay.setAttribute("aria-hidden","true");
  if(currentLetter && !completed.has(currentLetter) && !solvedCurrent){
    remainingLetters.push(currentLetter);
    remainingLetters=shuffle(remainingLetters);
  }
  activeIsland=null;currentLetter=null;currentCorrect=null;solvedCurrent=false;
});

greatBtn.addEventListener("click",()=>{
  if(!activeIsland||!currentLetter||!solvedCurrent)return;
  completed.add(currentLetter);
  activeIsland.classList.add("done");
  score.textContent=completed.size;
  renderProgress();
  overlay.classList.remove("show");
  overlay.setAttribute("aria-hidden","true");
  if(completed.size===6)setTimeout(()=>{
    finish.classList.add("show");
    window.parent.postMessage({
      type:"alphabet-river-complete",
      score:6,
      total:6,
      results:letters.map(letter=>({letter,correct:true}))
    },"*");
  },350);
  activeIsland=null;currentLetter=null;currentCorrect=null;solvedCurrent=false;
});

overlay.addEventListener("click",e=>{if(e.target===overlay)document.getElementById("closeBtn").click()});
resetGame();
</script>
</body>
</html>

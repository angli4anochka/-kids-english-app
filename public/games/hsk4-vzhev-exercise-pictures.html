<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>看图片，写出他们在做什么</title>
<style>
:root{
 --bg:#f3f0ea;--paper:#fff;--ink:#222;--muted:#6b6b6b;--line:#ddd2c7;--blue:#2e59a7;--orange:#f05a24;--green:#2d8b57;--red:#bb3e3e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,Arial,"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink)}
.app{max-width:1100px;margin:0 auto;padding:18px}
header{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.badge{width:48px;height:48px;border-radius:14px;background:var(--orange);display:grid;place-items:center;color:#fff;font-size:26px;font-weight:900}
h1{margin:0;color:var(--blue);font-size:30px;line-height:1.1}
.sub{margin:4px 0 0;color:var(--muted);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start}
.picwrap{position:relative}
.picnum{position:absolute;left:6px;top:6px;background:#779762;color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:900;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
img{width:100%;height:150px;object-fit:cover;border:1px solid #ccc;border-radius:8px;background:#fff}
.prompt{font-size:28px;font-weight:900;margin:4px 0 10px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:18px;margin:6px 0}
.small{font-size:13px;color:var(--muted)}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:900;cursor:pointer}
.primary{background:var(--orange);color:#fff}
.secondary{background:#ece4db;color:var(--ink)}
.result{margin-top:8px;padding:10px 12px;border-radius:10px;background:#efebe6;color:var(--muted);font-size:14px;min-height:44px}
.result.ok{background:#eef8f2;color:var(--green)}
.result.bad{background:#fff1f1;color:var(--red)}
.full{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.score{font-weight:900}
.tip{background:#f3f7ff;border:1px solid #d5e0f5;padding:12px;border-radius:14px;margin-bottom:16px;line-height:1.5}
.cn{font-size:20px;font-weight:900}
.py{font-size:14px;color:var(--blue)}
@media(max-width:820px){
 .grid{grid-template-columns:1fr}
 .card{grid-template-columns:1fr}
 img{height:180px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="badge">写</div>
    <div>
      <h1>看图片，写出他们在做什么</h1>
      <div class="sub">Look at the pictures and write down what they are doing.</div>
    </div>
  </header>

  <div class="tip">
    <div class="cn">Модель для этого упражнения: <b>V₁着 + V₂</b></div>
    <div>Сначала назови действие, которое идёт фоном, потом главное действие. Например:
      <span class="cn">吃着苹果看书</span>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="toolbar">
    <div class="score" id="score">0 / 4 карточки проверено правильно</div>
    <div>
      <button class="secondary" onclick="showAllAnswers()">Показать ответы</button>
      <button class="secondary" onclick="resetAll()">Сбросить</button>
    </div>
  </div>
</div>

const grid = document.getElementById('grid');

function norm(s){
  return (s||'').trim().toLowerCase()
    .replace(/[，,。.!！？?、；;：“”"'\s]/g,'');
}
function render(){
  grid.innerHTML = cards.map(c => `
    <div class="card" id="card-${c.num}">
      <div class="picwrap">
        <div class="picnum">${c.num}</div>
        <img src="${c.img}" alt="picture ${c.num}">
      </div>
      <div>
        <div class="prompt">${c.prompt}</div>
        <div class="small">${c.hint}</div>

        <label class="small">Второе действие / пропуск</label>
        <input id="part-${c.num}" placeholder="Напиши пропуск">

        <div class="full">
          <label class="small">Полное предложение по-китайски</label>
          <input id="full-${c.num}" placeholder="Например: 她吃着苹果看书。">
        </div>

        <div class="buttons">
          <button class="primary" onclick="checkCard(${c.num})">Проверить</button>
          <button class="secondary" onclick="showAnswer(${c.num})">Ответ</button>
        </div>
        <div class="result" id="res-${c.num}">Сначала попробуй сама.</div>
      </div>
    </div>
  `).join('');
}
function checkCard(num){
  const c = cards.find(x => x.num === num);
  const p = document.getElementById(`part-${num}`).value;
  const f = document.getElementById(`full-${num}`).value;
  const partOk = c.answers2.some(a => norm(a) === norm(p));
  const fullOk = c.full.some(a => norm(a) === norm(f));
  const res = document.getElementById(`res-${num}`);
  if(partOk && fullOk){
    res.className = 'result ok';
    res.textContent = 'Отлично. И пропуск, и полное предложение правильные.';
    document.getElementById(`card-${num}`).dataset.ok = '1';
  } else if(partOk && !fullOk){
    res.className = 'result bad';
    res.textContent = 'Пропуск правильный, но полное предложение ещё нет. Проверь порядок слов.';
    document.getElementById(`card-${num}`).dataset.ok = '0';
  } else if(!partOk && fullOk){
    res.className = 'result ok';
    res.textContent = 'Полное предложение правильное. Пропуск можно дописать так, как он звучит во фразе.';
    document.getElementById(`card-${num}`).dataset.ok = '1';
  } else {
    res.className = 'result bad';
    res.textContent = 'Пока нет. Нажми «Ответ» или перечитай подсказку.';
    document.getElementById(`card-${num}`).dataset.ok = '0';
  }
  updateScore();
}
function showAnswer(num){
  const c = cards.find(x => x.num === num);
  const res = document.getElementById(`res-${num}`);
  res.className = 'result';
  res.innerHTML = `<b>Возможный ответ:</b><br>${c.full[0]}` + (c.full.length>1 ? `<br><span class="small">Также можно: ${c.full.slice(1).join(' / ')}</span>` : '');
}
function showAllAnswers(){
  cards.forEach(c => showAnswer(c.num));
}
function resetAll(){
  cards.forEach(c => {
    document.getElementById(`part-${c.num}`).value = '';
    document.getElementById(`full-${c.num}`).value = '';
    const res = document.getElementById(`res-${c.num}`);
    res.className = 'result';
    res.textContent = 'Сначала попробуй сама.';
    document.getElementById(`card-${c.num}`).dataset.ok = '0';
  });
  updateScore();
}
function updateScore(){
  const ok = [...document.querySelectorAll('.card')].filter(c => c.dataset.ok === '1').length;
  document.getElementById('score').textContent = `${ok} / 4 карточки проверено правильно`;
}
render();
</script>

<script>
function collectVzhevAnswers(){return cards.map(c=>({prompt:c.prompt,secondAction:document.getElementById(`part-${c.num}`)?.value||'',fullSentence:document.getElementById(`full-${c.num}`)?.value||'',expectedSecondActions:c.answers2,expectedSentences:c.full}))}
function reportVzhevResult(action='change'){const answers=collectVzhevAnswers().flatMap((x,i)=>[{prompt:`Карточка ${i+1}: ${x.prompt} · второе действие`,studentAnswer:x.secondAction,correctAnswer:x.expectedSecondActions.join('|'),isCorrect:x.secondAction?x.expectedSecondActions.some(a=>norm(a)===norm(x.secondAction)):null,answerType:'text'},{prompt:`Карточка ${i+1}: полное предложение`,studentAnswer:x.fullSentence,correctAnswer:x.expectedSentences.join('|'),isCorrect:x.fullSentence?x.expectedSentences.some(a=>norm(a)===norm(x.fullSentence)):null,answerType:'text'}]);const graded=answers.filter(a=>a.isCorrect!==null),result={version:3,type:'hsk-stage-result',source:'hsk3-lesson4-vzhev',stage:14,title:'Warm-up · Что они делают',action,answers,score:graded.filter(a=>a.isCorrect).length,total:graded.length,writtenCount:0};try{const saved=JSON.parse(localStorage.getItem('hsk3-l4-stage-results')||'{}');saved[14]=result;localStorage.setItem('hsk3-l4-stage-results',JSON.stringify(saved))}catch(e){}parent.postMessage(result,location.origin)}
async function sendDeepSeek4(){const input=document.getElementById('deepseek4Input'),text=input.value.trim();if(!text)return;const log=document.getElementById('deepseek4Log');log.innerHTML+=`<div class="ds4msg me">${text.replace(/[&<>]/g,'')}</div>`;input.value='';const wait=document.createElement('div');wait.className='ds4msg';wait.textContent='DeepSeek анализирует экран…';log.appendChild(wait);try{const response=await fetch('/kids-api/hsk/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:[],context:JSON.stringify({course:'HSK 3',lesson:'Урок 4',stage:14,title:'Warm-up · Что они делают',grammar:'V₁着 + V₂',cards:cards.map(c=>({prompt:c.prompt,hint:c.hint})),savedAnswers:collectVzhevAnswers()}),instructions:['Отвечай по-русски.','Анализируй текущие четыре картинки, конструкцию V₁着 + V₂ и ответы ученика.','Китайские примеры давай с пиньинем и переводом.']})});if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();wait.textContent=data.reply||'Нет ответа.'}catch(e){wait.textContent='Не удалось получить ответ DeepSeek. Попробуй ещё раз.'}log.scrollTop=log.scrollHeight}
document.addEventListener('input',()=>{clearTimeout(window.vzhevReportTimer);window.vzhevReportTimer=setTimeout(()=>reportVzhevResult('input'),350)});document.addEventListener('click',e=>{if(e.target.closest('button')?.getAttribute('onclick')?.includes('checkCard'))setTimeout(()=>reportVzhevResult('check'),150)});

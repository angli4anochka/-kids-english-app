<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Subjects Anagram Game</title>
  <style>
    :root{
      --bg1:#eef7ff;
      --bg2:#fff4cf;
      --ink:#1b3d67;
      --soft:#5b7698;
      --good:#41b96b;
      --shadow:0 16px 36px rgba(30,70,120,.16);
    }

    *{box-sizing:border-box}

    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 12% 10%, rgba(255,255,255,.95), transparent 18%),
        radial-gradient(circle at 90% 18%, rgba(255,255,255,.65), transparent 20%),
        linear-gradient(135deg,var(--bg1),var(--bg2));
      user-select:none;
    }

    .app{
      width:100vw;
      height:100vh;
      padding:clamp(12px,1.3vw,22px);
      display:grid;
      grid-template-rows:auto 1fr auto;
      gap:clamp(10px,1vw,16px);
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }

    .badge,.progress{
      padding:10px 16px;
      border-radius:999px;
      background:rgba(255,255,255,.82);
      box-shadow:0 8px 22px rgba(0,0,0,.08);
      font-weight:950;
      font-size:clamp(13px,1.2vw,18px);
      color:#25476f;
      white-space:nowrap;
    }

    .title{
      text-align:center;
      font-size:clamp(28px,3.3vw,52px);
      font-weight:950;
      color:#2f71cd;
      text-shadow:0 3px 0 rgba(255,255,255,.92);
    }

    .screen{
      width:min(1220px,100%);
      min-height:0;
      justify-self:center;
      display:grid;
      grid-template-rows:minmax(300px, 1fr) auto;
      gap:clamp(10px,1.2vw,18px);
    }

    .picture-card{
      min-height:0;
      border-radius:34px;
      background:rgba(255,255,255,.50);
      border:5px solid rgba(255,255,255,.84);
      box-shadow:var(--shadow);
      overflow:hidden;
      position:relative;
      padding:18px;
    }

    .picture-stage{
      position:relative;
      width:100%;
      height:100%;
      min-height:280px;
      border-radius:28px;
      overflow:hidden;
      background:linear-gradient(135deg,var(--c1),var(--c2));
      box-shadow:inset 0 -12px rgba(0,0,0,.04);
    }

    .picture-stage::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.32), transparent 16%),
        radial-gradient(circle at 85% 22%, rgba(255,255,255,.26), transparent 16%),
        radial-gradient(circle at 50% 85%, rgba(255,255,255,.18), transparent 18%);
      pointer-events:none;
    }

    .scene{
      position:absolute;
      inset:0;
    }

    .subject-watermark{
      position:absolute;
      left:50%;
      bottom:14px;
      transform:translateX(-50%);
      font-size:clamp(30px,4.3vw,74px);
      font-weight:950;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:rgba(255,255,255,.26);
      white-space:nowrap;
      pointer-events:none;
    }

    .board{
      position:absolute;
      border-radius:24px;
      background:rgba(255,255,255,.38);
      border:4px solid rgba(255,255,255,.45);
      box-shadow:0 12px 24px rgba(0,0,0,.08), inset 0 -8px rgba(0,0,0,.04);
      display:grid;
      place-items:center;
      color:#27486f;
      font-weight:950;
    }

    .shape-main{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%, -50%);
      width:28%;
      aspect-ratio:1;
      border-radius:32px;
      background:rgba(255,255,255,.75);
      border:4px solid rgba(255,255,255,.86);
      box-shadow:0 18px 34px rgba(0,0,0,.10);
      display:grid;
      place-items:center;
      font-size:clamp(70px,9vw,150px);
    }

    .shape-main.circle{
      border-radius:50%;
    }

    .shape-main.wide{
      width:34%;
      aspect-ratio:1.35/1;
    }

    .prop{
      position:absolute;
      border-radius:22px;
      background:rgba(255,255,255,.56);
      border:4px solid rgba(255,255,255,.4);
      box-shadow:0 10px 24px rgba(0,0,0,.08);
      display:grid;
      place-items:center;
      color:#24466f;
    }

    .emoji{
      font-size:clamp(28px,4vw,58px);
      line-height:1;
    }

    .tiny{
      font-size:clamp(18px,2.2vw,32px);
      line-height:1.1;
      font-weight:950;
      color:#2b5d95;
      text-align:center;
      padding:10px;
    }

    .english-book{
      width:34%;
      aspect-ratio:1.2/1;
      border-radius:26px;
      background:#f6a876;
      position:absolute;
      left:23%;
      top:52%;
      transform:translate(-50%,-50%);
      box-shadow:0 16px 30px rgba(0,0,0,.10);
      display:grid;
      place-items:center;
    }
    .english-book::before,.english-book::after{
      content:"";
      position:absolute;
      top:16%;
      width:36%;
      height:64%;
      background:#fff8ea;
      border-radius:18px 18px 10px 10px;
      box-shadow:inset 0 -6px rgba(0,0,0,.04);
    }
    .english-book::before{ left:14%;}
    .english-book::after{ right:14%;}
    .english-book .q{
      position:absolute;
      right:14%;
      top:18%;
      font-size:clamp(48px,6vw,92px);
      font-weight:950;
      color:#ffffffaa;
    }

    .speech{
      position:absolute;
      right:14%;
      top:30%;
      width:24%;
      height:22%;
      border-radius:28px;
      background:#fff;
      box-shadow:0 12px 24px rgba(0,0,0,.10);
      display:grid;
      place-items:center;
      color:#2f71cd;
      font-weight:950;
      font-size:clamp(26px,3vw,48px);
    }
    .speech::after{
      content:"";
      position:absolute;
      left:18%;
      bottom:-16px;
      width:34px;
      height:34px;
      background:#fff;
      transform:rotate(45deg);
      border-radius:6px;
    }

    .pencil{
      position:absolute;
      right:30%;
      bottom:22%;
      width:20%;
      height:4%;
      background:#ff8d9e;
      border-radius:999px;
      transform:rotate(-28deg);
      box-shadow:0 6px 14px rgba(0,0,0,.12);
    }
    .pencil::before{
      content:"";
      position:absolute;
      right:-16px;
      top:-4px;
      width:0;height:0;
      border-left:18px solid #f0d1a1;
      border-top:10px solid transparent;
      border-bottom:10px solid transparent;
    }

    .math-board{
      position:absolute;
      left:16%;
      top:18%;
      width:36%;
      height:56%;
      border-radius:26px;
      background:#8fd45d;
      box-shadow:0 14px 28px rgba(0,0,0,.10);
      padding:22px;
      color:#fff;
      font-weight:950;
      font-size:clamp(24px,3vw,48px);
      line-height:1.45;
    }

    .abacus{
      position:absolute;
      right:16%;
      bottom:16%;
      width:20%;
      height:24%;
      border-radius:20px;
      background:#53b7db;
      box-shadow:0 12px 24px rgba(0,0,0,.08);
    }
    .abacus .row{
      position:absolute;
      left:12%;
      right:12%;
      height:4px;
      background:#d7f5ff;
      border-radius:999px;
    }
    .abacus .row.r1{top:28%}
    .abacus .row.r2{top:50%}
    .abacus .row.r3{top:72%}
    .abacus .bead{
      position:absolute;
      width:14px;height:14px;border-radius:50%;background:#d7f5ff;
      top:-5px;
    }

    .lab-microscope{
      position:absolute;
      left:18%;
      top:28%;
      width:24%;
      height:42%;
      border-radius:28px;
      background:rgba(255,255,255,.72);
      box-shadow:0 12px 24px rgba(0,0,0,.08);
    }
    .lab-microscope .base{
      position:absolute;left:20%;bottom:14%;width:58%;height:12%;background:#4b83c4;border-radius:16px;
    }
    .lab-microscope .arm{
      position:absolute;left:39%;top:24%;width:18%;height:42%;border-radius:18px;background:#4b83c4;transform:rotate(30deg);
    }
    .lab-microscope .tube{
      position:absolute;left:52%;top:18%;width:12%;height:20%;border-radius:14px;background:#2f5d95;transform:rotate(25deg);
    }
    .lab-microscope .lens{
      position:absolute;left:47%;top:31%;width:11%;height:11%;border-radius:50%;background:#8fe1ef;
    }
    .lab-microscope .stand{
      position:absolute;left:48%;top:52%;width:18%;height:6%;border-radius:999px;background:#2f5d95;
    }
    .flask{
      position:absolute;
      right:18%;
      top:29%;
      width:16%;
      height:38%;
      border-radius:28px;
      background:rgba(255,255,255,.70);
      box-shadow:0 12px 24px rgba(0,0,0,.08);
    }
    .flask::before{
      content:"";
      position:absolute;left:38%;top:8%;width:24%;height:22%;background:#fff;border-radius:12px;
    }
    .flask::after{
      content:"";
      position:absolute;left:18%;right:18%;bottom:12%;height:40%;background:#68d7e1;border-radius:0 0 32px 32px;
      clip-path:polygon(0 24%,100% 10%,100% 100%,0 100%);
    }

    .column{
      position:absolute;left:18%;top:22%;width:18%;height:42%;border-radius:18px;background:#f6d57c;box-shadow:0 12px 24px rgba(0,0,0,.08);
    }
    .column::before,.column::after{
      content:"";position:absolute;left:-8%;right:-8%;height:10%;background:#fff0bc;border-radius:14px;
    }
    .column::before{top:-6%}
    .column::after{bottom:-6%}
    .helmet{
      position:absolute;right:18%;top:24%;width:24%;height:34%;border-radius:38px 38px 26px 26px;background:#d49f58;box-shadow:0 12px 24px rgba(0,0,0,.08);
    }
    .helmet::before{
      content:"";position:absolute;left:22%;top:16%;width:48%;height:58%;background:#f0c986;clip-path:polygon(0 0,100% 30%,68% 100%,0 100%);
      border-radius:10px;
    }
    .scroll{
      position:absolute;left:39%;bottom:18%;width:22%;height:18%;border-radius:18px;background:#fff5d9;box-shadow:0 10px 22px rgba(0,0,0,.08);
      display:grid;place-items:center;color:#c6ab72;font-weight:950;font-size:clamp(20px,2vw,30px);
    }

    .palette{
      position:absolute;left:16%;top:28%;width:21%;aspect-ratio:1/1;border-radius:50%;background:#f5d3a5;box-shadow:0 12px 24px rgba(0,0,0,.08);
    }
    .palette .hole{
      position:absolute;right:18%;bottom:18%;width:22%;height:22%;border-radius:50%;background:rgba(255,255,255,.78);
    }
    .palette .dot{
      position:absolute;width:14%;height:14%;border-radius:50%;
    }
    .easel{
      position:absolute;right:18%;top:18%;width:28%;height:54%;
    }
    .easel .canvas{
      position:absolute;left:18%;right:18%;top:10%;height:56%;background:#fffdf7;border-radius:18px;box-shadow:0 10px 22px rgba(0,0,0,.08);
    }
    .easel .leg1,.easel .leg2,.easel .leg3{
      position:absolute;bottom:0;width:8px;background:#b78149;border-radius:999px;height:44%;
    }
    .easel .leg1{left:32%;transform:rotate(8deg)}
    .easel .leg2{right:32%;transform:rotate(-8deg)}
    .easel .leg3{left:50%;transform:translateX(-50%)}
    .easel .shelf{
      position:absolute;left:24%;right:24%;top:58%;height:10px;border-radius:999px;background:#b78149;
    }
    .rainbow span{
      position:absolute;border:10px solid transparent;border-top:none;border-bottom:none;display:block;border-radius:160px 160px 0 0;
    }

    .globe{
      position:absolute;left:18%;top:22%;width:26%;aspect-ratio:1/1;border-radius:50%;background:#69cfe1;box-shadow:0 12px 24px rgba(0,0,0,.08);
    }
    .globe::before{
      content:"";position:absolute;inset:18% 22%;background:#7cd983;border-radius:46% 54% 43% 57% / 42% 44% 56% 58%;
      transform:rotate(-15deg);
    }
    .globe::after{
      content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 4px rgba(255,255,255,.55);
    }
    .globe .line{
      position:absolute;left:50%;top:0;bottom:0;width:3px;background:#ffffff90;transform:translateX(-50%);
    }
    .globe .h{
      position:absolute;left:12%;right:12%;height:3px;background:#ffffff90;top:50%;
    }
    .mapcard{
      position:absolute;right:18%;top:24%;width:26%;height:30%;border-radius:22px;background:#fff7df;box-shadow:0 12px 24px rgba(0,0,0,.08);
    }
    .compass{
      position:absolute;right:20%;bottom:18%;width:15%;aspect-ratio:1/1;border-radius:50%;background:#fff;box-shadow:0 12px 24px rgba(0,0,0,.08);
    }
    .compass::before{
      content:"";position:absolute;left:50%;top:18%;width:4px;height:64%;background:#24466f;transform:translateX(-50%);
    }
    .compass::after{
      content:"";position:absolute;left:18%;top:50%;width:64%;height:4px;background:#24466f;transform:translateY(-50%);
    }

    .monitor{
      position:absolute;left:22%;top:20%;width:40%;height:46%;border-radius:26px;background:#4a73b8;box-shadow:0 12px 24px rgba(0,0,0,.10);
    }
    .monitor .screen{
      position:absolute;left:5%;right:5%;top:8%;bottom:20%;border-radius:18px;background:#d9f2ff;display:grid;place-items:center;color:#2f73d8;font-size:clamp(18px,2vw,34px);font-weight:950;
    }
    .monitor .stand{
      position:absolute;left:50%;bottom:7%;width:18%;height:8%;background:#6889c3;border-radius:999px;transform:translateX(-50%);
    }
    .keyboard{
      position:absolute;left:27%;bottom:18%;width:28%;height:11%;border-radius:18px;background:#fff;box-shadow:0 10px 20px rgba(0,0,0,.08);
    }
    .mouse{
      position:absolute;right:22%;bottom:18%;width:10%;height:14%;border-radius:42px;background:#fff;box-shadow:0 10px 20px rgba(0,0,0,.08);
    }
    .binary{
      position:absolute;right:14%;top:22%;color:#fff;font-weight:950;font-size:clamp(22px,2.6vw,40px);
    }

    .ball{
      position:absolute;left:18%;top:24%;width:22%;aspect-ratio:1/1;border-radius:50%;background:#f0b44b;box-shadow:0 12px 24px rgba(0,0,0,.08);
    }
    .shoe{
      position:absolute;left:40%;bottom:18%;width:24%;height:18%;border-radius:26px;background:#ffa45a;box-shadow:0 12px 24px rgba(0,0,0,.08);
      clip-path:polygon(0 48%,18% 18%,62% 18%,94% 42%,100% 58%,100% 100%,0 100%);
    }
    .shoe::before{
      content:"";position:absolute;left:18%;top:40%;width:28%;height:14%;background:#fff;border-radius:999px;
      box-shadow:0 18px 0 #fff, 0 -18px 0 #fff;
    }
    .hoop{
      position:absolute;right:16%;top:22%;width:22%;height:40%;
    }
    .hoop .pole{position:absolute;left:44%;bottom:0;width:10px;height:64%;background:#c98b4f;border-radius:999px}
    .hoop .board{position:absolute;left:18%;top:0;width:62%;height:38%;background:#fff8e8;border-radius:16px}
    .hoop .ring{position:absolute;left:36%;top:28%;width:26%;height:9%;border:6px solid #ff8b5e;border-top:none;border-radius:0 0 24px 24px}
    .medal{
      position:absolute;right:28%;bottom:16%;width:13%;aspect-ratio:1/1;border-radius:50%;background:#63c7ff;box-shadow:0 12px 24px rgba(0,0,0,.08);
    }
    .medal::before{
      content:"";position:absolute;left:32%;top:-30%;width:36%;height:34%;background:#ff9266;clip-path:polygon(0 0,100% 0,76% 100%,24% 100%);
    }

    .game-panel{
      border-radius:30px;
      background:rgba(255,255,255,.84);
      border:4px solid rgba(255,255,255,.86);
      box-shadow:var(--shadow);
      padding:clamp(12px,1.5vw,22px);
      display:grid;
      gap:clamp(8px,1vw,14px);
      min-width:0;
      container-type:inline-size;
    }

    .task-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
    }

    .task{
      font-size:clamp(16px,1.9vw,28px);
      font-weight:950;
      color:#25476f;
    }

    .hint{
      font-size:clamp(12px,1.15vw,17px);
      font-weight:900;
      color:var(--soft);
    }

    .slots{
      display:flex;
      justify-content:center;
      gap:clamp(4px,.65vw,10px);
      flex-wrap:wrap;
      min-height:clamp(50px,5.5vw,72px);
      max-width:100%;
    }

    .slot{
      width:clamp(30px, min(4.6vw, 9.5cqw), 60px);
      height:clamp(34px, min(4.9vw, 10cqw), 64px);
      display:grid;
      place-items:center;
      border-radius:clamp(10px,1.4vw,16px);
      background:#eff6ff;
      border:clamp(2px,.32vw,3px) dashed #9fc3f1;
      color:#1f4e8d;
      font-size:clamp(18px, min(2.45vw, 5.8cqw), 36px);
      font-weight:950;
      box-shadow:inset 0 -4px rgba(0,0,0,.04);
      cursor:pointer;
      transition:transform .14s ease, background .14s ease;
    }

    .slot.filled{
      background:linear-gradient(135deg,#fff,#dff0ff);
      border-style:solid;
      border-color:#69a8f0;
      transform:translateY(-2px);
    }

    .letter-bank{
      display:flex;
      justify-content:center;
      gap:clamp(4px,.65vw,10px);
      flex-wrap:wrap;
      min-height:clamp(54px,6vw,78px);
      max-width:100%;
    }

    .letter{
      width:clamp(30px, min(4.7vw, 9.6cqw), 62px);
      height:clamp(34px, min(5vw, 10cqw), 66px);
      display:grid;
      place-items:center;
      border-radius:clamp(10px,1.45vw,18px);
      background:linear-gradient(135deg,#fff7c8,#ffd86e);
      border:clamp(2px,.32vw,3px) solid rgba(255,255,255,.92);
      box-shadow:0 9px 18px rgba(0,0,0,.13), inset 0 -5px rgba(0,0,0,.06);
      color:#24466f;
      font-size:clamp(18px, min(2.45vw, 5.8cqw), 36px);
      font-weight:950;
      cursor:pointer;
      transition:transform .12s ease, opacity .15s ease;
    }

    .letter:hover{transform:translateY(-3px)}
    .letter.used{opacity:.22;pointer-events:none;transform:scale(.92)}
    .slots.wrong .slot{
      animation:shake .35s ease;
      border-color:#ff8791;
      background:#ffe8ea;
    }

    @keyframes shake{
      0%,100%{transform:translateX(0)}
      25%{transform:translateX(-7px)}
      55%{transform:translateX(7px)}
      80%{transform:translateX(-4px)}
    }

    .actions{
      display:flex;
      justify-content:center;
      gap:10px;
      min-height:46px;
    }

    button{
      border:0;
      border-radius:16px;
      padding:10px 18px;
      font-size:clamp(13px,1.2vw,17px);
      font-weight:950;
      color:white;
      cursor:pointer;
      box-shadow:0 9px 18px rgba(0,0,0,.14), inset 0 -4px rgba(0,0,0,.12);
    }

    .clear-btn{background:linear-gradient(135deg,#7db7ff,#4d8bec)}
    .next-btn{background:linear-gradient(135deg,#4dcc79,#2aaa5b);display:none}
    .next-btn.show{display:inline-block}

    .hint-popup{
      position:fixed;
      left:50%;
      top:88px;
      transform:translateX(-50%) translateY(-12px);
      z-index:70;
      max-width:min(620px, calc(100vw - 34px));
      padding:12px 20px;
      border-radius:999px;
      background:rgba(255, 248, 207, .96);
      border:4px solid rgba(255,255,255,.92);
      box-shadow:0 16px 40px rgba(0,0,0,.18);
      color:#24466f;
      font-size:clamp(15px,1.45vw,22px);
      font-weight:950;
      text-align:center;
      opacity:0;
      pointer-events:none;
      transition:opacity .22s ease, transform .22s ease;
    }

    .hint-popup.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    .feedback{
      position:fixed;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%) scale(.8);
      z-index:80;
      padding:.45em .75em;
      border-radius:28px;
      background:rgba(255,255,255,.96);
      border:4px solid white;
      box-shadow:0 22px 60px rgba(0,0,0,.24);
      color:var(--good);
      font-size:clamp(34px,5vw,78px);
      font-weight:950;
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease, transform .2s ease;
      text-align:center;
    }

    .feedback.show{
      opacity:1;
      transform:translate(-50%,-50%) scale(1);
    }

    .feedback small{
      display:block;
      font-size:.34em;
      color:#25476f;
      margin-top:.12em;
    }

    footer{
      text-align:center;
      font-weight:900;
      color:var(--soft);
      font-size:clamp(12px,1.1vw,16px);
    }

    @media (max-width:800px){
      header{
        display:grid;
        grid-template-columns:1fr auto;
      }
      .title{
        grid-column:1 / -1;
        order:-1;
      }
      .screen{
        grid-template-rows:minmax(170px,1fr) auto;
      }
      .picture-card{padding:10px;border-radius:24px}
      .picture-stage{min-height:160px;border-radius:20px}
      .game-panel{border-radius:22px;padding:10px}
      .hint{display:none}
      footer{display:none}
    }

    @media (max-height:640px){
      .app{padding:8px;gap:8px}
      .badge,.progress{padding:7px 11px}
      .title{font-size:clamp(22px,4.8vh,34px)}
      .screen{grid-template-rows:minmax(145px,1fr) auto;gap:8px}
      .picture-card{padding:8px;border-width:3px}
      .picture-stage{min-height:140px}
      .game-panel{padding:8px;border-width:3px;gap:7px}
      .actions{min-height:38px}
      button{padding:8px 14px}
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="badge">Anagram game</div>
      <div class="title">School subjects</div>
      <div class="progress" id="progress">1 / 9</div>
    </header>

    <section class="screen">
      <section class="picture-card">
        <div class="picture-stage" id="pictureStage">
          <div id="sceneBox"></div>
        </div>
      </section>

      <section class="game-panel">
        <div class="task-row">
          <div class="task">Make the word</div>
          <div class="hint">Click the letters in the correct order. Click a slot to remove a letter.</div>
        </div>

        <div class="slots" id="slots"></div>
        <div class="letter-bank" id="letterBank"></div>

        <div class="actions">
          <button class="clear-btn" id="clearBtn" type="button">Clear</button>
          <button class="next-btn" id="nextBtn" type="button">Next</button>
        </div>
      </section>
    </section>

)
    <div class="hint-popup" id="hintPopup">Hint</div>
    <div class="feedback" id="feedback">Great!<small id="feedbackWord">Music</small></div>
  </main>

  <script>
    const sceneBox = document.getElementById("sceneBox");
    const pictureStage = document.getElementById("pictureStage");
    const slotsEl = document.getElementById("slots");
    const letterBank = document.getElementById("letterBank");
    const progress = document.getElementById("progress");
    const clearBtn = document.getElementById("clearBtn");
    const nextBtn = document.getElementById("nextBtn");
    const feedback = document.getElementById("feedback");
    const feedbackWord = document.getElementById("feedbackWord");
    const hintPopup = document.getElementById("hintPopup");

    const subjects = [
      {
        word: "music",
        colors: ["#ffe0f1","#ddbfff"],
        scene: `
          <div class="scene">
            <div class="board" style="left:16%;top:58%;width:68%;height:20%;background:#2f4a73;">
              <div style="position:absolute;inset:18% 6% 18% 6%;display:flex;gap:1.2%;align-items:end;">
                ${Array.from({length:10}).map((_,i)=>`<div style="flex:1;height:100%;background:#fff;border-radius:8px;position:relative;"></div>`).join('')}
              </div>
              <div style="position:absolute;inset:18% 11.5% 42% 11.5%;display:flex;gap:7.8%;">
                ${Array.from({length:7}).map(()=>`<div style="width:4%;height:100%;background:#233855;border-radius:6px;"></div>`).join('')}
              </div>
            </div>
            <div class="shape-main circle">🎧</div>
            <div class="prop" style="left:12%;top:20%;width:14%;height:18%;"><div class="emoji">🎼</div></div>
            <div class="prop" style="right:12%;top:20%;width:14%;height:18%;"><div class="emoji">🎤</div></div>
            <div class="prop" style="left:18%;bottom:18%;width:16%;height:18%;"><div class="emoji">♪</div></div>
            <div class="prop" style="right:18%;bottom:18%;width:16%;height:18%;"><div class="emoji">🎹</div></div>
            <div class="subject-watermark">music</div>
          </div>`
      },
      {
        word: "english",
        colors: ["#d8efff","#ffe6b0"],
        scene: `
          <div class="scene">
            <div class="english-book"><div class="q">?</div></div>
            <div class="speech">ABC</div>
            <div class="pencil"></div>
            <div class="prop" style="left:50%;top:54%;width:18%;height:16%;transform:translate(-50%,-50%);"><div class="emoji">📚</div></div>
            <div class="prop" style="left:18%;top:20%;width:13%;height:16%;"><div class="emoji">🔤</div></div>
            <div class="prop" style="right:16%;bottom:18%;width:14%;height:16%;"><div class="emoji">💬</div></div>
            <div class="subject-watermark">english</div>
          </div>`
      },
      {
        word: "maths",
        colors: ["#d9f9cf","#d8ebff"],
        scene: `
          <div class="scene">
            <div class="math-board">
              <div>x + y = 10</div>
              <div>8 ÷ 2 = 4</div>
              <div>2 + 3 = 5</div>
            </div>
            <div class="shape-main circle">📐</div>
            <div class="prop" style="right:12%;top:18%;width:16%;height:18%;"><div class="emoji">➕</div></div>
            <div class="prop" style="left:44%;bottom:18%;width:14%;height:16%;"><div class="emoji">🧮</div></div>
            <div class="abacus">
              <div class="row r1"></div><div class="row r2"></div><div class="row r3"></div>
              <div class="bead" style="left:20%;top:24%;"></div><div class="bead" style="left:38%;top:24%;"></div><div class="bead" style="left:56%;top:24%;"></div>
              <div class="bead" style="left:28%;top:46%;"></div><div class="bead" style="left:46%;top:46%;"></div><div class="bead" style="left:64%;top:46%;"></div>
              <div class="bead" style="left:20%;top:68%;"></div><div class="bead" style="left:38%;top:68%;"></div><div class="bead" style="left:56%;top:68%;"></div>
            </div>
            <div class="subject-watermark">maths</div>
          </div>`
      },
      {
        word: "science",
        colors: ["#d7f8ec","#d8ebff"],
        scene: `
          <div class="scene">
            <div class="lab-microscope">
              <div class="base"></div><div class="arm"></div><div class="tube"></div><div class="lens"></div><div class="stand"></div>
            </div>
            <div class="flask"></div>
            <div class="shape-main circle">⚛️</div>
            <div class="prop" style="right:13%;top:18%;width:14%;height:16%;"><div class="emoji">🧬</div></div>
            <div class="prop" style="left:42%;bottom:16%;width:16%;height:16%;"><div class="emoji">🌱</div></div>
            <div class="subject-watermark">science</div>
          </div>`
      },
      {
        word: "history",
        colors: ["#ffe7a8","#f5ddff"],
        scene: `
          <div class="scene">
            <div class="column"></div>
            <div class="shape-main circle">🏺</div>
            <div class="helmet"></div>
            <div class="scroll">past</div>
            <div class="prop" style="left:44%;top:18%;width:14%;height:16%;"><div class="emoji">⏳</div></div>
            <div class="prop" style="right:16%;bottom:18%;width:14%;height:16%;"><div class="emoji">👑</div></div>
            <div class="subject-watermark">history</div>
          </div>`
      },
      {
        word: "art",
        colors: ["#eed8ff","#ffe8b8"],
        scene: `
          <div class="scene">
            <div class="palette">
              <div class="dot" style="left:14%;top:22%;background:#ff7d92;"></div>
              <div class="dot" style="left:36%;top:16%;background:#68b7ff;"></div>
              <div class="dot" style="left:58%;top:24%;background:#ffe15b;"></div>
              <div class="dot" style="left:22%;top:52%;background:#72d789;"></div>
              <div class="dot" style="left:48%;top:58%;background:#b88bff;"></div>
              <div class="hole"></div>
            </div>
            <div class="shape-main circle">🖌️</div>
            <div class="easel">
              <div class="canvas"></div>
              <div class="shelf"></div>
              <div class="leg1"></div><div class="leg2"></div><div class="leg3"></div>
              <div class="rainbow" style="position:absolute;left:30%;top:24%;width:42%;height:24%;">
                <span style="left:0;right:0;top:0;bottom:0;border-top:12px solid #ff7f9f;"></span>
                <span style="left:8%;right:8%;top:12%;bottom:0;border-top:12px solid #ffb043;"></span>
                <span style="left:16%;right:16%;top:24%;bottom:0;border-top:12px solid #ffd85d;"></span>
                <span style="left:24%;right:24%;top:36%;bottom:0;border-top:12px solid #66d27b;"></span>
                <span style="left:32%;right:32%;top:48%;bottom:0;border-top:12px solid #65b9ff;"></span>
              </div>
            </div>
            <div class="prop" style="left:46%;bottom:16%;width:14%;height:16%;"><div class="emoji">✏️</div></div>
            <div class="subject-watermark">art</div>
          </div>`
      },
      {
        word: "geography",
        colors: ["#d8f8ea","#d2ecff"],
        scene: `
          <div class="scene">
            <div class="globe">
              <div class="line"></div><div class="h"></div>
            </div>
            <div class="shape-main circle">🗺️</div>
            <div class="mapcard">
              <div style="position:absolute;left:12%;top:22%;width:52%;height:8%;background:#6fc07e;border-radius:999px;transform:rotate(-18deg);"></div>
              <div style="position:absolute;left:34%;top:32%;width:16%;height:16%;border-radius:50%;background:#5db5ff;"></div>
              <div style="position:absolute;left:58%;top:42%;width:22%;height:22%;background:#ffd987;clip-path:polygon(50% 0,100% 100%,0 100%);"></div>
            </div>
            <div class="compass"></div>
            <div class="prop" style="left:44%;bottom:16%;width:16%;height:16%;"><div class="emoji">⛰️</div></div>
            <div class="subject-watermark">geography</div>
          </div>`
      },
      {
        word: "it",
        colors: ["#d7e7ff","#dbfff0"],
        scene: `
          <div class="scene">
            <div class="monitor">
              <div class="screen">&lt;code&gt;</div>
              <div class="stand"></div>
            </div>
            <div class="keyboard"></div>
            <div class="mouse"></div>
            <div class="prop" style="left:14%;top:22%;width:14%;height:16%;"><div class="emoji">🖥️</div></div>
            <div class="prop" style="right:16%;bottom:18%;width:14%;height:16%;"><div class="emoji">⌨️</div></div>
            <div class="shape-main circle">💻</div>
            <div class="binary">0 1 0 1</div>
            <div class="subject-watermark">it</div>
          </div>`
      },
      {
        word: "pe",
        colors: ["#ffe4b5","#ffd08a"],
        scene: `
          <div class="scene">
            <div class="ball"></div>
            <div class="shape-main circle">🏃</div>
            <div class="shoe"></div>
            <div class="hoop"><div class="pole"></div><div class="board"></div><div class="ring"></div></div>
            <div class="medal"></div>
            <div class="subject-watermark">pe</div>
          </div>`
      }
    ];

    let index = 0;
    let answer = [];
    let currentLetters = [];
    let wrongAttempts = 0;
    let resultSent = false;

    function shuffleLetters(word) {
      const letters = word.toUpperCase().split("");
      let shuffled = [...letters];
      for (let attempt = 0; attempt < 12; attempt++) {
        shuffled = [...letters].sort(() => Math.random() - 0.5);
        if (shuffled.join("") !== letters.join("") || letters.length <= 2) break;
      }
      return shuffled.map((letter, id) => ({ letter, id }));
    }

    function titleCase(word) {
      return word[0].toUpperCase() + word.slice(1);
    }

    function hideHint() {
      hintPopup.classList.remove("show");
    }

    function showHint() {
      const word = subjects[index].word.toUpperCase();
      const first = word[0];
      const last = word[word.length - 1];
      hintPopup.textContent = `Hint: starts with ${first}, ends with ${last}, ${word.length} letters.`;
      hintPopup.classList.add("show");
    }

    function renderSubject() {
      const subject = subjects[index];
      answer = [];
      wrongAttempts = 0;
      hideHint();
      currentLetters = shuffleLetters(subject.word);
      progress.textContent = `${index + 1} / ${subjects.length}`;
      pictureStage.style.setProperty('--c1', subject.colors[0]);
      pictureStage.style.setProperty('--c2', subject.colors[1]);
      sceneBox.innerHTML = subject.scene;
      renderSlots();
      renderLetters();
      nextBtn.classList.remove("show");
    }

    function renderSlots() {
      const word = subjects[index].word.toUpperCase();
      slotsEl.innerHTML = "";
      word.split("").forEach((_, slotIndex) => {
        const slot = document.createElement("button");
        slot.className = "slot";
        slot.type = "button";
        slot.dataset.slotIndex = slotIndex;
        const item = answer[slotIndex];
        if (item) {
          slot.textContent = item.letter;
          slot.classList.add("filled");
        }
        slot.addEventListener("click", () => removeFromSlot(slotIndex));
        slotsEl.appendChild(slot);
      });
    }

    function renderLetters() {
      letterBank.innerHTML = "";
      currentLetters.forEach(item => {
        const btn = document.createElement("button");
        btn.className = "letter";
        btn.type = "button";
        btn.textContent = item.letter;
        btn.dataset.id = item.id;
        if (answer.some(a => a && a.id === item.id)) {
          btn.classList.add("used");
        }
        btn.addEventListener("click", () => chooseLetter(item));
        letterBank.appendChild(btn);
      });
    }

    function chooseLetter(item) {
      if (answer.some(a => a && a.id === item.id)) return;
      const emptyIndex = answer.findIndex(value => !value);
      const targetIndex = emptyIndex === -1 ? answer.length : emptyIndex;
      answer[targetIndex] = item;
      renderSlots();
      renderLetters();
      checkAnswer();
    }

    function removeFromSlot(slotIndex) {
      if (!answer[slotIndex]) return;
      answer[slotIndex] = undefined;
      nextBtn.classList.remove("show");
      renderSlots();
      renderLetters();
    }

    function clearAnswer() {
      answer = [];
      nextBtn.classList.remove("show");
      slotsEl.classList.remove("wrong");
      renderSlots();
      renderLetters();
    }

    function checkAnswer() {
      const subject = subjects[index];
      const word = subject.word.toUpperCase();
      if (answer.filter(Boolean).length !== word.length) return;

      const built = answer.map(item => item.letter).join("");

      if (built === word) {
        wrongAttempts = 0;
        hideHint();
        feedbackWord.textContent = titleCase(subject.word);
        feedback.classList.add("show");
        nextBtn.classList.add("show");
        nextBtn.textContent = index === subjects.length - 1 ? "Start again" : "Next";
        if (index === subjects.length - 1 && !resultSent && window.parent !== window) {
          resultSent = true;
          window.parent.postMessage({
            type: "school-subjects-anagram-done",
            score: subjects.length,
            total: subjects.length,
            results: { completedWords: subjects.map(item => item.word) }
          }, "*");
        }
        setTimeout(() => feedback.classList.remove("show"), 1050);
      } else {
        wrongAttempts++;
        slotsEl.classList.remove("wrong");
        void slotsEl.offsetWidth;
        slotsEl.classList.add("wrong");

        if (wrongAttempts >= 3) {
          showHint();
        }

        setTimeout(() => {
          clearAnswer();
          slotsEl.classList.remove("wrong");
        }, 650);
      }
    }

    function nextSubject() {
      if (!nextBtn.classList.contains("show")) return;
      index++;
      if (index >= subjects.length) {
        index = 0;
        resultSent = false;
      }
      renderSubject();
    }

    clearBtn.addEventListener("click", clearAnswer);
    nextBtn.addEventListener("click", nextSubject);

    renderSubject();
  </script>
</body>
</html>

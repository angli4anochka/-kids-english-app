<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I've Got...</title>
<style>
:root {
  --ink:#18324b;
  --muted:#667c90;
  --paper:#fffdf8;
  --blue:#4a8fd8;
  --blue-dark:#2f6ca4;
  --orange:#f49a4c;
  --green:#45b46d;
  --line:#dbe8ef;
  --shadow:0 16px 38px rgba(38,64,89,.16);
}

* { box-sizing:border-box; }

html, body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial, Helvetica, sans-serif;
  color:var(--ink);
  background:#edf6f8;
}

button { font:inherit; }

.app {
  width:100vw;
  height:100vh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:1.4vh;
  padding:2vh 2vw;
  background:
    radial-gradient(circle at 8% 14%, rgba(255,205,137,.45), transparent 24%),
    radial-gradient(circle at 92% 10%, rgba(140,204,255,.38), transparent 26%),
    linear-gradient(135deg,#f8fcfd,#edf7f9 60%,#fff8ed);
}

.header {
  max-width:1280px;
  width:100%;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:1rem;
  padding:.8rem 1rem;
  border-radius:22px;
  background:rgba(255,255,255,.88);
  box-shadow:var(--shadow);
}

.title-wrap {
  display:flex;
  align-items:center;
  gap:.85rem;
}

.badge {
  width:52px;
  height:52px;
  display:grid;
  place-items:center;
  border-radius:17px;
  background:linear-gradient(145deg,#ffd9a0,#ffad61);
  font-size:1.8rem;
}

h1 {
  margin:0;
  font-size:clamp(1.8rem,3vw,2.8rem);
  line-height:1;
}

.subtitle {
  margin-top:.28rem;
  color:var(--muted);
  font-weight:700;
}

.counter {
  padding:.55rem .9rem;
  border-radius:999px;
  background:#eef7ff;
  color:#2a659c;
  font-weight:900;
  white-space:nowrap;
}

.main {
  min-height:0;
  max-width:1280px;
  width:100%;
  margin:0 auto;
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
  gap:1.2rem;
}

.items-panel,
.sentence-panel {
  min-height:0;
  border-radius:26px;
  background:rgba(255,255,255,.92);
  box-shadow:var(--shadow);
}

.items-panel {
  padding:1rem;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:.8rem;
  align-content:center;
}

.item {
  position:relative;
  min-height:135px;
  cursor:pointer;
  border:2px solid var(--line);
  border-radius:20px;
  background:var(--paper);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:.45rem;
  padding:.7rem;
  text-align:center;
  transition:.16s ease;
  box-shadow:0 7px 18px rgba(38,64,89,.08);
}

.item:hover {
  transform:translateY(-3px);
  border-color:#9cc8e7;
}

.item.selected {
  border-color:var(--green);
  background:#eaf8ef;
  transform:translateY(-3px);
  box-shadow:0 10px 22px rgba(45,140,80,.16);
}

.item.selected::after {
  content:"✓";
  position:absolute;
  top:.55rem;
  right:.6rem;
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:var(--green);
  color:#fff;
  font-weight:900;
}

.icon {
  font-size:clamp(2.8rem,4.5vw,4.3rem);
  line-height:1;
}

.word {
  font-weight:900;
  font-size:clamp(.95rem,1.35vw,1.15rem);
}

.sentence-panel {
  padding:1rem;
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:.9rem;
}

.panel-title {
  font-size:1.2rem;
  font-weight:900;
}

.sentence-box {
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:1rem;
  border:3px dashed #bcd5e7;
  border-radius:22px;
  background:#f8fcff;
  text-align:center;
}

.sentence {
  font-size:clamp(1.35rem,2.3vw,2rem);
  line-height:1.35;
  font-weight:900;
  color:var(--blue-dark);
}

.empty {
  color:#8ca0b1;
  font-size:1rem;
  font-weight:800;
}

.controls {
  display:grid;
  gap:.65rem;
}

.done-btn,
.clear-btn {
  cursor:pointer;
  border:0;
  border-radius:16px;
  padding:.78rem 1rem;
  font-weight:900;
}

.done-btn {
  background:var(--green);
  color:#fff;
  box-shadow:0 5px 0 #2f8650;
}

.clear-btn {
  background:#eef2f5;
  color:#5f7385;
}

.footer {
  max-width:1280px;
  width:100%;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:.65rem .95rem;
  border-radius:19px;
  background:rgba(255,255,255,.84);
  box-shadow:var(--shadow);
  color:var(--muted);
  font-weight:700;
  text-align:center;
}

.modal {
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:2rem;
  background:rgba(25,48,72,.48);
  z-index:10;
}

.modal.show { display:flex; }

.modal-card {
  width:min(620px,92vw);
  text-align:center;
  padding:1.6rem;
  border-radius:28px;
  background:#fffdf8;
  box-shadow:var(--shadow);
}

.modal-icon {
  font-size:4.5rem;
}

.modal-card h2 {
  margin:.4rem 0;
  font-size:2rem;
}

.final-sentence {
  margin:1rem 0;
  padding:1rem;
  border-radius:18px;
  background:#eef8ff;
  color:var(--blue-dark);
  font-size:1.3rem;
  line-height:1.4;
  font-weight:900;
}

.close-btn {
  cursor:pointer;
  border:0;
  border-radius:15px;
  padding:.75rem 1.2rem;
  background:var(--blue);
  color:#fff;
  font-weight:900;
  box-shadow:0 5px 0 #2c679d;
}

@media (max-width:980px) {
  .main {
    grid-template-columns:1fr 310px;
  }

  .items-panel {
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .item {
    min-height:112px;
  }
}

@media (max-width:760px) {
  .app {
    padding:1.5vh 2vw;
  }

  .main {
    grid-template-columns:1fr;
    grid-template-rows:1fr auto;
  }

  .items-panel {
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:.5rem;
    padding:.7rem;
  }

  .item {
    min-height:92px;
    padding:.45rem;
  }

  .icon {
    font-size:2.45rem;
  }

  .word {
    font-size:.78rem;
  }

  .sentence-panel {
    grid-template-columns:1fr auto;
    grid-template-rows:auto auto;
    align-items:center;
  }

  .panel-title {
    grid-column:1 / -1;
  }

  .controls {
    min-width:130px;
  }
}
</style>
</head>
<body>
<div class="app">

  <header class="header">
    <div class="title-wrap">
      <div class="badge">🎒</div>
      <div>
        <h1>I’ve got...</h1>
        <div class="subtitle">Choose the things you have</div>
      </div>
    </div>
    <div id="counter" class="counter">0 selected</div>
  </header>

  <main class="main">
    <section id="itemsPanel" class="items-panel"></section>

    <aside class="sentence-panel">
      <div class="panel-title">Your sentence</div>

      <div class="sentence-box">
        <div id="sentence" class="sentence">
          <span class="empty">Choose one or more things.</span>
        </div>
      </div>

      <div class="controls">
        <button id="doneBtn" class="done-btn">DONE</button>
        <button id="clearBtn" class="clear-btn">CLEAR</button>
      </div>
    </aside>
  </main>

  <footer class="footer">
    Click the cards. Click again to remove an item.
  </footer>
</div>

<div id="modal" class="modal">
  <div class="modal-card">
    <div class="modal-icon">🌟</div>
    <h2>Well done!</h2>
    <div id="finalSentence" class="final-sentence"></div>
    <button id="closeBtn" class="close-btn">CLOSE</button>
  </div>
</div>

<script>
const items = [{"word": "skateboard", "label": "a skateboard", "icon": "🛹"}, {"word": "helmet", "label": "a helmet", "icon": "⛑️"}, {"word": "basketball", "label": "a basketball", "icon": "🏀"}, {"word": "gloves", "label": "gloves", "icon": "🧤"}, {"word": "bicycle", "label": "a bicycle", "icon": "🚲"}, {"word": "trainers", "label": "trainers", "icon": "👟"}, {"word": "cap", "label": "a cap", "icon": "🧢"}, {"word": "guitar", "label": "a guitar", "icon": "🎸"}, {"word": "digital camera", "label": "a digital camera", "icon": "📷"}, {"word": "scarf", "label": "a scarf", "icon": "🧣"}, {"word": "watch", "label": "a watch", "icon": "⌚"}, {"word": "handbag", "label": "a handbag", "icon": "👜"}, {"word": "teddy bear", "label": "a teddy bear", "icon": "🧸"}];
const selected = new Set();

const panel = document.getElementById("itemsPanel");
const sentenceEl = document.getElementById("sentence");
const counter = document.getElementById("counter");
const doneBtn = document.getElementById("doneBtn");
const clearBtn = document.getElementById("clearBtn");
const modal = document.getElementById("modal");
const finalSentence = document.getElementById("finalSentence");
const closeBtn = document.getElementById("closeBtn");

function buildSentence() {
  const chosen = items.filter(item => selected.has(item.word));

  counter.textContent = `${chosen.length} selected`;

  if (chosen.length === 0) {
    sentenceEl.innerHTML = '<span class="empty">Choose one or more things.</span>';
    return "";
  }

  const labels = chosen.map(item => item.label);
  let list = "";

  if (labels.length === 1) {
    list = labels[0];
  } else if (labels.length === 2) {
    list = `${labels[0]} and ${labels[1]}`;
  } else {
    list = `${labels.slice(0, -1).join(", ")} and ${labels[labels.length - 1]}`;
  }

  const sentence = `I’ve got ${list}.`;
  sentenceEl.textContent = sentence;
  return sentence;
}

items.forEach(item => {
  const card = document.createElement("button");
  card.className = "item";
  card.type = "button";
  card.innerHTML = `
    <div class="icon">${item.icon}</div>
    <div class="word">${item.word}</div>
  `;

  card.addEventListener("click", () => {
    if (selected.has(item.word)) {
      selected.delete(item.word);
      card.classList.remove("selected");
    } else {
      selected.add(item.word);
      card.classList.add("selected");
    }
    buildSentence();
  });

  panel.appendChild(card);
});

clearBtn.addEventListener("click", () => {
  selected.clear();
  document.querySelectorAll(".item").forEach(card => card.classList.remove("selected"));
  buildSentence();
});

doneBtn.addEventListener("click", () => {
  const sentence = buildSentence();

  if (!sentence) {
    sentenceEl.innerHTML = '<span class="empty">Choose at least one thing first.</span>';
    return;
  }

  finalSentence.textContent = sentence;
  modal.classList.add("show");

  const result = { sentence, selectedItems: [...selected] };
  localStorage.setItem("unit2bIveGotPersonalThingsResult", JSON.stringify(result));
  window.parent?.postMessage({
    type: "lesson-step-complete",
    lesson: "2b",
    step: "ive-got-personal-things",
    result
  }, "*");
});

closeBtn.addEventListener("click", () => {
  modal.classList.remove("show");
});

modal.addEventListener("click", event => {
  if (event.target === modal) {
    modal.classList.remove("show");
  }
});

buildSentence();
</script>
</body>
</html>

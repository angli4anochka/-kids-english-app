<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speaking — Choose a situation</title>
  <style>
    :root{--navy:#102a56;--blue:#3976e8;--purple:#7559de;--paper:#f7faff;--muted:#667d9f;--green:#14845e}*{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Inter,ui-rounded,"Nunito Sans",system-ui,sans-serif;color:var(--navy);background:radial-gradient(circle at 8% 0,#dceaff 0,transparent 34%),linear-gradient(145deg,#fbfdff,#edf3ff)}
    .app{width:min(1280px,100%);height:100dvh;margin:auto;padding:10px 14px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;overflow:hidden}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px}.title{display:flex;align-items:center;gap:10px}.badge{width:40px;aspect-ratio:1;display:grid;place-items:center;border:2px solid #fff;border-radius:13px;color:#fff;background:linear-gradient(145deg,#6096f3,#355fc5);box-shadow:0 6px 18px #315fc733;font-size:1.25rem;font-weight:900}h1,h2,p{margin:0}h1{font-size:clamp(1.2rem,1.9vw,1.6rem);letter-spacing:-.025em;line-height:1.15}.eyebrow{color:#6d83a5;font-size:.62rem;font-weight:900;letter-spacing:.14em;line-height:1.2;text-transform:uppercase}.header-note{max-width:360px;color:var(--muted);font-size:.9rem;font-weight:700;line-height:1.25;text-align:right}
    .workspace{min-height:0;display:grid;grid-template-columns:minmax(310px,.72fr) minmax(520px,1.28fr);gap:12px}.situations,.dialogue-panel{border:3px solid #fff;border-radius:20px;background:#ffffffdf;box-shadow:0 16px 42px #284e8b1c}.situations{padding:12px;display:grid;grid-template-rows:auto repeat(4,minmax(70px,1fr));gap:8px}.situations h2{font-size:1.05rem;line-height:1.1}.situation{position:relative;display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:10px;width:100%;padding:9px;border:2px solid transparent;border-radius:15px;color:var(--navy);background:#f3f7fd;text-align:left;font:inherit;cursor:pointer;transition:transform .16s,border-color .16s,box-shadow .16s}.situation:hover{transform:translateY(-1px);box-shadow:0 8px 20px #244b8618}.situation.active{border-color:var(--blue);background:#edf4ff;box-shadow:0 8px 24px #3976e81f}.scene{height:48px;display:grid;place-items:center;border-radius:12px;color:#fff;font-size:.78rem;font-weight:950;letter-spacing:.03em}.morning .scene{background:linear-gradient(145deg,#ffbb54,#f1784e)}.evening .scene{background:linear-gradient(145deg,#8c6be9,#3f4fa5)}.afterschool .scene{background:linear-gradient(145deg,#45a4e9,#3773d3)}.night .scene{background:linear-gradient(145deg,#293f86,#111b4a)}.situation strong{display:block;font-size:.92rem;line-height:1.1}.situation small{display:block;margin-top:2px;color:var(--muted);font-size:.78rem;font-weight:700;line-height:1.15}.checkmark{color:var(--blue);font-size:1.15rem;font-weight:950;opacity:0}.situation.active .checkmark{opacity:1}
    .dialogue-panel{padding:14px;display:flex;flex-direction:column;justify-content:flex-start;gap:10px;min-height:0}.dialogue-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.dialogue-heading h2{font-size:clamp(1.15rem,1.9vw,1.55rem);line-height:1.1}.situation-label{color:var(--blue);font-size:.68rem;font-weight:950;letter-spacing:.12em;line-height:1.2;text-transform:uppercase}.roleplay{display:grid;gap:8px;padding:14px;border:2px solid #d9e4f4;border-radius:17px;background:linear-gradient(145deg,#fbfdff,#f2f7ff)}.line{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:9px}.speaker{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;color:#fff;background:#315fc5;font-weight:950}.line:nth-child(even) .speaker{background:#7659de}.speech{font-size:clamp(.92rem,1.35vw,1.08rem);font-weight:750;line-height:1.3}.blank{display:inline-block;min-width:78px;border-bottom:2px solid #8aa6cf;color:transparent;text-align:center;transition:.18s}.blank.short{min-width:52px}.roleplay.revealed .blank{border-bottom-color:#8fc2ad;color:var(--green)}
    .word-bank{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:30px}.word-bank strong{margin-right:2px;font-size:.9rem}.word{padding:5px 10px;border-radius:99px;color:#31537f;background:#e8f0fc;font-size:.8rem;font-weight:850}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.button{height:40px;border:0;border-radius:12px;padding:0 16px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 8px 18px #526cd630;font:inherit;font-weight:900;cursor:pointer}.button.secondary{color:var(--navy);background:#e8f0fc;box-shadow:none}.button.ready{margin-left:auto;background:linear-gradient(135deg,#13805c,#24a878)}.message{min-height:20px;color:var(--green);font-size:.92rem;font-weight:900}
    @media(max-width:900px){html,body{overflow:auto}.app{height:auto;min-height:100dvh;padding:10px;overflow:visible}.workspace{grid-template-columns:1fr}.situations{grid-template-rows:auto repeat(2,92px);grid-template-columns:repeat(2,1fr)}.situations h2{grid-column:1/-1}.dialogue-panel{min-height:0}.header-note{display:none}}@media(max-width:600px){.situations{grid-template-columns:1fr;grid-template-rows:auto repeat(4,76px)}.situation{grid-template-columns:58px 1fr auto}.scene{height:45px}.dialogue-panel,.situations{border-width:3px;border-radius:18px}.line{grid-template-columns:34px 1fr}.button.ready{width:100%;margin-left:0}}
  </style>
</head>
<body>
  <main class="app">
    <header><div class="title"><span class="badge">4</span><div><p class="eyebrow">Speaking</p><h1>Choose a situation</h1></div></div><p class="header-note">Choose a card and act out the dialogue with a partner.</p></header>
    <section class="workspace">
      <div class="situations"><h2>Situation cards</h2>
        <button class="situation morning active" type="button" data-key="morning"><span class="scene">07:30</span><span><strong>Morning at school</strong><small>You meet a classmate.</small></span><span class="checkmark">✓</span></button>
        <button class="situation evening" type="button" data-key="evening"><span class="scene">18:00</span><span><strong>In the evening</strong><small>You meet a friend.</small></span><span class="checkmark">✓</span></button>
        <button class="situation afterschool" type="button" data-key="afterschool"><span class="scene">15:30</span><span><strong>After school</strong><small>You say goodbye.</small></span><span class="checkmark">✓</span></button>
        <button class="situation night" type="button" data-key="night"><span class="scene">22:00</span><span><strong>Before bed</strong><small>You say good night.</small></span><span class="checkmark">✓</span></button>
      </div>
      <article class="dialogue-panel">
        <div class="dialogue-heading"><div><p class="situation-label">Morning at school</p><h2>Act out the dialogue</h2></div></div>
        <div class="roleplay"></div>
        <div class="word-bank"></div>
        <div class="actions"><button class="button show" type="button">Show example</button><button class="button secondary change" type="button">Hide example</button><button class="button ready" type="button">Ready to speak ✓</button></div>
        <p class="message" aria-live="polite"></p>
      </article>
    </section>
  </main>
  <script>
    const data={
      morning:{label:'Morning at school',lines:[['A','Good <b class="blank short">morning</b>, <b class="blank">Sam</b>!'],['B','Hello, <b class="blank">Alex</b>!'],['A','How are you?'],['B','I’m <b class="blank short">fine</b>, thanks. And you?'],['A','I’m <b class="blank short">great</b>!'],['B','See you <b class="blank short">later</b>!']],words:['morning','fine','great','later']},
      evening:{label:'In the evening',lines:[['A','Good <b class="blank short">evening</b>, <b class="blank">Sam</b>!'],['B','Hello, <b class="blank">Alex</b>!'],['A','How are you?'],['B','I’m <b class="blank short">good</b>, thanks. And you?'],['A','Not <b class="blank short">bad</b>!'],['B','See you <b class="blank short">later</b>!']],words:['evening','good','bad','later']},
      afterschool:{label:'After school',lines:[['A','<b class="blank">Goodbye</b>, Sam!'],['B','Goodbye, Alex!'],['A','See you <b class="blank">tomorrow</b>!'],['B','See <b class="blank short">you</b>!']],words:['goodbye','tomorrow','you']},
      night:{label:'Before bed',lines:[['A','Good <b class="blank short">night</b>, Sam!'],['B','Good night, Alex!'],['A','See you <b class="blank">tomorrow</b>!'],['B','Sweet <b class="blank">dreams</b>!']],words:['night','tomorrow','dreams']}
    };
    const cards=[...document.querySelectorAll('.situation')],roleplay=document.querySelector('.roleplay'),bank=document.querySelector('.word-bank'),label=document.querySelector('.situation-label'),show=document.querySelector('.show'),hide=document.querySelector('.change'),ready=document.querySelector('.ready'),message=document.querySelector('.message');let current='morning';
    function render(){const item=data[current];label.textContent=item.label;roleplay.classList.remove('revealed');roleplay.innerHTML=item.lines.map(line=>`<div class="line"><span class="speaker">${line[0]}</span><div class="speech">${line[1]}</div></div>`).join('');bank.innerHTML=`<strong>Useful words:</strong>${item.words.map(word=>`<span class="word">${word}</span>`).join('')}`;show.style.display='inline-block';hide.style.display='none';message.textContent=''}
    cards.forEach(card=>card.addEventListener('click',()=>{current=card.dataset.key;cards.forEach(item=>item.classList.toggle('active',item===card));render()}));show.addEventListener('click',()=>{roleplay.classList.add('revealed');show.style.display='none';hide.style.display='inline-block'});hide.addEventListener('click',()=>{roleplay.classList.remove('revealed');show.style.display='inline-block';hide.style.display='none'});ready.addEventListener('click',()=>{const result={activityId:'greetings-speaking-situations',scenario:current,scenarioLabel:data[current].label,completed:true,timestamp:new Date().toISOString()};window.parent.postMessage({type:'UNIPLAY_ACTIVITY_RESULT',payload:result},'*');window.parent.postMessage({type:'lesson-result',...result},'*');try{localStorage.setItem('greetings-speaking-result',JSON.stringify(result))}catch{}message.textContent='Ready! Your teacher can see your choice.';ready.textContent='Ready ✓';ready.disabled=true});render();
  </script>
</body>
</html>

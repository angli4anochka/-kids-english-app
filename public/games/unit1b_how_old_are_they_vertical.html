<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slide 6 — How old are they?</title>
  <style>
    :root {
      --ink:#173d68;
      --blue:#4d8bec;
      --yellow:#ffd86d;
      --green:#45c776;
      --red:#ff6f87;
      --soft:#eff6ff;
      --shadow:0 16px 36px rgba(28,68,118,.18);
    }

    * { box-sizing:border-box; }

    html, body {
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 10% 10%, rgba(255,255,255,.95), transparent 17%),
        radial-gradient(circle at 88% 14%, rgba(255,255,255,.68), transparent 18%),
        linear-gradient(135deg,#eaf7ff 0%,#fff2c9 100%);
      user-select:none;
    }

    .app {
      width:100vw;
      height:100vh;
      padding:clamp(8px,.8vw,14px);
      display:grid;
      grid-template-rows:minmax(0,1fr);
    }

    .slide {
      min-height:0;
      width:100%;
      max-width:1320px;
      justify-self:center;
      display:grid;
      grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
      gap:clamp(10px,1vw,16px);
      height:100%;
    }

    .board-card, .task-card {
      min-height:0;
      min-width:0;
      border-radius:24px;
      background:rgba(255,255,255,.88);
      border:4px solid rgba(255,255,255,.85);
      box-shadow:var(--shadow);
      overflow:hidden;
      position:relative;
    }

    .board-card {
      display:grid;
      place-items:center;
      padding:clamp(6px,.7vw,10px);
      height:100%;
    }

    .board-wrap {
      position:relative;
      width:100%;
      height:100%;
      min-height:0;
      border-radius:18px;
      overflow:hidden;
      background:#dfefff;
      box-shadow:inset 0 -8px rgba(0,0,0,.04);
    }

    .board-img {
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:contain;
    }

    .name-tag {
      position:absolute;
      transform:translateX(-50%);
      top:18.3%;
      padding:.34em .72em;
      border-radius:999px;
      background:rgba(255,255,255,.95);
      color:#173d68;
      border:3px solid rgba(255,255,255,.9);
      box-shadow:0 8px 18px rgba(0,0,0,.16);
      font-weight:950;
      font-size:clamp(11px,1.15vw,18px);
      pointer-events:none;
    }

    .name-tag.active {
      background:linear-gradient(135deg,#ffe48a,#ffb95c);
      color:#173d68;
      box-shadow:0 0 0 5px rgba(255,216,109,.34), 0 10px 22px rgba(0,0,0,.18);
    }

    .task-card {
      padding:clamp(10px,1vw,14px);
      display:flex;
      flex-direction:column;
      gap:clamp(8px,.8vw,12px);
      height:100%;
      justify-content:flex-start;
    }

    .card-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      min-width:0;
    }

    .card-title {
      margin:0;
      flex:1;
      text-align:center;
      font-size:clamp(20px,2vw,34px);
      color:#2f73d8;
      text-shadow:0 3px 0 rgba(255,255,255,.94);
      line-height:.95;
      font-weight:950;
      min-width:0;
    }

    .badge {
      padding:6px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.78);
      box-shadow:0 7px 18px rgba(0,0,0,.08);
      font-weight:950;
      color:#244a78;
      font-size:clamp(10px,.85vw,13px);
      white-space:nowrap;
    }

    .progress {
      padding:6px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.78);
      box-shadow:0 7px 18px rgba(0,0,0,.08);
      font-weight:950;
      font-size:clamp(10px,.85vw,13px);
      white-space:nowrap;
    }

    .question {
      min-height:clamp(48px,4vw,64px);
      display:grid;
      place-items:center;
      text-align:center;
      padding:10px 12px;
      border-radius:16px;
      background:linear-gradient(135deg,#fff6d6,#fff);
      border:3px solid rgba(255,255,255,.9);
      box-shadow:0 8px 18px rgba(0,0,0,.08);
      font-size:clamp(20px,2vw,32px);
      font-weight:950;
      color:#244a78;
      line-height:1.05;
    }

    .answer {
      min-height:clamp(42px,3.6vw,54px);
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:6px;
    }

    .slot {
      display:grid;
      place-items:center;
      text-align:center;
      padding:8px 10px;
      border-radius:14px;
      background:#eff6ff;
      border:3px dashed #9fc3f1;
      color:#7893b5;
      font-size:clamp(12px,1.05vw,18px);
      font-weight:950;
      cursor:pointer;
    }

    .slot.filled {
      background:#fff;
      border-style:solid;
      border-color:#6baaf1;
      color:#244a78;
      box-shadow:0 7px 14px rgba(0,0,0,.08);
    }

    .slot.wrong {
      animation:shake .34s ease;
      border-color:#ff8994;
      background:#ffe9eb;
    }

    @keyframes shake {
      0%,100%{transform:translateX(0)}
      25%{transform:translateX(-7px)}
      55%{transform:translateX(7px)}
      80%{transform:translateX(-4px)}
    }

    .options {
      display:grid;
      grid-template-columns:1fr;
      gap:8px;
      min-height:0;
    }

    .option-block {
      display:grid;
      gap:6px;
      min-height:0;
    }

    .option-title {
      font-size:clamp(12px,.95vw,15px);
      font-weight:950;
      color:#244a78;
      text-align:center;
    }

    .option-group {
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:6px;
    }

    .choice {
      min-width:clamp(48px,4vw,72px);
      min-height:32px;
      border:0;
      border-radius:14px;
      padding:6px 9px;
      background:linear-gradient(135deg,#fff8ce,#ffd86d);
      color:#244a78;
      font-family:inherit;
      font-size:clamp(10px,.86vw,13px);
      font-weight:950;
      cursor:pointer;
      box-shadow:0 8px 16px rgba(0,0,0,.12), inset 0 -4px rgba(0,0,0,.07);
      transition:transform .12s ease, filter .12s ease;
    }

    .choice:hover {
      transform:translateY(-2px);
      filter:brightness(1.04);
    }

    .choice.pronoun {
      background:linear-gradient(135deg,#dff0ff,#98c9ff);
    }

    .choice.used {
      opacity:.28;
      pointer-events:none;
    }

    .controls {
      display:flex;
      justify-content:center;
      gap:6px;
      flex-wrap:wrap;
      margin-top:auto;
    }

    .control-btn {
      border:0;
      border-radius:999px;
      min-width:72px;
      padding:8px 11px;
      background:linear-gradient(135deg,#7db7ff,#4d8bec);
      color:#fff;
      font-family:inherit;
      font-size:clamp(11px,.9vw,14px);
      font-weight:950;
      cursor:pointer;
      box-shadow:0 9px 18px rgba(0,0,0,.14), inset 0 -4px rgba(0,0,0,.12);
    }

    .control-btn.next {
      background:linear-gradient(135deg,#65d782,#35b65b);
      display:none;
    }

    .control-btn.next.show {
      display:inline-block;
    }

    .toast {
      position:fixed;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%) scale(.85);
      padding:18px 28px;
      border-radius:28px;
      background:rgba(255,255,255,.96);
      border:4px solid white;
      box-shadow:0 22px 60px rgba(0,0,0,.22);
      color:#2c9b55;
      font-size:clamp(34px,5vw,76px);
      font-weight:950;
      opacity:0;
      pointer-events:none;
      z-index:20;
      transition:opacity .2s ease, transform .2s ease;
      text-align:center;
    }

    .toast.show {
      opacity:1;
      transform:translate(-50%,-50%) scale(1);
    }

    @media (max-width:900px) {
      .slide {
        grid-template-columns:1fr;
        grid-template-rows:auto auto;
      }

      .task-card {
        padding:10px;
      }

      .board-wrap {
        width:100%;
        height:clamp(220px,40vh,360px);
      }

      .card-head {
        gap:6px;
      }

      .card-title {
        font-size:clamp(18px,5vw,28px);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="slide">
      <section class="board-card">
        <div class="board-wrap">
          <img class="board-img" src="https://storage.yandexcloud.net/kids-app/html-assets/games-unit1b_how_old_are_they_vertical/fa4c6d54796559c3.png" alt="Children with ages on a classroom board" />
          <div class="name-tag" id="tag-Tim" style="left:11.2%">Tim</div>
          <div class="name-tag" id="tag-Anna" style="left:25.7%">Anna</div>
          <div class="name-tag" id="tag-Bob" style="left:40.1%">Bob</div>
          <div class="name-tag" id="tag-Sara" style="left:54.7%">Sara</div>
          <div class="name-tag" id="tag-Jack" style="left:69.1%">Jack</div>
          <div class="name-tag" id="tag-Emma" style="left:83.5%">Emma</div>
        </div>
      </section>

      <section class="task-card">
        <div class="card-head">
          <div class="badge">Slide 6</div>
          <h1 class="card-title">How old are they?</h1>
          <div class="progress" id="progress">1 / 6</div>
        </div>

        <div class="question" id="question">How old is Tim?</div>

        <div class="answer">
          <button class="slot" id="pronounSlot" type="button">He’s / She’s</button>
          <button class="slot" id="ageSlot" type="button">age</button>
        </div>

        <div class="options">
          <div class="option-block">
            <div class="option-title">Choose he / she</div>
            <div class="option-group" id="pronounOptions">
              <button class="choice pronoun" data-pronoun="He’s" type="button">He’s</button>
              <button class="choice pronoun" data-pronoun="She’s" type="button">She’s</button>
            </div>
          </div>

          <div class="option-block">
            <div class="option-title">Choose the number</div>
            <div class="option-group" id="ageOptions"></div>
          </div>
        </div>

        <div class="controls">
          <button class="control-btn" id="clearBtn" type="button">Clear</button>
          <button class="control-btn next" id="nextBtn" type="button">Next</button>
        </div>
      </section>
    </section>

    <div class="toast" id="toast">Great!</div>
  </main>

  <script>
    const pupils = [
      { name:"Tim", pronoun:"He’s", age:"five" },
      { name:"Anna", pronoun:"She’s", age:"seven" },
      { name:"Bob", pronoun:"He’s", age:"nine" },
      { name:"Sara", pronoun:"She’s", age:"eleven" },
      { name:"Jack", pronoun:"He’s", age:"thirteen" },
      { name:"Emma", pronoun:"She’s", age:"fifteen" }
    ];

    const ages = ["five", "seven", "nine", "eleven", "thirteen", "fifteen"];

    const question = document.getElementById("question");
    const progress = document.getElementById("progress");
    const pronounSlot = document.getElementById("pronounSlot");
    const ageSlot = document.getElementById("ageSlot");
    const ageOptions = document.getElementById("ageOptions");
    const nextBtn = document.getElementById("nextBtn");
    const clearBtn = document.getElementById("clearBtn");
    const toast = document.getElementById("toast");

    let index = 0;
    let chosenPronoun = "";
    let chosenAge = "";

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 850);
    }

    function renderAgeOptions() {
      ageOptions.innerHTML = "";
      ages.forEach(age => {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.type = "button";
        btn.textContent = age;
        btn.dataset.age = age;
        btn.addEventListener("click", () => {
          chosenAge = age;
          ageSlot.textContent = age + ".";
          ageSlot.classList.add("filled");
          checkAnswer();
        });
        ageOptions.appendChild(btn);
      });
    }

    function updateActiveName() {
      document.querySelectorAll(".name-tag").forEach(tag => tag.classList.remove("active"));
      document.getElementById("tag-" + pupils[index].name).classList.add("active");
    }

    function renderQuestion() {
      const pupil = pupils[index];
      question.textContent = `How old is ${pupil.name}?`;
      progress.textContent = `${index + 1} / ${pupils.length}`;
      clearAnswer();
      updateActiveName();
    }

    function clearAnswer() {
      chosenPronoun = "";
      chosenAge = "";
      pronounSlot.textContent = "He’s / She’s";
      ageSlot.textContent = "age";
      pronounSlot.classList.remove("filled", "wrong");
      ageSlot.classList.remove("filled", "wrong");
      nextBtn.classList.remove("show");
      document.querySelectorAll(".choice").forEach(btn => btn.classList.remove("used"));
    }

    document.querySelectorAll("[data-pronoun]").forEach(btn => {
      btn.addEventListener("click", () => {
        chosenPronoun = btn.dataset.pronoun;
        pronounSlot.textContent = chosenPronoun;
        pronounSlot.classList.add("filled");
        checkAnswer();
      });
    });

    function markWrong() {
      [pronounSlot, ageSlot].forEach(slot => {
        slot.classList.remove("wrong");
        void slot.offsetWidth;
        slot.classList.add("wrong");
      });
    }

    function checkAnswer() {
      if (!chosenPronoun || !chosenAge) return;

      const pupil = pupils[index];
      const ok = chosenPronoun === pupil.pronoun && chosenAge === pupil.age;

      if (ok) {
        showToast(`${chosenPronoun} ${chosenAge}!`);
        nextBtn.classList.add("show");
      } else {
        markWrong();
        setTimeout(clearAnswer, 650);
      }
    }

    nextBtn.addEventListener("click", () => {
      if (!nextBtn.classList.contains("show")) return;
      index += 1;

      if (index >= pupils.length) {
        question.textContent = "Great job!";
        progress.textContent = "6 / 6";
        nextBtn.classList.remove("show");
        document.querySelectorAll(".name-tag").forEach(tag => tag.classList.remove("active"));
        clearAnswer();
        return;
      }

      renderQuestion();
    });

    clearBtn.addEventListener("click", clearAnswer);

    renderAgeOptions();
    renderQuestion();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Where's the lesson?</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      background: #eaf5ff;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .page {
      position: relative;
      width: min(100vw, calc(100vh * 4 / 3));
      height: min(100vh, calc(100vw * 3 / 4));
      background-image: url("https://storage.yandexcloud.net/kids-app/html-assets/games-wheres_the_lesson_no_repeat/9d828418aa5754d5.png");
      background-size: cover;
      background-position: center;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 18px 45px rgba(0,0,0,.18);
      cursor: pointer;
    }

    .question {
      position: absolute;
      left: 50%;
      top: 53%;
      transform: translate(-50%, -50%);
      padding: 14px 34px;
      min-width: 36%;
      max-width: 72%;
      text-align: center;
      font-size: clamp(22px, 3vw, 52px);
      font-weight: 900;
      line-height: 1.15;
      color: #173d8f;
      background: rgba(255, 255, 255, 0.9);
      border: 4px solid rgba(255, 255, 255, 0.98);
      border-radius: 999px;
      box-shadow: 0 10px 24px rgba(0,0,0,.16);
      text-wrap: balance;
      user-select: none;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .question:active {
      transform: translate(-50%, -50%) scale(0.98);
      box-shadow: 0 6px 16px rgba(0,0,0,.14);
    }

    .question .small {
      display: block;
      font-size: .72em;
      font-weight: 800;
      color: #3056a7;
      margin-bottom: .08em;
    }

    .question .lesson {
      display: block;
      min-height: 1.2em;
    }

    .hint {
      position: absolute;
      left: 50%;
      top: calc(53% + 78px);
      transform: translateX(-50%);
      padding: 8px 18px;
      font-size: clamp(14px, 1.35vw, 22px);
      font-weight: 800;
      color: #3056a7;
      background: rgba(255,255,255,.76);
      border-radius: 999px;
      box-shadow: 0 6px 14px rgba(0,0,0,.1);
      user-select: none;
    }

    .answer {
      display: none;
    }

    @media (max-width: 900px) {
      .question {
        top: 54%;
        max-width: 78%;
        padding: 12px 22px;
      }

      .hint {
        top: calc(54% + 72px);
      }

    }
  </style>
</head>
<body>
  <main class="page" id="page">
    <div class="question" id="question">
      <span class="small">Where's the</span>
      <span class="lesson" id="lessonText"></span>
    </div>
    <div class="hint" id="hint">Click to show a lesson</div>
  </main>

  <script>
    const lessons = [
      { question: "maths lesson?", answer: "It’s in Room D." },
      { question: "English lesson?", answer: "It’s in Room C." },
      { question: "Science lesson?", answer: "It’s in Room A." },
      { question: "History lesson?", answer: "It’s in Room E." },
      { question: "Art lesson?", answer: "It’s in Room F." },
      { question: "Geography lesson?", answer: "It’s in Room G." },
      { question: "Music lesson?", answer: "It’s in Room H." },
      { question: "IT lesson?", answer: "It’s in the IT Room." },
      { question: "PE lesson?", answer: "It’s in Room B." }
    ];

    let currentIndex = -1;
    let isFinished = false;
    let resultSent = false;

    const page = document.getElementById("page");
    const lessonText = document.getElementById("lessonText");
    const hint = document.getElementById("hint");

    function nextLesson() {
      if (isFinished) return;

      currentIndex += 1;

      if (currentIndex >= lessons.length) {
        isFinished = true;
        if (!resultSent && window.parent !== window) {
          resultSent = true;
          window.parent.postMessage({
            type: "wheres-the-lesson-done",
            score: lessons.length,
            total: lessons.length,
            results: { viewed: lessons.map(item => item.question) }
          }, "*");
        }
        return;
      }

      lessonText.textContent = lessons[currentIndex].question;
      hint.style.display = "none";

      if (currentIndex === lessons.length - 1) {
        page.style.cursor = "default";
      }
    }

    page.addEventListener("click", nextLesson);
    document.getElementById("question").addEventListener("click", function(e) {
      e.stopPropagation();
      nextLesson();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Match Memory Template</title>
<style>
  :root{
    --bg:#f5f0e7; --panel:#fffdf8; --ink:#24322a; --muted:#6f7b73;
    --accent:#7b5f3b; --accent2:#d8b26e; --green:#5f8f67; --red:#b85a54;
    --line:#d9d1c4; --card:#fffaf2; --shadow:0 12px 30px rgba(45,36,24,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
  body{overflow:hidden}
  .app{width:100vw;height:100vh;display:grid;grid-template-rows:auto 1fr;min-height:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:rgba(255,253,248,.96);border-bottom:1px solid var(--line)}
  .brand{display:flex;flex-direction:column;min-width:0}.brand strong{font-size:18px}.brand span{font-size:12px;color:var(--muted)}
  .top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  button{border:none;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;transition:.15s ease}button:active{transform:translateY(1px)}
  .btn-primary{background:var(--ink);color:white}.btn-soft{background:#efe6d8;color:var(--ink)}
  .workspace{min-height:0;display:grid;grid-template-columns:360px 1fr;gap:14px;padding:14px;overflow:hidden}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);min-height:0;overflow:hidden}
  .editor{display:flex;flex-direction:column}.editor-head{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
  .editor-head h2{margin:0 0 4px;font-size:18px}.editor-head p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}
  .field{display:grid;gap:6px;margin-top:12px}.field label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  input[type="text"]{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;outline:none;background:white}
  input[type="text"]:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(216,178,110,.18)}
  .pairs{min-height:0;overflow:auto;padding:12px 14px 16px;display:grid;gap:10px}
  .pair-row{border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;gap:9px;background:#fff}
  .pair-top{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.image-picker{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center}
  .thumb{width:72px;height:72px;border-radius:14px;border:1px dashed #c9bdab;background:#f7f2ea;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:contain;display:block}.upload{display:grid;gap:6px}.upload input[type="file"]{font-size:12px;max-width:100%}.tiny{font-size:11px;color:var(--muted)}
  .remove-btn{width:34px;height:34px;padding:0;border-radius:10px;background:#f6ece8;color:#9a4d45;font-size:18px}
  .editor-footer{padding:12px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .game-shell{min-height:0;display:flex;flex-direction:column;position:relative}
  .game-head{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}.mission{min-width:0}
  .mission .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}.mission h1{margin:3px 0 0;font-size:clamp(22px,3vw,34px);line-height:1}
  .score{flex:0 0 auto;background:#efe8dc;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:900}.status{padding:0 16px 10px;color:var(--muted);font-size:14px}
  .board-wrap{flex:1;min-height:0;padding:6px 16px 16px;display:flex;align-items:center;justify-content:center;overflow:hidden}.board{width:100%;height:100%;display:grid;gap:10px;align-content:center;justify-content:center}
  .memory-card{position:relative;min-width:0;min-height:0;border:none;padding:0;background:transparent;perspective:1000px;aspect-ratio:1.08/1}
  .card-inner{position:absolute;inset:0;transition:transform .35s ease;transform-style:preserve-3d}.memory-card.flipped .card-inner,.memory-card.matched .card-inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid #d7cbbb}
  .front{background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.45),transparent 25%),linear-gradient(145deg,#8b6b45,#60462f);color:#fff8eb}
  .front::after{content:"?";font-family:Georgia,serif;font-size:clamp(34px,7vh,72px);font-weight:800;opacity:.9}.back{transform:rotateY(180deg);background:var(--card)}
  .back.word{padding:10px;text-align:center;font-size:clamp(18px,2.5vw,36px);font-weight:900;overflow-wrap:anywhere}.back.image{padding:8px}.back.image img{width:100%;height:100%;object-fit:contain;display:block}
  .memory-card.matched .face{border-color:var(--green);box-shadow:0 0 0 4px rgba(95,143,103,.12) inset}.memory-card.wrong .face{border-color:var(--red);animation:shake .28s linear 1}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .empty-state{width:100%;max-width:560px;padding:28px;border:2px dashed var(--line);border-radius:20px;text-align:center;color:var(--muted);background:#fffaf4}.empty-state strong{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
  .complete{position:absolute;inset:0;background:rgba(36,50,42,.78);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.complete.show{display:flex}
  .complete-card{width:min(420px,92%);background:white;border-radius:24px;padding:28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.28)}.complete-card h2{margin:0 0 8px;font-size:28px}.complete-card p{margin:0 0 18px;color:var(--muted)}
  .complete-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.mobile-tab{display:none}
  @media(max-width:900px){.workspace{grid-template-columns:1fr}.editor{display:none}.workspace.edit-mode .editor{display:flex}.workspace.edit-mode .game-shell{display:none}.mobile-tab{display:inline-flex}}
  @media(max-height:720px){.topbar{padding:8px 12px}.workspace{padding:10px;gap:10px}.game-head{padding:10px 14px 6px}.status{padding:0 14px 6px;font-size:13px}.board-wrap{padding:4px 14px 12px}.board{gap:8px}.face{border-radius:14px}}

  /* Embedded lesson mode: game only, fitted to the activity viewport. */
  body.embedded .workspace{grid-template-columns:1fr;padding:8px}
  body.embedded .editor{display:none}
  body.embedded .game-shell{display:flex}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><strong>Match Memory</strong><span>word ↔ picture template</span></div>
    <div class="top-actions">
      <button class="btn-soft mobile-tab" id="toggleModeBtn" type="button">Edit</button>
      <button class="btn-soft" id="shuffleBtn" type="button">Shuffle</button>
      <button class="btn-primary" id="restartBtn" type="button">Restart game</button>
    </div>
  </header>
  <main class="workspace" id="workspace">
    <section class="panel editor">
      <div class="editor-head">
        <h2>Exercise setup</h2>
        <p>Add a word and its matching picture. The game builds the memory grid automatically.</p>
        <div class="field"><label for="roundTitle">Round title</label><input id="roundTitle" type="text" value="Letter A" placeholder="e.g. Letter A" /></div>
      </div>
      <div class="pairs" id="pairs"></div>
      <div class="editor-footer"><button class="btn-soft" id="addPairBtn" type="button">+ Add pair</button><button class="btn-primary" id="buildBtn" type="button">Build game</button></div>
    </section>
    <section class="panel game-shell">
      <div class="game-head">
        <div class="mission"><div class="eyebrow">Memory mission</div><h1 id="gameTitle">Letter A</h1></div>
        <div class="score"><span id="matchedCount">0</span> / <span id="pairCount">4</span> pairs</div>
      </div>
      <div class="status" id="statusText">Find the matching word and picture.</div>
      <div class="board-wrap"><div class="board" id="board"></div></div>
      <div class="complete" id="completeOverlay">
        <div class="complete-card"><h2>All pairs found!</h2><p id="completeText">You matched all the words.</p><div class="complete-actions"><button class="btn-soft" id="playAgainBtn" type="button">Play again</button><button class="btn-primary" id="editAgainBtn" type="button">Edit pairs</button></div></div>
      </div>
    </section>
  </main>
</div>
<script>
(() => {
  if(window.parent !== window) document.body.classList.add("embedded");
  const makeSvg = (emoji, bg="#f3eadb") => {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"><rect width="400" height="400" rx="44" fill="${bg}"/><text x="200" y="235" text-anchor="middle" font-size="190" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji">${emoji}</text></svg>`;
    return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
  };
  let pairs = [
    { id: crypto.randomUUID(), word: "apple", image: makeSvg("🍎","#f5eadf") },
    { id: crypto.randomUUID(), word: "ax", image: makeSvg("🪓","#edf2e6") },
    { id: crypto.randomUUID(), word: "ant", image: makeSvg("🐜","#eee9f5") },
    { id: crypto.randomUUID(), word: "alligator", image: makeSvg("🐊","#e7f3e7") }
  ];
  const pairsEl=document.getElementById("pairs"), board=document.getElementById("board"), roundTitle=document.getElementById("roundTitle"), gameTitle=document.getElementById("gameTitle"), pairCount=document.getElementById("pairCount"), matchedCount=document.getElementById("matchedCount"), statusText=document.getElementById("statusText"), completeOverlay=document.getElementById("completeOverlay"), completeText=document.getElementById("completeText"), workspace=document.getElementById("workspace"), toggleModeBtn=document.getElementById("toggleModeBtn");
  let deck=[], openCards=[], matchedPairs=0, wrongAttempts=0, locked=false;
  function renderEditor(){
    pairsEl.innerHTML="";
    pairs.forEach((pair,index)=>{
      const row=document.createElement("div");row.className="pair-row";
      const top=document.createElement("div");top.className="pair-top";
      const input=document.createElement("input");input.type="text";input.value=pair.word;input.placeholder=`Word ${index+1}`;input.setAttribute("aria-label",`Word ${index+1}`);input.addEventListener("input",()=>pair.word=input.value);
      const remove=document.createElement("button");remove.type="button";remove.className="remove-btn";remove.textContent="×";remove.title="Remove pair";remove.addEventListener("click",()=>{pairs=pairs.filter(p=>p.id!==pair.id);renderEditor();});
      top.append(input,remove);
      const picker=document.createElement("div");picker.className="image-picker";
      const thumb=document.createElement("div");thumb.className="thumb";const img=document.createElement("img");img.src=pair.image||"";img.alt=pair.word?`${pair.word} preview`:"Image preview";thumb.appendChild(img);
      const upload=document.createElement("div");upload.className="upload";const file=document.createElement("input");file.type="file";file.accept="image/*";file.addEventListener("change",()=>{const selected=file.files&&file.files[0];if(!selected)return;const reader=new FileReader();reader.onload=e=>{pair.image=e.target.result;img.src=pair.image;};reader.readAsDataURL(selected);});
      const hint=document.createElement("div");hint.className="tiny";hint.textContent="Upload JPG, PNG, WEBP or GIF.";upload.append(file,hint);picker.append(thumb,upload);row.append(top,picker);pairsEl.appendChild(row);
    });
  }
  function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
  function chooseColumns(cardCount){if(cardCount<=4)return 2;if(cardCount<=6)return 3;if(cardCount<=8)return 4;if(cardCount<=16)return 4;return 5;}
  function updateGrid(cardCount){const cols=chooseColumns(cardCount),rows=Math.ceil(cardCount/cols);board.style.gridTemplateColumns=`repeat(${cols}, minmax(0,1fr))`;board.style.gridTemplateRows=`repeat(${rows}, minmax(0,1fr))`;board.style.maxWidth=`${Math.min(980,cols*190)}px`;board.style.maxHeight=`${Math.min(660,rows*165)}px`;}
  function buildDeck(){const validPairs=pairs.map(p=>({...p,word:p.word.trim()})).filter(p=>p.word&&p.image);deck=[];validPairs.forEach((pair,index)=>{deck.push({cardId:crypto.randomUUID(),pairId:pair.id,type:"word",value:pair.word,sortIndex:index});deck.push({cardId:crypto.randomUUID(),pairId:pair.id,type:"image",value:pair.image,alt:pair.word,sortIndex:index});});shuffle(deck);return validPairs.length;}
  function buildGame(){
    completeOverlay.classList.remove("show");openCards=[];matchedPairs=0;wrongAttempts=0;locked=false;matchedCount.textContent="0";gameTitle.textContent=roundTitle.value.trim()||"Match Memory";
    const count=buildDeck();pairCount.textContent=count;board.innerHTML="";
    if(!count){board.innerHTML='<div class="empty-state"><strong>Add at least one complete pair</strong>Each pair needs both a word and an image.</div>';statusText.textContent="The board will appear here.";return;}
    statusText.textContent="Find the matching word and picture.";updateGrid(deck.length);
    deck.forEach(cardData=>{
      const button=document.createElement("button");button.type="button";button.className="memory-card";button.dataset.cardId=cardData.cardId;button.dataset.pairId=cardData.pairId;button.dataset.type=cardData.type;
      const inner=document.createElement("div");inner.className="card-inner";const front=document.createElement("div");front.className="face front";const back=document.createElement("div");back.className=`face back ${cardData.type}`;
      if(cardData.type==="word"){back.textContent=cardData.value;}else{const img=document.createElement("img");img.src=cardData.value;img.alt=cardData.alt||"Memory picture";back.appendChild(img);}inner.append(front,back);button.appendChild(inner);button.addEventListener("click",()=>handleCard(button));board.appendChild(button);
    });
  }
  function handleCard(card){
    if(locked||card.classList.contains("matched")||card.classList.contains("flipped"))return;card.classList.add("flipped");openCards.push(card);if(openCards.length<2)return;locked=true;
    const [a,b]=openCards;const samePair=a.dataset.pairId===b.dataset.pairId;const differentTypes=a.dataset.type!==b.dataset.type;
    if(samePair&&differentTypes){setTimeout(()=>{a.classList.add("matched");b.classList.add("matched");a.classList.remove("flipped");b.classList.remove("flipped");openCards=[];locked=false;matchedPairs++;matchedCount.textContent=matchedPairs;statusText.textContent="Nice match! Keep going.";if(matchedPairs===Number(pairCount.textContent)){
        completeText.textContent=`You matched all ${matchedPairs} pairs.`;
        window.parent.postMessage({
          type:"kidsbox-match-memory-done",
          score:Math.max(0,matchedPairs-wrongAttempts),
          total:matchedPairs,
          results:[{questionIndex:0,studentAnswer:`${wrongAttempts} wrong attempts`,correctAnswer:"All pairs matched",isCorrect:wrongAttempts===0}]
        },"*");
        setTimeout(()=>completeOverlay.classList.add("show"),350);
      }},420);}else{wrongAttempts++;a.classList.add("wrong");b.classList.add("wrong");setTimeout(()=>{a.classList.remove("flipped","wrong");b.classList.remove("flipped","wrong");openCards=[];locked=false;statusText.textContent="Not a pair. Try again.";},700);}
  }
  document.getElementById("addPairBtn").addEventListener("click",()=>{pairs.push({id:crypto.randomUUID(),word:"",image:makeSvg("🖼️","#f2eee8")});renderEditor();pairsEl.scrollTop=pairsEl.scrollHeight;});
  document.getElementById("buildBtn").addEventListener("click",()=>{buildGame();if(window.innerWidth<=900){workspace.classList.remove("edit-mode");toggleModeBtn.textContent="Edit";}});
  document.getElementById("shuffleBtn").addEventListener("click",buildGame);document.getElementById("restartBtn").addEventListener("click",buildGame);document.getElementById("playAgainBtn").addEventListener("click",buildGame);
  document.getElementById("editAgainBtn").addEventListener("click",()=>{completeOverlay.classList.remove("show");if(window.innerWidth<=900){workspace.classList.add("edit-mode");toggleModeBtn.textContent="Game";}});
  toggleModeBtn.addEventListener("click",()=>{const editing=workspace.classList.toggle("edit-mode");toggleModeBtn.textContent=editing?"Game":"Edit";});roundTitle.addEventListener("input",()=>{gameTitle.textContent=roundTitle.value.trim()||"Match Memory";});
  renderEditor();buildGame();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ABC House Interactive</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at center, #3b2a57, #171020);
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  color: #fff;
  overflow: hidden;
}

.game {
  width: min(70vw, 896px);
  aspect-ratio: 16 / 10;
  position: relative;
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
  background-image: url("https://storage.yandexcloud.net/kids-app/html-assets/games-abc-house/c02e0215982dd992.png");
  background-size: cover;
  background-position: center;
}

.door {
  position: absolute;
  border: none;
  background: transparent;
  cursor: pointer;
  border-radius: 28px;
  transition: .18s ease;
}

.door::after {
  content: "";
  position: absolute;
  left: 18%;
  right: 18%;
  bottom: 3%;
  height: 12%;
  background: radial-gradient(ellipse at center, rgba(255,225,82,.75), rgba(255,225,82,0));
  opacity: 0;
  transition: .2s;
  pointer-events: none;
}

.door:hover {
  background: rgba(255,255,255,.08);
  box-shadow: 0 0 34px rgba(255,230,130,.4);
  animation: doorWiggle .5s ease-in-out infinite alternate;
}

.door:hover::after { opacity: 1; }

@keyframes doorWiggle {
  from { transform: rotate(-.8deg) translateY(-2px); }
  to { transform: rotate(.8deg) translateY(-4px); }
}

.door.opening {
  animation: doorOpen .7s ease forwards;
}

@keyframes doorOpen {
  0% { transform: scale(1) rotate(0deg); filter: brightness(1); }
  40% { transform: scale(1.04) rotate(-1deg); filter: brightness(1.35); }
  100% { transform: scale(1.12) rotate(1deg); filter: brightness(1.8); }
}

.door-red { left: 14.5%; top: 29%; width: 22%; height: 45%; }
.door-blue { left: 39%; top: 29%; width: 22%; height: 45%; }
.door-green { left: 67%; top: 29%; width: 22%; height: 45%; }

.door-stars {
  position: absolute;
  pointer-events: none;
  display: flex;
  gap: 6px;
  font-size: clamp(22px, 2.6vw, 36px);
  filter: drop-shadow(2px 2px 0 #3a230e);
  opacity: 0;
  transform: translateY(10px) scale(.7);
  transition: .35s ease;
}

.door-stars.show {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.stars-red { left: 22.5%; top: 72%; }
.stars-blue { left: 47%; top: 72%; }
.stars-green { left: 75%; top: 72%; }

.lock {
  position: absolute;
  pointer-events: none;
  font-size: clamp(24px, 2.6vw, 38px);
  opacity: 0;
  transform: scale(.5);
  transition: .3s ease;
  filter: drop-shadow(2px 2px 0 #3a230e);
}

.lock.show {
  opacity: 1;
  transform: scale(1) rotate(-8deg);
}

.lock-red { left: 28%; top: 60%; }
.lock-blue { left: 52.5%; top: 60%; }
.lock-green { left: 80%; top: 60%; }

.flash {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(circle at center, rgba(255,233,135,.85), rgba(255,233,135,.22), transparent 55%);
  opacity: 0;
}

.flash.active {
  animation: flashDoor .75s ease;
}

@keyframes flashDoor {
  0% { opacity: 0; transform: scale(.3); }
  45% { opacity: 1; transform: scale(1.05); }
  100% { opacity: 0; transform: scale(1.45); }
}

.modal {
  position: absolute;
  inset: 0;
  background: rgba(19, 13, 28, 0);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 28px;
}

.modal.active {
  display: flex;
  animation: fadeIn .25s ease forwards;
}

.modal.closing {
  animation: fadeOut .22s ease forwards;
}

@keyframes fadeIn {
  from { background: rgba(19,13,28,0); }
  to { background: rgba(19,13,28,.72); }
}

@keyframes fadeOut {
  from { background: rgba(19,13,28,.72); }
  to { background: rgba(19,13,28,0); }
}

.panel {
  width: min(740px, 94%);
  background: linear-gradient(180deg, #fff9e8, #ffecc7);
  color: #2b2133;
  border: 5px solid #2b2133;
  border-radius: 38px;
  padding: 28px;
  box-shadow: 12px 12px 0 #2b2133, 0 0 40px rgba(255,224,105,.38);
  text-align: center;
  transform-origin: center;
  animation: popIn .45s cubic-bezier(.19,1.25,.43,1);
  position: relative;
}

.panel::before {
  content: "";
  position: absolute;
  inset: 10px;
  border: 3px dashed rgba(43,33,51,.25);
  border-radius: 30px;
  pointer-events: none;
}

@keyframes popIn {
  0% { transform: scale(.25) translateY(60px); opacity: 0; }
  65% { transform: scale(1.08) translateY(-8px); opacity: 1; }
  100% { transform: scale(1) translateY(0); }
}

.modal.closing .panel {
  animation: popOut .22s ease forwards;
}

@keyframes popOut {
  to { transform: scale(.82) translateY(30px); opacity: 0; }
}

.panel h2 {
  margin: 0 0 12px;
  font-size: clamp(28px, 4vw, 48px);
}

.task {
  font-size: clamp(22px, 2.5vw, 34px);
  margin: 18px 0;
  font-weight: 900;
}

.choices {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  margin-top: 18px;
}

.choice {
  border: 4px solid #2b2133;
  border-radius: 20px;
  background: #fff;
  padding: 16px;
  font-size: clamp(20px, 2.2vw, 30px);
  font-weight: 900;
  cursor: pointer;
  box-shadow: 4px 4px 0 #2b2133;
}

.choice:hover {
  transform: translateY(-2px);
  background: #fff5ca;
}

.choice.correct { background: #abf4c5; }
.choice.wrong { background: #ffb6b6; }
.choice:disabled { opacity: .75; cursor: default; transform: none; }

.feedback {
  min-height: 34px;
  font-size: 22px;
  font-weight: 900;
  margin-top: 18px;
}

.row {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 20px;
}

.btn {
  border: 4px solid #2b2133;
  border-radius: 18px;
  background: #ffd65a;
  padding: 12px 20px;
  font-size: 20px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 4px 4px 0 #2b2133;
}

.btn.secondary { background: #bdeaff; }

.flying-star {
  position: absolute;
  font-size: 44px;
  pointer-events: none;
  animation: flyStar .9s ease-out forwards;
  z-index: 20;
}

@keyframes flyStar {
  0% { opacity: 0; transform: translate(-50%, 40px) scale(.3) rotate(0deg); }
  30% { opacity: 1; transform: translate(-50%, 0) scale(1.2) rotate(20deg); }
  100% { opacity: 0; transform: translate(-50%, -130px) scale(.5) rotate(160deg); }
}

.chest-glow {
  position: absolute;
  right: 4.5%;
  bottom: 4%;
  width: 17%;
  height: 18%;
  pointer-events: none;
  border-radius: 50%;
  opacity: 0;
  background: radial-gradient(circle, rgba(255,223,85,.9), rgba(255,223,85,.25), transparent 70%);
}

.chest-glow.show {
  animation: chestPulse 1.2s ease infinite alternate;
  opacity: 1;
}

@keyframes chestPulse {
  from { transform: scale(.9); opacity: .5; }
  to { transform: scale(1.25); opacity: 1; }
}

.final-note {
  position: absolute;
  right: 5%;
  bottom: 22%;
  background: #fff7df;
  color: #2b2133;
  border: 4px solid #2b2133;
  border-radius: 24px;
  padding: 14px 20px;
  font-size: clamp(18px, 2vw, 28px);
  font-weight: 900;
  box-shadow: 6px 6px 0 #2b2133;
  opacity: 0;
  transform: translateY(20px) scale(.8);
  transition: .4s;
}

.final-note.show {
  opacity: 1;
  transform: translateY(0) scale(1);
}

@media (max-width: 700px) {
  body { padding: 6px; }
  .game { border-radius: 16px; }
  .choices { grid-template-columns: 1fr; }
  .panel { padding: 18px; }
}
</style>
</head>
<body>
<main class="game" id="game">
  <button class="door door-red" aria-label="Alphabet Room" onclick="openDoor('alphabet', this)"></button>
  <button class="door door-blue" aria-label="Feelings Room" onclick="openDoor('feelings', this)"></button>
  <button class="door door-green" aria-label="Conversation Room" onclick="openDoor('conversation', this)"></button>

  <div class="door-stars stars-red" id="stars-alphabet">⭐ ⭐ ⭐</div>
  <div class="door-stars stars-blue" id="stars-feelings">⭐ ⭐ ⭐</div>
  <div class="door-stars stars-green" id="stars-conversation">⭐ ⭐ ⭐</div>

  <div class="lock lock-red" id="lock-alphabet">🔓</div>
  <div class="lock lock-blue" id="lock-feelings">🔓</div>
  <div class="lock lock-green" id="lock-conversation">🔓</div>

  <div class="chest-glow" id="chestGlow"></div>
  <div class="final-note" id="finalNote">Treasure is open! 🏆</div>
  <div class="flash" id="flash"></div>

  <section class="modal" id="modal">
    <div class="panel">
      <h2 id="roomTitle">Room</h2>
      <div class="task" id="taskText">Task</div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
      <div class="row">
        <button class="btn secondary" onclick="closeRoom()">Back to doors</button>
        <button class="btn" onclick="nextTask()">Next</button>
      </div>
    </div>
  </section>
</main>

<script>
const rooms = {
  alphabet: {
    title: "Alphabet Room",
    done: 0,
    tasks: [
      { q: "Find letter A", options: ["A", "B", "D", "E"], answer: "A" },
      { q: "Find letter C", options: ["B", "C", "A", "E"], answer: "C" },
      { q: "Find letter E", options: ["D", "B", "E", "A"], answer: "E" }
    ]
  },
  feelings: {
    title: "Feelings Room",
    done: 0,
    tasks: [
      { q: "😡 I am ...", options: ["happy", "sad", "angry", "hungry"], answer: "angry" },
      { q: "😋 I am ...", options: ["hungry", "sad", "happy", "angry"], answer: "hungry" },
      { q: "😊 I am ...", options: ["sad", "happy", "hungry", "angry"], answer: "happy" }
    ]
  },
  conversation: {
    title: "Conversation Room",
    done: 0,
    tasks: [
      { q: "👋 Choose the greeting", options: ["Bye!", "Hello!", "Sad!", "Angry!"], answer: "Hello!" },
      { q: "How are you?", options: ["I'm happy.", "Bye!", "Hello!", "A B C"], answer: "I'm happy." },
      { q: "👋 Choose the goodbye", options: ["Hello!", "Hungry", "Bye!", "How are you?"], answer: "Bye!" }
    ]
  }
};

let currentRoom = null;
let locked = false;
let totalScore = 0;

const DOOR_SOUND = new Audio("https://storage.yandexcloud.net/kids-app/html-assets/games-abc-house/292053ba77ffc755.mp3");

function playCreak() {
  try {
    DOOR_SOUND.currentTime = 0;
    DOOR_SOUND.play();
  } catch(e) {}
}

function playCreakOLD() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(140, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(55, ctx.currentTime + .55);
    gain.gain.setValueAtTime(.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.06, ctx.currentTime + .08);
    gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .58);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + .6);
  } catch(e) {}
}

function playDing() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [660, 880, 1100].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(.0001, ctx.currentTime + i * .06);
      gain.gain.exponentialRampToValueAtTime(.08, ctx.currentTime + i * .06 + .02);
      gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + i * .06 + .25);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i * .06);
      osc.stop(ctx.currentTime + i * .06 + .28);
    });
  } catch(e) {}
}

function openDoor(roomKey, doorEl) {
  currentRoom = roomKey;
  locked = false;
  playCreak();
  document.getElementById("flash").classList.remove("active");
  void document.getElementById("flash").offsetWidth;
  document.getElementById("flash").classList.add("active");
  doorEl.classList.add("opening");

  setTimeout(() => {
    doorEl.classList.remove("opening");
    document.getElementById("modal").classList.add("active");
    renderTask();
  }, 520);
}

function closeRoom() {
  const modal = document.getElementById("modal");
  modal.classList.add("closing");
  setTimeout(() => {
    modal.classList.remove("active", "closing");
  }, 220);
}

function renderTask() {
  const room = rooms[currentRoom];
  document.getElementById("roomTitle").textContent = room.title;
  document.getElementById("feedback").textContent = "";
  locked = false;

  if (room.done >= room.tasks.length) {
    document.getElementById("taskText").textContent = "Room completed! ⭐⭐⭐";
    document.getElementById("choices").innerHTML = "";
    return;
  }

  const task = room.tasks[room.done];
  document.getElementById("taskText").textContent = task.q;
  const choices = document.getElementById("choices");
  choices.innerHTML = "";

  task.options.forEach(option => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.textContent = option;
    btn.onclick = () => checkAnswer(btn, option, task.answer);
    choices.appendChild(btn);
  });
}

function checkAnswer(button, option, answer) {
  if (locked) return;

  if (option === answer) {
    locked = true;
    button.classList.add("correct");
    document.getElementById("feedback").textContent = "Correct! ⭐";
    rooms[currentRoom].done++;
    totalScore++;
    flyStar();
    playDing();
    updateRoomUI();
    [...document.querySelectorAll(".choice")].forEach(b => b.disabled = true);
  } else {
    button.classList.add("wrong");
    document.getElementById("feedback").textContent = "Try again!";
  }
}

function nextTask() {
  if (!currentRoom) return;
  renderTask();
}

function flyStar() {
  const star = document.createElement("div");
  star.className = "flying-star";
  star.textContent = "⭐";
  const game = document.getElementById("game");
  star.style.left = "50%";
  star.style.top = "50%";
  game.appendChild(star);
  setTimeout(() => star.remove(), 900);
}

function updateRoomUI() {
  Object.keys(rooms).forEach(key => {
    if (rooms[key].done >= rooms[key].tasks.length) {
      document.getElementById("stars-" + key).classList.add("show");
      document.getElementById("lock-" + key).classList.add("show");
    }
  });

  if (Object.values(rooms).every(room => room.done >= room.tasks.length)) {
    document.getElementById("chestGlow").classList.add("show");
    document.getElementById("finalNote").classList.add("show");
  }
}
</script>
</body>
</html>

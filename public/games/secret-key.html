<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Секретный ключ — мини-квест</title>
  <style>
    :root {
      --sky1: #8ee8ff;
      --sky2: #b7f7c2;
      --ink: #243044;
      --muted: #667085;
      --white: #ffffff;
      --blue: #2894ff;
      --purple: #7c5cff;
      --green: #38d983;
      --green-dark: #168a55;
      --orange: #ff9f43;
      --red: #ff5c5c;
      --card: rgba(255, 255, 255, 0.92);
      --shadow: 0 22px 55px rgba(36, 48, 68, 0.20);
      --soft-shadow: 0 12px 24px rgba(36, 48, 68, 0.14);
      --radius-xl: 32px;
      --radius-lg: 22px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, rgba(255, 255, 255, 0.8) 0 7%, transparent 8%),
        radial-gradient(circle at 88% 17%, rgba(255, 255, 255, 0.55) 0 5%, transparent 6%),
        radial-gradient(circle at 72% 82%, rgba(255, 255, 255, 0.45) 0 8%, transparent 9%),
        linear-gradient(180deg, var(--sky1) 0%, #9eefff 42%, var(--sky2) 100%);
      overflow-x: hidden;
    }

    .screen {
      min-height: 100vh;
      width: min(980px, calc(100% - 24px));
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 18px;
      padding: 22px 0;
    }

    .keeper-wrap {
      display: grid;
      place-items: center;
      width: 100%;
    }

    .keeper {
      position: relative;
      width: clamp(150px, 23vw, 220px);
      height: clamp(176px, 26vw, 260px);
      animation: floaty 3.4s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-9px) rotate(1deg); }
    }

    .keeper .ear {
      position: absolute;
      top: 4%;
      width: 38%;
      height: 35%;
      background: #ffad4d;
      border-radius: 12px 80% 10px 80%;
      border: clamp(4px, .7vw, 7px) solid #7a4a23;
      z-index: 0;
    }

    .keeper .ear.left {
      left: 7%;
      transform: rotate(-24deg);
    }

    .keeper .ear.right {
      right: 7%;
      transform: rotate(114deg);
    }

    .keeper .ear::after {
      content: "";
      position: absolute;
      inset: 22%;
      background: #ffd0a1;
      border-radius: 10px 80% 10px 80%;
    }

    .keeper .head {
      position: absolute;
      left: 7%;
      top: 17%;
      width: 86%;
      height: 68%;
      border-radius: 49% 51% 45% 55% / 55% 55% 45% 45%;
      background: linear-gradient(180deg, #ffb653, #ff9639);
      border: clamp(4px, .7vw, 7px) solid #7a4a23;
      z-index: 2;
      box-shadow: inset 0 -12px rgba(0,0,0,.08), var(--soft-shadow);
    }

    .keeper .face-patch {
      position: absolute;
      left: 18%;
      top: 43%;
      width: 64%;
      height: 42%;
      background: #fff2d5;
      border-radius: 50% 50% 45% 45%;
      z-index: 3;
    }

    .keeper .eye {
      position: absolute;
      top: 49%;
      width: 10%;
      height: 13%;
      border-radius: 50%;
      background: #2a1f1a;
      z-index: 5;
    }

    .keeper .eye.left { left: 30%; }
    .keeper .eye.right { right: 30%; }

    .keeper .eye::after {
      content: "";
      position: absolute;
      top: 18%;
      left: 22%;
      width: 34%;
      height: 28%;
      border-radius: 50%;
      background: white;
    }

    .keeper .nose {
      position: absolute;
      left: 50%;
      top: 63%;
      transform: translateX(-50%);
      width: 12%;
      height: 8%;
      background: #3a251b;
      border-radius: 50%;
      z-index: 5;
    }

    .keeper .smile {
      position: absolute;
      left: 50%;
      top: 70%;
      width: 26%;
      height: 14%;
      transform: translateX(-50%);
      border-bottom: clamp(3px, .5vw, 5px) solid #3a251b;
      border-radius: 0 0 50px 50px;
      z-index: 5;
    }

    .keeper .body {
      position: absolute;
      left: 24%;
      top: 78%;
      width: 52%;
      height: 32%;
      border-radius: 30px 30px 38px 38px;
      background: var(--purple);
      border: clamp(4px, .7vw, 7px) solid #402d87;
      z-index: 1;
    }

    .keeper .scarf {
      position: absolute;
      left: 20%;
      top: 75%;
      width: 60%;
      height: 12%;
      border-radius: 999px;
      background: #41dba2;
      border: clamp(3px, .6vw, 5px) solid #22785c;
      z-index: 6;
    }

    .keeper .paw {
      position: absolute;
      top: 87%;
      width: 21%;
      height: 20%;
      background: #ffad4d;
      border: clamp(3px, .6vw, 5px) solid #7a4a23;
      border-radius: 999px;
      z-index: 7;
    }

    .keeper .paw.left { left: 12%; transform: rotate(17deg); }
    .keeper .paw.right { right: 12%; transform: rotate(-17deg); }

    .game-card {
      width: 100%;
      min-height: 390px;
      background: var(--card);
      border: 3px solid rgba(255, 255, 255, 0.78);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: clamp(18px, 3vw, 34px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .intro,
    .reward-screen {
      text-align: center;
      max-width: 780px;
      margin: 0 auto;
    }

    h1, h2 {
      margin: 0 0 12px;
      font-size: clamp(30px, 5vw, 56px);
      line-height: 1;
      letter-spacing: -0.05em;
    }

    p {
      margin: 0 0 14px;
      font-size: clamp(17px, 2.2vw, 23px);
      line-height: 1.35;
    }

    .small {
      color: var(--muted);
      font-size: clamp(14px, 1.8vw, 18px);
    }

    .btn {
      border: 0;
      cursor: pointer;
      border-radius: 999px;
      padding: 14px 22px;
      color: white;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      box-shadow: 0 12px 24px rgba(40, 148, 255, 0.26);
      font-weight: 900;
      font-size: clamp(16px, 2vw, 20px);
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
      touch-action: manipulation;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
      box-shadow: 0 16px 32px rgba(40, 148, 255, 0.32);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.green {
      background: linear-gradient(135deg, #38d983, #20a968);
      box-shadow: 0 12px 24px rgba(46, 159, 104, 0.25);
    }

    .btn.orange {
      background: linear-gradient(135deg, #ffbd59, #ff8a3d);
      box-shadow: 0 12px 24px rgba(255, 159, 67, 0.25);
    }

    .top-line {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .quest-title {
      margin: 0;
      font-size: clamp(26px, 4vw, 44px);
      letter-spacing: -0.04em;
    }

    .quest-instruction {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 20px);
    }

    .progress {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 9px 13px;
      background: #fff7d6;
      border-radius: 999px;
      box-shadow: var(--soft-shadow);
      font-weight: 900;
      white-space: nowrap;
      font-size: clamp(14px, 1.7vw, 18px);
    }

    .letters-grid,
    .choice-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(80px, 1fr));
      gap: clamp(10px, 1.8vw, 16px);
      margin-top: 22px;
    }

    .choice-grid {
      grid-template-columns: repeat(3, minmax(120px, 1fr));
    }

    .letter-tile,
    .choice {
      min-height: clamp(70px, 10vw, 100px);
      border: 0;
      border-radius: var(--radius-lg);
      background: white;
      box-shadow: var(--soft-shadow);
      color: var(--ink);
      cursor: pointer;
      border-bottom: 7px solid rgba(36,48,68,.12);
      transition: transform .16s ease, background .16s ease;
      font-weight: 900;
    }

    .letter-tile {
      font-size: clamp(36px, 7vw, 58px);
    }

    .choice {
      font-size: clamp(19px, 3vw, 28px);
      padding: 10px;
    }

    .letter-tile:hover,
    .choice:hover {
      transform: translateY(-3px);
    }

    .letter-tile.correct,
    .choice.good {
      background: #d7ffe9;
      color: #157d4e;
      border-bottom-color: #89dfb0;
    }

    .letter-tile.wrong,
    .choice.bad {
      animation: shake .35s ease;
      background: #ffe1e1;
      color: #a82323;
    }

    .letter-tile[disabled] {
      cursor: default;
      opacity: .78;
      transform: none;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      50% { transform: translateX(7px); }
      75% { transform: translateX(-4px); }
    }

    .type-row {
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: center;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    .big-input {
      width: min(280px, 100%);
      border: 4px solid #d4e5ff;
      border-radius: 24px;
      background: white;
      box-shadow: inset 0 4px 0 rgba(36,48,68,.04);
      padding: 18px;
      font-size: clamp(42px, 8vw, 70px);
      line-height: 1;
      text-align: center;
      font-weight: 900;
      color: var(--ink);
      text-transform: uppercase;
      outline: none;
      transition: border .18s ease, transform .18s ease;
    }

    .big-input:focus {
      border-color: var(--blue);
      transform: translateY(-1px);
    }

    .feedback {
      margin-top: 18px;
      min-height: 32px;
      text-align: center;
      font-size: clamp(17px, 2vw, 22px);
      font-weight: 900;
      color: var(--blue);
    }

    .feedback.error {
      color: #b42318;
    }

    .feedback.success {
      color: var(--green-dark);
    }

    .key {
      position: relative;
      display: inline-block;
      width: 134px;
      height: 70px;
      margin: 18px auto 12px;
      animation: keyGlow 1.4s ease-in-out infinite alternate;
    }

    .key::before {
      content: "";
      position: absolute;
      left: 0;
      top: 5px;
      width: 60px;
      height: 60px;
      border: 12px solid #ffca3a;
      border-radius: 50%;
      box-shadow: inset 0 0 0 5px #ffef9a;
    }

    .key::after {
      content: "";
      position: absolute;
      left: 55px;
      top: 28px;
      width: 78px;
      height: 16px;
      background: #ffca3a;
      border-radius: 999px;
      box-shadow:
        38px 12px 0 -2px #ffca3a,
        52px -12px 0 -2px #ffca3a;
    }

    @keyframes keyGlow {
      from { filter: drop-shadow(0 0 4px rgba(255, 202, 58, .5)); transform: rotate(-3deg); }
      to { filter: drop-shadow(0 0 18px rgba(255, 202, 58, .95)); transform: rotate(4deg); }
    }

    .mini-actions {
      position: fixed;
      right: 14px;
      bottom: 14px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .tiny-btn {
      border: 0;
      cursor: pointer;
      border-radius: 999px;
      padding: 10px 13px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: var(--soft-shadow);
      color: var(--ink);
      font-weight: 900;
      backdrop-filter: blur(8px);
    }

    .confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 99;
    }

    .confetti-piece {
      position: absolute;
      width: 12px;
      height: 18px;
      border-radius: 4px;
      opacity: .95;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: .6;
      }
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 720px) {
      .screen {
        justify-content: flex-start;
        padding-top: 18px;
      }

      .top-line {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .letters-grid,
      .choice-grid {
        grid-template-columns: repeat(2, minmax(120px, 1fr));
      }

      .game-card {
        min-height: 430px;
      }
    }

    @media (max-width: 480px) {
      .letters-grid,
      .choice-grid {
        grid-template-columns: 1fr;
      }

      .mini-actions {
        left: 10px;
        right: 10px;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="confetti" id="confetti"></div>

  <main class="screen">
    <section class="keeper-wrap" aria-label="Лисёнок-хранитель">
      <div class="keeper">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="head">
          <div class="face-patch"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="nose"></div>
          <div class="smile"></div>
        </div>
        <div class="body"></div>
        <div class="scarf"></div>
        <div class="paw left"></div>
        <div class="paw right"></div>
      </div>
    </section>

    <section class="game-card" id="gameCard">
      <div class="intro" id="intro">
        <h1>Hey, friends!</h1>
        <p>Следующая точка острова закрыта. Чтобы пройти дальше, нужны секретные знания.</p>
        <p class="small">Пройдите 3 квеста: найдите букву A, напечатайте B и вспомните, как поздороваться.</p>
        <button class="btn green" id="startBtn">🚀 Начать квесты</button>
      </div>

      <div id="questPanel" class="hidden"></div>
    </section>
  </main>

  <script>
    const config = {
      findLetter: "A",
      typeLetter: "B",
      greetingAnswer: "Hello!",
      howAreYouAnswer: "How are you?",
      findLettersPool: ["A", "B", "C", "A", "D", "B", "E", "A"],
      greetingOptions: ["Hello!", "Bye!", "Cat!"],
      howAreYouOptions: ["How are you?", "I am red.", "Apple."]
    };

    const state = {
      currentQuest: 0,
      done: [false, false, false],
      foundIndexes: new Set(),
      q3Step: 0
    };

    const intro = document.getElementById("intro");
    const questPanel = document.getElementById("questPanel");
    const confetti = document.getElementById("confetti");

    document.getElementById("startBtn").addEventListener("click", startGame);

    function startGame() {
      intro.classList.add("hidden");
      questPanel.classList.remove("hidden");
      render();
    }

    function resetGame() {
      state.currentQuest = 0;
      state.done = [false, false, false];
      state.foundIndexes = new Set();
      state.q3Step = 0;
      questPanel.classList.add("hidden");
      intro.classList.remove("hidden");
      questPanel.innerHTML = "";
    }

    function render() {
      if (state.done.every(Boolean)) {
        renderReward();
        return;
      }

      if (state.currentQuest === 0) renderFindLetterQuest();
      if (state.currentQuest === 1) renderTypeLetterQuest();
      if (state.currentQuest === 2) renderGreetingQuest();
    }

    function progressText() {
      const done = state.done.filter(Boolean).length;
      return `${done}/3 🗝️`;
    }

    function renderFindLetterQuest() {
      const target = config.findLetter;
      const totalTargets = config.findLettersPool.filter(letter => letter === target).length;

      questPanel.innerHTML = `
        <div class="top-line">
          <div>
            <h2 class="quest-title">Квест 1: найди букву ${target}</h2>
            <p class="quest-instruction">Нажми на все карточки с буквой <strong>${target}</strong>.</p>
          </div>
          <div class="progress">${progressText()}</div>
        </div>

        <div class="letters-grid">
          ${config.findLettersPool.map((letter, index) => `
            <button
              class="letter-tile ${state.foundIndexes.has(index) ? "correct" : ""}"
              data-index="${index}"
              ${state.foundIndexes.has(index) ? "disabled" : ""}
              aria-label="Буква ${letter}">
              ${letter}
            </button>
          `).join("")}
        </div>

        <div class="feedback" id="feedback">Найдите букву ${target}. Да, остальные буквы тоже хотят внимания, но сегодня не их день.</div>
      `;

      document.querySelectorAll(".letter-tile").forEach(tile => {
        tile.addEventListener("click", () => {
          const index = Number(tile.dataset.index);
          const letter = config.findLettersPool[index];
          const feedback = document.getElementById("feedback");

          if (letter === target) {
            state.foundIndexes.add(index);
            tile.classList.add("correct");
            tile.disabled = true;
            feedback.textContent = "Yes! Это буква " + target + "!";
            feedback.className = "feedback success";

            if (state.foundIndexes.size === totalTargets) {
              completeQuest(0);
            } else {
              setTimeout(renderFindLetterQuest, 320);
            }
          } else {
            tile.classList.remove("wrong");
            void tile.offsetWidth;
            tile.classList.add("wrong");
            feedback.textContent = "Oops! Это не " + target + ".";
            feedback.className = "feedback error";
          }
        });
      });
    }

    function renderTypeLetterQuest() {
      const target = config.typeLetter;

      questPanel.innerHTML = `
        <div class="top-line">
          <div>
            <h2 class="quest-title">Квест 2: напечатай ${target}</h2>
            <p class="quest-instruction">Введи секретную букву в поле.</p>
          </div>
          <div class="progress">${progressText()}</div>
        </div>

        <div class="type-row">
          <input class="big-input" id="typeInput" maxlength="1" autocomplete="off" aria-label="Напечатай букву ${target}" />
          <button class="btn green" id="checkTypeBtn">Проверить</button>
        </div>

        <div class="feedback" id="feedback">Ждём букву ${target}. Интрига уровня “кто съел печенье”.</div>
      `;

      const input = document.getElementById("typeInput");
      input.focus();

      input.addEventListener("input", () => {
        input.value = input.value.toUpperCase();
      });

      input.addEventListener("keydown", event => {
        if (event.key === "Enter") checkTypedLetter();
      });

      document.getElementById("checkTypeBtn").addEventListener("click", checkTypedLetter);

      function checkTypedLetter() {
        const value = input.value.trim().toUpperCase();
        const feedback = document.getElementById("feedback");

        if (value === target) {
          feedback.textContent = "Great job! Буква " + target + " засчитана.";
          feedback.className = "feedback success";
          completeQuest(1);
        } else {
          feedback.textContent = "Почти, но нет. Нужна буква " + target + ".";
          feedback.className = "feedback error";
          input.style.animation = "shake .35s ease";
          setTimeout(() => input.style.animation = "", 360);
        }
      }
    }

    function renderGreetingQuest() {
      const isFirstStep = state.q3Step === 0;
      const title = isFirstStep
        ? "Квест 3: как сказать «привет»?"
        : "Квест 3: как спросить «как дела?»";

      const instruction = isFirstStep
        ? "Выбери правильное приветствие."
        : "Выбери правильный вопрос.";

      const correct = isFirstStep
        ? config.greetingAnswer
        : config.howAreYouAnswer;

      const options = isFirstStep
        ? config.greetingOptions
        : config.howAreYouOptions;

      questPanel.innerHTML = `
        <div class="top-line">
          <div>
            <h2 class="quest-title">${title}</h2>
            <p class="quest-instruction">${instruction}</p>
          </div>
          <div class="progress">${progressText()}</div>
        </div>

        <div class="choice-grid">
          ${shuffle([...options]).map(option => `
            <button class="choice" data-value="${escapeHtml(option)}">${option}</button>
          `).join("")}
        </div>

        <div class="feedback" id="feedback">Выбираем фразу. К счастью, “банан” пока не стал приветствием.</div>
      `;

      document.querySelectorAll(".choice").forEach(button => {
        button.addEventListener("click", () => {
          const value = button.dataset.value;
          const feedback = document.getElementById("feedback");

          if (value === correct) {
            button.classList.add("good");

            if (state.q3Step === 0) {
              state.q3Step = 1;
              feedback.textContent = "Correct! Теперь второй секрет.";
              feedback.className = "feedback success";
              setTimeout(renderGreetingQuest, 650);
            } else {
              feedback.textContent = "Perfect! Приветствие открыто.";
              feedback.className = "feedback success";
              completeQuest(2);
            }
          } else {
            button.classList.remove("bad");
            void button.offsetWidth;
            button.classList.add("bad");
            feedback.textContent = "Oops! Это не тот пароль.";
            feedback.className = "feedback error";
          }
        });
      });
    }

    function completeQuest(index) {
      setTimeout(() => {
        state.done[index] = true;
        if (index < 2) state.currentQuest = index + 1;
        render();
      }, 520);
    }

    function renderReward() {
      questPanel.innerHTML = `
        <div class="reward-screen">
          <h2 class="quest-title">You got the key!</h2>
          <p class="quest-instruction">Буквы и приветствия пройдены. Новая локация открыта.</p>
          <div class="key" aria-label="Золотой ключ"></div>
          <p class="feedback success">Отлично! Можно переходить к уроку 2.</p>
        </div>
      `;
      createConfetti();
    }

    function createConfetti() {
      confetti.innerHTML = "";
      const colors = ["#ff5c5c", "#ffca3a", "#38d983", "#2894ff", "#7c5cff", "#ff6fae"];

      for (let i = 0; i < 80; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti-piece";
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.top = "-30px";
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = 1.9 + Math.random() * 2.2 + "s";
        piece.style.animationDelay = Math.random() * .35 + "s";
        piece.style.transform = "rotate(" + Math.random() * 360 + "deg)";
        confetti.appendChild(piece);
      }

      setTimeout(() => {
        confetti.innerHTML = "";
      }, 4200);
    }

    function shuffle(array) {
      return array
        .map(value => ({ value, sort: Math.random() }))
        .sort((a, b) => a.sort - b.sort)
        .map(item => item.value);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
